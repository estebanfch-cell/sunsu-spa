<style>
  :root {
    /* Misma paleta que sunsu.html */

    --blue:#8FA8C8;    --blue-l:#EEF3FA;   --blue-ll:#F5F8FC;

function lecturaEnVista(accion) {
  if (!accion) return false;
  if (accion.startsWith("get") || accion.endsWith("_list") || accion.endsWith("_get")) return true;
  return ["whoami", "version", "getVersion", "home", "erp_home", "asis_hoy", "asis_periodo", "asis_auditoria", "asis_config", "asis_dia", "asis_foto", "asis_vacaciones", "asis_aviso", "horarios_list", "push_clave", "citas_proximas", "stk_saldo", "stk_kardex", "clientes_resumen", "cliente_detalle", "personal_personas", "reporte_consumos", "periodo_consignacion", "reorden_sugerir", "refs", "buscarPaquetes", "buscarGiftCards", "buscarCliente", "existeCedula", "usuarioBloqueado", "betaTablas", "betaFilas", "cabinaManoObraSugerida", "refrescarTelefonos"].includes(accion);
}
async function api(accion, body = {}) {
  if (state.vista && accion !== "ver_como" && !lecturaEnVista(accion)) {
    return { error: "Estás viendo como " + (state.vista.name || "otra persona") + ". Sal de la vista para guardar." };
  }
  if (previewOn()) return previewApi(accion, body);
  const payload = { accion, ...body, ...(state.vista ? { preview_uid: state.vista.uid, preview: true } : {}) };
  if (state.token) payload.token = state.token;
  let res;
  try {
    res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
  } catch {
    return { error: "No hay conexión con la función api. El PIN entra cuando el coordinador la publique." };
  }
  let data;
  try { data = await res.json(); } catch { return { error: "La función no devolvió JSON." }; }
  if (data && data.requiere_aprobacion && !body.aprobar_negativo) {
    const ok = window.confirm(data.error || "El stock quedaría negativo. ¿Aprobar y dejar constancia de quién lo autorizó?");
    if (!ok) return data;
    return api(accion, { ...body, aprobar_negativo: true });
  }
  return data;
}

function parseRoute() {
  const parts = (location.hash.replace(/^#/, "") || "/m/inicio").split("/").filter(Boolean);
  if (parts[0] === "doc") return { kind: "doc", doc: parts[1] || "", id: decodeURIComponent(parts[2] || ""), mod: "", sub: "", tab: "" };
  if (parts[0] === "s") return { kind: "sunsu", tab: parts[1] || "ticket", doc: "", id: "", mod: "", sub: "" };
  return { kind: "mod", mod: parts[1] || "inicio", sub: parts[2] || "", doc: "", id: decodeURIComponent(parts[3] || ""), tab: "" };
}
function moduloDeRuta(route) {
  if (!route || route.kind !== "mod") return route && route.mod || "";
  if (route.mod === "personal") {
    if (route.sub === "comisiones") return "comisiones";
    if (route.sub === "rol") return "rol_pagos";
    return "asistencia";
  }
  if (route.mod === "gift") return route.sub === "paquetes" ? "paquetes" : "gift_cards";
  if (route.mod === "citas" || route.mod === "inicio") return "inicio";
  if (route.mod === "lugares") return "inventario";
  if (route.mod === "conteos" && route.sub === "hacer") return "inicio";
  return route.mod;
}
function tituloRuta(route, tab) {
  if (route.mod === "configuracion") return "Configuración general";
  if (route.mod === "lugares") return "Locales y cabinas";
  if (route.mod === "conteos") return route.sub === "hacer" ? "Hacer conteo" : (route.sub ? "Conteo físico" : "Conteos físicos");
  if (route.mod === "compras" && route.sub === "nueva") return "Nueva OC";
  if (route.mod === "compras" && route.sub && route.sub !== "rfq") return "Orden de compra";
  if (route.mod === "inventario" && route.sub === "nuevo") return "Nuevo producto";
  if (route.mod === "inventario" && route.sub === "prod") return "Producto";
  if (route.mod === "inventario" && !route.sub) return "Inventario";
  if (route.mod === "inventario") return "Stock";
  if (route.mod === "reportes") return "Consumos / reportes";
  if (route.mod === "personal") return etiquetaMia({ comisiones: "Mis comisiones", rol: "Mi rol de pagos", asistencia: "Mi asistencia", permisos: "Permisos y vacaciones", multas: "Multas", horarios: "Horarios" }[route.sub] || "Personal");
  if (route.mod === "gift") return route.sub === "paquetes" ? (route.id ? "Paquete" : "Paquetes") : (route.id ? "Gift card" : "Gift cards");
  if (route.mod === "citas") return "Citas";
  if (route.kind === "doc" && route.doc === "cot") return "Cotización";
  if (tab) return tituloSunsu(tab);
  if (route.kind === "doc") return tituloDoc(route.doc);
  return (MENU.find((m) => m[0] === route.mod) || ["", "Sistema central"])[1];
}

  for (const row of SUNSU_MENU) {
    if (row[3] === "admin" && !state.admin) continue;
    spa.push([row[0], row[1], row[2]]);
  }
  if (acceso("cabina") !== "no") spa.push(["cabina", "Cabina", "#/m/cabina"]);
  add("Spa", "✨", spa);

function pintarFly() {
  const shell = document.getElementById("shell");
  const fly = document.getElementById("fly");
  const scrim = document.getElementById("scrim");
  if (!shell || !fly || !scrim) return;
  const id = grupoAbierto;
  shell.querySelectorAll(".grp").forEach((el) => el.classList.toggle("on", el.getAttribute("data-group") === id));
  const root = document.getElementById("app");
  if (root) {
    root.querySelectorAll(".tab, .tab-more").forEach((el) => {
      const gid = el.getAttribute("data-group");
      const cur = location.hash || "#/m/inicio";
      const abierto = gid === id;
      const aqui = phoneItems(gid).some((row) => row[2] === cur);
      el.classList.toggle("on", abierto || (!id && aqui));
    });
  }
  if (!id) {
    fly.hidden = true;
    fly.innerHTML = "";
  } else {
    fly.hidden = false;
    const g = gruposVisibles().find((x) => x.id === id);
    const payload = id === "otros" && g
      ? { label: "Otros", items: g.items, sections: g.sections }
      : { label: grupoLabel(id), items: phoneItems(id) };
    fly.innerHTML = flyHtml(payload);
    fly.querySelectorAll("[data-go]").forEach((b) => {
      b.onclick = () => {
        grupoAbierto = "";
        go(b.getAttribute("data-go"));
      };
    });
  }
  scrim.hidden = !id;
}

function pantallaSunsu(route) {
  if (route.kind === "sunsu") return route.tab || "ticket";
  if (route.kind === "doc") {
    if (route.doc === "ov" && !route.id) return "ticket";
    if (route.doc === "cot" && !route.id) return "ticket";
    if (route.doc === "cot") return "";
    if (route.doc === "prod" && !route.id) return "catalogo";
    return "";
  }
  const m = route.mod;
  if (m === "inicio") return state.admin ? "inicio" : "staff-home";
  if (m === "tickets") return "historial";
  if (m === "clientes" || m === "reportes") return "";
  if (m === "cotizaciones_cliente") return "";
  if (m === "productos") return "catalogo";
  if (m === "inventario" && (!route.sub || route.sub === "nuevo" || route.sub === "prod")) return "";
  if (m === "inventario" && route.sub === "cabina") return "cabina";
  if (m === "inventario") return "inventario";
  if (m === "conteos" && !route.sub) return "inv-fisico";
  if (m === "conteos" || m === "lugares") return "";
  if (m === "compras") return "";
  if (m === "proveedores") return "";
  if (m === "paquetes") return "buscar-paquetes";
  if (m === "gift_cards") return "buscar-gc";

async function draw() {

  }

  if (!state.user) {

  }
  await asegurarLugares();

  const tab = pantallaSunsu(route);

  if (route.kind === "mod" && route.mod !== "inicio" && route.mod !== "citas" && acceso(gate) === "no" && !reporteOk && !adminVista) {
    main.innerHTML = `<p class="err">Este módulo no está en tu menú.</p>`;
    listo();
    return;
  }
  if (route.kind === "doc" && route.doc === "ov" && acceso("tickets") === "no") {
    main.innerHTML = `<p class="err">Este módulo no está en tu menú.</p>`;
    listo();
    return;
  }
  if (route.kind === "doc" && route.doc === "cot" && acceso("cotizaciones_cliente") === "no") {
    window._esCotizacion = false;
    main.innerHTML = `<p class="err">Este módulo no está en tu menú.</p>`;
    listo();
    return;
  }
  if (tab) {
    try { await montarSunsu(tab); }
    catch (e) { main.innerHTML = `<p class="err">${esc(e.message || e)}</p>`; }
    listo();
    return;
  }
  main.innerHTML = banner() + `<p class="note">Cargando…</p>`;
  try {
    const html = route.kind === "doc" ? await renderDoc(route) : await renderMod(route);
    main.innerHTML = banner() + html;
    bind(main, route);
    autosize(main);
  } catch (e) {

  }

function normBusca(v) {
  return String(v || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
}
function distanciaBusca(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length;
  if (!m || !n || Math.abs(m - n) > 2) return 3;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    let min = i;
    for (let j = 1; j <= n; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      const v = Math.min(cur[j - 1] + 1, prev[j] + 1, prev[j - 1] + cost);
      cur.push(v);
      if (v < min) min = v;
    }
    if (min > 2) return 3;
    prev = cur;
  }
  return prev[n];
}

        { sku: "SUNSU-01", nombre: "Facial S.O.S", tipo: "facial", cant: 1, precio: 75, desc: 0, neto: 75 },
      ] },
      { numero: "TK-SQ-0009", fecha: "2026-10-02", cliente: "Ana Luz", cedula: "1722", total: 166.2, subtotal: 166.2, descuento: 0, iva: 21.68, sinIva: 144.52, estado: "Enviada", validez: "Válida por 15 días", creado_por: "Emilia", items: [
        { sku: "SUNSU-18", nombre: "x3 Facial Reparación", tipo: "paquete", cant: 1, precio: 166.2, desc: 0, neto: 166.2 },
      ] },
    ];
  }
  if (accion === "getCotizaciones") return { ok: true, items: state.previewCots };
  if (accion === "getCotizacion") {
    const item = state.previewCots.find((c) => c.numero === body.numero);
    return item ? { ok: true, item } : { error: "No encontrada" };
  }
  const lineas = Array.isArray(body.lineas) ? body.lineas : [];
  const subtotal = lineas.reduce((a, ln) => a + (Number(ln.cant) || 0) * (Number(ln.precio) || 0), 0);
  const descuento = Math.min(subtotal, Number(body.dscVal) || 0);
  const total = Math.max(0, Math.round((subtotal - descuento) * 100) / 100);
  const sinIva = Math.round(total / 1.15 * 100) / 100;
  const iva = Math.round((total - sinIva) * 100) / 100;
  const maxCot = state.previewCots.reduce((m, c) => {
    const hit = /^COT-(\d+)$/.exec(String(c.numero || ""));
    return hit ? Math.max(m, Number(hit[1])) : m;
  }, 0);
  const numero = body.numero || ("COT-" + String(maxCot + 1).padStart(4, "0"));
  const row = {
    numero, fecha: ymdEc(), cliente: body.cliente || "", cedula: body.cedula || "",
    total, subtotal, descuento, iva, sinIva, estado: "Enviada",
    validez: body.validez || "Válida por 15 días", creado_por: "Emilia", items: lineas, lineas,
  };
  if (!body.numero) state.previewCots = state.previewCots.concat([row]);
  return { ok: true, numero, lineas, subtotal, descuento, iva, sinIva, total };
}

function cicloInicioUi(ymd) {
  const [y, m, d] = String(ymd || ymdEc()).split("-").map(Number);
  if (d >= 26) return y + "-" + String(m).padStart(2, "0") + "-26";
  const dt = new Date(Date.UTC(y, m - 2, 26));
  return dt.toISOString().slice(0, 10);
}
function cicloFinUi(ini) {
  const [y, m] = String(ini).split("-").map(Number);
  return new Date(Date.UTC(y, m, 25)).toISOString().slice(0, 10);
}
function opcionesCiclo() {
  let c = cicloInicioUi(ymdEc());
  const out = [];
  for (let i = 0; i < 8; i++) {
    out.push(c);
    const [y, m] = c.split("-").map(Number);
    c = new Date(Date.UTC(y, m - 2, 26)).toISOString().slice(0, 10);
  }
  return out;
}

function mismaPersonaCfg(a, b) {
  const na = String(a || "").trim().toLowerCase();
  const nb = String(b || "").trim().toLowerCase();
  if (!na || !nb) return false;
  if (na === nb) return true;
  const af = na.split(" ")[0];
  const bf = nb.split(" ")[0];
  return (af.length >= 3 && (nb === af || nb.startsWith(af + " "))) || (bf.length >= 3 && (na === bf || na.startsWith(bf + " ")));
}

function leerDiasHorario(form) {
  return [...form.querySelectorAll(".hor-dia[data-dia]")].map((row, i) => {
    const desde = row.querySelector("[data-desde]").value || null;
    const hasta = row.querySelector("[data-hasta]").value || null;
    let duracion = null;
    if (desde && hasta) {
      const [ah, am] = desde.split(":").map(Number);
      const [bh, bm] = hasta.split(":").map(Number);
      duracion = Math.max(0, (bh * 60 + bm) - (ah * 60 + am));
    }
    return { orden: i + 1, dia: row.getAttribute("data-dia"), trabaja: row.querySelector("[data-trabaja]").checked, desde, hasta, duracion_min: duracion };
  });
}

function urlBase64ToUint8Array(base64) {

  const reg = await navigator.serviceWorker.register("/sw.js", { scope: "/beta" }).catch(() => null);
  if (!reg || !reg.pushManager) return;

  pushListo = true;
}

let relojTipo = "entrada";
let camStream = null;
let fotoReloj = "";
function pararCamara() {
  if (camStream) {
    camStream.getTracks().forEach((t) => t.stop());
    camStream = null;
  }
  const video = document.getElementById("reloj-video");
  if (video) video.srcObject = null;
}
function mostrarFoto(dataUrl) {
  fotoReloj = dataUrl || "";
  const video = document.getElementById("reloj-video");
  const img = document.getElementById("reloj-foto");
  const tomar = document.getElementById("reloj-tomar");
  const reg = document.getElementById("reloj-registrar");
  const repetir = document.getElementById("reloj-repetir");
  if (fotoReloj) {
    if (img) { img.src = fotoReloj; img.hidden = false; }
    if (video) video.hidden = true;
    pararCamara();
    if (tomar) tomar.hidden = true;
    if (reg) reg.hidden = false;
    if (repetir) repetir.hidden = false;
  } else {
    if (img) img.hidden = true;
    if (tomar) tomar.hidden = false;
    if (reg) reg.hidden = true;
    if (repetir) repetir.hidden = true;
  }
}
async function iniciarCamara() {
  const video = document.getElementById("reloj-video");
  const err = document.getElementById("reloj-err");
  mostrarFoto("");
  pararCamara();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { fallbackCamara(); return; }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: "user" } });
    if (video) {
      video.srcObject = camStream;
      video.hidden = false;
      await video.play();
    }
    if (err) err.textContent = "";
  } catch {
    fallbackCamara();
  }
}
function fallbackCamara() {
  const input = document.getElementById("reloj-selfie");
  if (!input) return;
  input.value = "";
  input.click();
}
function tomarFoto() {
  const video = document.getElementById("reloj-video");
  const canvas = document.getElementById("reloj-canvas");
  const err = document.getElementById("reloj-err");
  const w = video && video.videoWidth ? video.videoWidth : 0;
  const h = video && video.videoHeight ? video.videoHeight : 0;
  if (!canvas || !w || !h) { if (err) err.textContent = "La cámara todavía no muestra imagen."; return; }
  canvas.width = w;
  canvas.height = h;
  const g = canvas.getContext("2d");
  g.translate(w, 0);
  g.scale(-1, 1);
  g.drawImage(video, 0, 0, w, h);
  let data = canvas.toDataURL("image/jpeg", 0.82);
  if (data.length > 1800000) data = canvas.toDataURL("image/jpeg", 0.6);
  mostrarFoto(data);
}
function cerrarCamara() {
  pararCamara();
  fotoReloj = "";
  const sheet = document.getElementById("reloj-sheet");
  if (sheet) sheet.hidden = true;
}
function abrirCamara(tipo) {
  if (state.vista) {
    const msg = "Estás viendo como " + (state.vista.name || "otra persona") + ". Sal de la vista para guardar.";
    toast(msg);
    return;
  }
  relojTipo = tipo || reloj.accion || "entrada";
  const sheet = document.getElementById("reloj-sheet");
  if (!sheet) return;
  const labels = { entrada: "Marcar entrada", salida: "Marcar salida", almuerzo_inicio: "Iniciar almuerzo", almuerzo_fin: "Fin almuerzo" };
  const title = document.getElementById("reloj-sheet-title");
  if (title) title.textContent = labels[relojTipo] || "Marcar";
  const err = document.getElementById("reloj-err");
  if (err) err.textContent = "";
  sheet.hidden = false;
  void iniciarCamara();
}
function wireReloj(root) {
  if (!root) return;
  root.querySelectorAll("[data-reloj-open]").forEach((b) => {
    b.onclick = () => abrirCamara(reloj.accion || "entrada");
  });
  const tomar = document.getElementById("reloj-tomar");
  const reg = document.getElementById("reloj-registrar");
  const repetir = document.getElementById("reloj-repetir");
  const close = document.getElementById("reloj-close");
  const input = document.getElementById("reloj-selfie");
  if (tomar && tomar.dataset.wired !== "1") { tomar.dataset.wired = "1"; tomar.onclick = () => tomarFoto(); }
  if (reg && reg.dataset.wired !== "1") { reg.dataset.wired = "1"; reg.onclick = () => marcarAsistencia(relojTipo, fotoReloj); }
  if (repetir && repetir.dataset.wired !== "1") { repetir.dataset.wired = "1"; repetir.onclick = () => { void iniciarCamara(); }; }
  if (close && close.dataset.wired !== "1") { close.dataset.wired = "1"; close.onclick = () => cerrarCamara(); }
  if (input && input.dataset.wired !== "1") {
    input.dataset.wired = "1";
    input.onchange = () => {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => mostrarFoto(String(reader.result || ""));
      reader.readAsDataURL(file);
    };
  }
}

  if (data.error) return fail(data);
  const items = (data.items || []).slice(0, 40).map((b) => `<div class="row"><div class="sku">${esc(b.id)}</div><div><div class="name">${esc(b.usuario)}</div><div class="note">${esc(b.resultado)} · ${esc(b.estado)}</div></div><div class="meta">${esc(b.ts)}</div></div>`).join("");
  return `<div class="list">${items || `<p class="note">Sin registros de esterilización.</p>`}</div>`;
}

async function renderCabina() {
  const data = await api("getCabina");
  if (data.error) return fail(data);
  if (data.sinEstructura) return `<p class="note">La estructura de cabina no está cargada en esta base.</p>`;
  const inv = (data.inventario || []).slice(0, 40).map((r) => `<div class="row"><div class="sku">${esc(r.codigo)}</div><div class="name">${esc(r.producto)}</div><div class="meta">${esc(r.stock)}</div></div>`).join("");
  return `<p class="note">${(data.protocolos || []).length} protocolos. El costo de cabina no se muestra si tu rol no ve costos: el servidor lo quita.</p><div class="list">${inv}</div>`;
}

function lugaresMovibles() {
  const rows = lugaresVisibles();
  if (state.admin) return rows;
  return rows.filter((b) => (b.tipo === "venta" || b.tipo === "cabina") && (!state.localId || b.local_id === state.localId || b.tipo === "casa" && false));
}
async function renderTrf() {
  const [data, prods] = await Promise.all([api("trf_list"), api("prod_list")]);
  if (data && data.error) return fail(data);
  const mov = lugaresMovibles();
  const origen = opcionesLugares(mov);
  const destinos = mov.filter((b) => b.tipo === "cabina");
  const destino = opcionesLugares(destinos.length ? destinos : mov);
  const productos = (prods.items || []).map((p) => `<button class="row" type="button" data-trf-prod="${esc(p.id)}" data-sku="${esc(p.sku)}" data-uso="${esc(p.uso || "")}"><div class="sku">${esc(p.sku)}</div><div class="name">${esc(p.nombre)}</div></button>`).join("");
  const items = ((data && data.items) || []).slice(0, 12).map((t) => {
    const o = lugaresVisibles().find((b) => b.id === t.origen_id);
    const d = lugaresVisibles().find((b) => b.id === t.destino_id);
    return `<div class="row"><div class="sku">${esc(t.numero)}</div><div><div class="name">${esc(t.estado)}</div><div class="note">${esc(etiquetaLugar(o))} → ${esc(etiquetaLugar(d))}</div></div></div>`;
  }).join("");
  const quien = state.admin ? "Como admin puedes mover también Casa y, cuando haya otro local, de un local a otro." : "Puedes pasar entre Venta y Cabina de tu local. Casa y otro local los mueve un admin.";
  return `<form id="f-trf">
    <label>Desde</label><select name="origen_id" aria-label="Origen">${origen}</select>
    <label>Hacia</label><select name="destino_id" aria-label="Destino">${destino}</select>
    <label>Producto</label><input id="trf-q" placeholder="Buscar por nombre o código" aria-label="Buscar producto">
    <div class="list" id="lista">${productos || `<p class="note">No hay productos en el catálogo.</p>`}</div>
    <input type="hidden" name="producto_id" id="trf-prod">
    <p class="note" id="trf-elegido">Toca un producto.</p>
    <label>Cantidad</label><input class="cnt-num" name="cantidad" inputmode="decimal" value="1" aria-label="Cantidad a pasar">
    <p class="note" id="trf-consig" hidden>Este producto es de consignación. Al pasarlo a cabina se anota para la liquidación de la quincena, a precio de compra + IVA.</p>
    <button class="btn block" type="submit">Pasar stock</button>
    <p class="note">${quien} El movimiento queda en el kardex de los dos lugares.</p>
    <p class="err" id="f-err"></p><p class="ok" id="f-ok"></p>
  </form>
  <div class="list">${items || `<p class="note">Todavía no hay transferencias.</p>`}</div>`;
}

async function renderConteos(route) {
  const sub = typeof route === "string" ? route : (route && route.sub) || "";
  const id = typeof route === "string" ? "" : (route && route.id) || "";
  window._cntAdmin = !!state.admin;
  window._cntUid = (state.user && state.user.id) || "";
  window._cntBodegas = (typeof lugaresVisibles === "function" ? lugaresVisibles() : []).map((b) => ({ id: b.id, nombre: etiquetaLugar(b), tipo: b.tipo }));
  if (typeof renderConteoFlujo === "function") return renderConteoFlujo(sub, id);
  return renderConteosClasico(sub);
}
async function renderConteosClasico(id) {
  if (id) return renderConteoUno(id);
  const data = await api("conteo_list");
  if (data.error) return fail(data);
  const lugares = state.admin ? lugaresVisibles() : lugaresDelLocal().filter((b) => b.tipo !== "casa");
  const opts = opcionesLugares(lugares.length ? lugares : lugaresDelLocal());
  const nombre = new Map(lugaresVisibles().map((b) => [b.id, etiquetaLugar(b)]));
  const items = (data.items || []).map((c) => `<button class="row" type="button" data-go="#/m/conteos/${encodeURIComponent(c.id)}"><div class="sku">${esc(c.numero)}</div><div><div class="name">${esc(c.estado)}</div><div class="note">${esc(nombre.get(c.bodega_id) || "")}</div></div></button>`).join("");
  return `<form id="f-cnt">
    <label>Qué lugar vas a contar</label><select name="bodega_id" aria-label="Lugar del conteo">${opts}</select>
    <label><input name="inicio" type="checkbox" style="width:auto"> Este es el conteo de inicio</label>
    <button class="btn block" type="submit">Empezar conteo</button>
    <p class="note">Se abre con el saldo que ya tiene el sistema. Escribes lo que contaste. Lo que dejes en blanco no se mueve. Al aplicar, la diferencia queda en el kardex.</p>
    <p class="err" id="f-err"></p>
  </form>
  <div class="list">${items || `<p class="note">Sin conteos todavía.</p>`}</div>`;
}
async function renderConteoUno(id) {
  const data = await api("conteo_get", { conteo_id: id });
  if (data.error) return fail(data);
  const lineas = data.lineas || [];
  const pendiente = (ln) => ln.contado == null || ln.contado === "";
  const listas = lineas.filter((ln) => !pendiente(ln));
  const falta = lineas.filter(pendiente);
  const actual = falta[0] || lineas[0];
  const cerrado = data.estado === "aplicado";
  const fila = (ln) => `<button class="row" type="button" data-cnt-prod="${esc(ln.producto_id)}"><div class="sku">${esc(ln.sku)}</div><div><div class="name">${esc(ln.nombre)}</div><div class="note">en sistema ${esc(ln.sistema)}${pendiente(ln) ? "" : " · contado " + esc(ln.contado)}</div></div></button>`;
  const diffs = listas.map((ln) => {
    const d = Number(ln.contado) - Number(ln.sistema);
    return `<div class="row"><div class="sku">${esc(ln.sku)}</div><div class="name">${esc(ln.nombre)}</div><div class="meta">${d > 0 ? "+" : ""}${d}</div></div>`;
  }).join("");
  return `<p class="note">${esc(data.numero)} · ${esc(data.bodega || "Lugar")} · ${esc(data.estado)}. ${falta.length} sin contar.</p>
    <form id="f-cnt-linea">
      <input type="hidden" name="conteo_id" value="${esc(data.id)}">
      <input type="hidden" name="producto_id" id="cnt-prod" value="${esc(actual ? actual.producto_id : "")}">
      <div class="card" id="cnt-card"><div class="sku" id="cnt-sku">${esc(actual ? actual.sku : "")}</div><div class="name" id="cnt-nombre">${esc(actual ? actual.nombre : "Sin productos en este lugar")}</div>
        <p class="note" id="cnt-sistema">${actual ? "El sistema dice " + actual.sistema + ". Escribe lo que hay en la mano." : ""}</p>
      </div>
      <label>Cantidad contada</label><input class="cnt-num" name="contado" id="cnt-num" inputmode="decimal" aria-label="Cantidad contada" ${cerrado ? "disabled" : ""}>
      ${cerrado ? "" : `<button class="btn block" type="submit">Guardar esta cantidad</button>`}
      <p class="err" id="f-err"></p><p class="ok" id="f-ok"></p>
    </form>
    <input id="filtro" placeholder="Buscar producto" aria-label="Buscar producto del conteo">
    <div class="list" id="lista">${lineas.map(fila).join("") || `<p class="note">Este lugar no tiene productos compatibles.</p>`}</div>
    ${listas.length ? `<div class="card-title">Diferencias</div><div class="list">${diffs}</div>` : `<p class="note">Cuando guardes una cantidad, aquí ves la diferencia contra el sistema.</p>`}
    ${cerrado ? `<p class="note">Este conteo ya ajustó el kardex.</p>` : `<button class="btn block" type="button" id="cnt-aplicar">Aplicar ajuste</button>`}
    <p class="note">Aplicar ajuste escribe la diferencia en el kardex. Lo que no contaste se queda igual.</p>`;
}
async function renderLugares() {
  const locales = (state.lugares && state.lugares.locales) || [];
  const lugares = lugaresVisibles();
  const ix = window.SunsuInline;
  const localHtml = locales.map((l) => {
    const fila = "L:" + l.id;
    if (ix && ix.edita()) return `<div class="card">${ix.lineas("lugares", fila, [["nombre", "Local", l.nombre], ["direccion", "Dirección", l.direccion || ""]])} ${ix.borrar("lugares", fila)}</div>`;
    const pedir = ix && ix.pide() ? ix.pedir("lugares", fila, { nombre: l.nombre || "", direccion: l.direccion || "", tipo: "local" }) : "";
    return `<div class="card"><div class="name">${esc(l.nombre)}</div><div class="note">${esc(l.direccion || "")}</div>${pedir}</div>`;
  }).join("");
  const filas = lugares.map((b) => {
    const fila = "B:" + b.id;
    if (ix && ix.edita()) return `<div class="row">${ix.lineas("lugares", fila, [["nombre", "Nombre", b.nombre]])} <div class="meta">${esc(b.tipo === "casa" ? "Bodega principal" : b.tipo)} ${ix.borrar("lugares", fila)}</div></div>`;
    const pedir = ix && ix.pide() ? ix.pedir("lugares", fila, { nombre: b.nombre || "", tipo: b.tipo || "" }) : "";
    return `<div class="row"><div class="sku">${esc(b.tipo === "casa" ? "Casa" : b.tipo)}</div><div class="name">${esc(b.nombre)}</div><div class="meta">${pedir}</div></div>`;

    ${localHtml}
    <div class="list">${filas}</div>
    <div id="lug-nuevo">${mas}</div>`;
}

  const body = mods.map((mod) => `<tr><td>${esc(mod)}</td>${(data.roles || []).map((rol) => {

    if (ix && ix.edita()) return `<td class="matrix">${ix.campo("acceso", fila, "acceso", val)} ${ix.borrar("acceso", fila)}</td>`;

async function renderDoc(route) {
  if (route.doc === "prod") return renderProd(route.id);
  if (route.doc === "cat") return renderCatalogoFicha(route.id);
  if (route.doc === "oc") return route.id ? renderOc(route.id) : renderOcNueva();
  if (route.doc === "ov") return renderOv();
  if (route.doc === "tk") return renderTicketEditor(route.id);
  if (route.doc === "cot") return renderCot(route.id);
  if (route.doc === "rfq") return renderRfq();
  if (route.doc === "cli") return renderClientes();
  if (route.doc === "prov") return renderProveedoresDesk({ sub: route.id || "" });
  if (route.doc === "trf") return renderTrfNueva();
  return `<p class="note">Documento desconocido.</p>`;
}

async function renderOc(id) {
  const [data, prods] = await Promise.all([api("oc_get", { id }), api("prod_list")]);
  if (data.error) return fail(data);
  const nombre = new Map((prods.items || []).map((p) => [p.id, (p.sku || "") + " " + (p.nombre || "")]));
  const o = data.orden || {};
  const lineas = (data.lineas || []).map((ln) => `<div class="linea" data-id="${esc(ln.id)}">
      <div class="name">${celdaProd(ln.producto_id, nombre.get(ln.producto_id) || ln.producto_id)}</div>
      <div class="note">pedido ${esc(ln.cantidad)} · recibido ${esc(ln.recibido)}</div>
      <input name="cantidad" inputmode="decimal" placeholder="Recibir" aria-label="Cantidad a recibir">
      <select name="bodega" aria-label="Bodega de esta línea"><option value="">Bodega</option>${opcionesLugares()}</select>
    </div>`).join("");
  const pago = state.admin ? `
    <h2>Pago al proveedor</h2>
    <p class="note">${esc(o.estado_pago || "pendiente")} · pagado ${money(o.pagado || 0)} · saldo ${money(o.saldo ?? o.total)}</p>
    <form id="f-pago"><label>Monto</label><input name="monto" inputmode="decimal" required><button class="btn" type="submit">Registrar pago</button><p class="err" id="f-err"></p><p class="ok" id="f-ok"></p></form>
    <h2>Devolver al proveedor</h2>
    <form id="f-dev">${lineas.replaceAll('placeholder="Recibir"', 'placeholder="Devolver"').replaceAll("Cantidad a recibir", "Cantidad a devolver")}<button class="btn ghost" type="submit">Devolver</button><p class="err" id="f-err"></p><p class="ok" id="f-ok"></p></form>` : "";
  const snap = parseSnap(o);
  const docs = snap ? `<div class="tools"><button class="btn ghost small" type="button" id="btn-pedido">Pre-factura y pedido</button><button class="btn ghost small" type="button" id="btn-acta">Acta de entrega</button></div><div id="doc-out"></div>` : "";
  return `<h2>${esc(o.numero)} · ${esc(o.estado)}</h2><p class="note">Total ${money(o.total)}. ${snap ? "Consignación " + esc(snap.qLabel || "") + ". " : ""}Al recibir se actualiza el stock y el kardex. Elige el lugar de cada línea.</p>
    ${docs}
    <form id="f-rec">${lineas}<label>Factura del proveedor</label><input name="factura_prov"><button class="btn" type="submit">Recibir</button><p class="err" id="f-err"></p><p class="ok" id="f-ok"></p></form>
    ${pago}`;
}

function parseSnap(o) {
  if (o && o.snap && typeof o.snap === "object") return o.snap;
  const nota = String((o && o.nota) || "");
  if (!nota.startsWith("{")) return null;
  try { const j = JSON.parse(nota); return j && j.tipo === "consignacion" ? j : null; } catch { return null; }
}

async function renderTicketEditor(clave) {

    <label>Apellido</label><input name="apellido" value="${esc(t.apellido || "")}">
    <label>Cédula</label><input name="cedula" value="${esc(t.cedula || "")}">

function bajarReporte(tipo) {

function pctBuffer(data) {
  const b = Number(data && data.buffer);
  const ratio = Number.isFinite(b) && b >= 0 ? (b > 1 ? b / 100 : b) : 0.2;
  return Math.round(ratio * 1000) / 10;
}
function consigActual() {
  const data = window._consig || {};
  const inp = document.getElementById("consig-buffer");
  const pct = inp ? Number(inp.value) : pctBuffer(data);
  const buffer = Number.isFinite(pct) && pct >= 0 ? pct / 100 : 0.2;
  const pedir = {};
  document.querySelectorAll("[data-pedir]").forEach((el) => { pedir[el.getAttribute("data-pedir")] = Number(el.value); });
  const fact = data.fact || [];
  const restock = fact.map((it) => {
    const cant = pedir[it.sku] != null && Number.isFinite(pedir[it.sku]) ? pedir[it.sku] : Number(it.sugerido) || 0;
    return { sku: it.sku, nombre: it.nombre, compra: it.compra, vendido: it.vendido, sugerido: cant, pedir: cant };
  }).filter((it) => it.pedir > 0);
  return { ...data, buffer, fact, restock };
}
function aplicarBufferConsig() {
  const data = window._consig;
  if (!data) return;
  const pct = Number((document.getElementById("consig-buffer") || {}).value);
  const buffer = Number.isFinite(pct) && pct >= 0 ? pct / 100 : 0.2;
  data.buffer = buffer;
  (data.fact || []).forEach((it) => {
    it.sugerido = it.vendido > 0 ? Math.ceil(it.vendido * (1 + buffer)) : 0;
    const el = document.querySelector('[data-pedir="' + it.sku + '"]');
    if (el) el.value = it.sugerido;
  });
}

function pdfPaginas(paginas) {
  const escPdf = (t) => String(t).replace(/\\/g, "\\\\").replace(/\(/g, "\\(").replace(/\)/g, "\\)");
  const chunks = [];
  for (const lineas of paginas) {
    let y = 800;
    let cmds = ["BT", "/F1 10 Tf"];
    const cerrar = () => { cmds.push("ET"); chunks.push(cmds.join("\n")); };
    for (const ln of lineas) {
      if (y < 48) { cerrar(); cmds = ["BT", "/F1 10 Tf"]; y = 800; }
      cmds.push(`1 0 0 1 48 ${y} Tm (${escPdf(ln).slice(0, 110)}) Tj`);
      y -= 14;
    }
    cerrar();
  }
  const objs = [];
  objs.push("1 0 obj<< /Type /Catalog /Pages 2 0 R >>endobj");
  const kids = chunks.map((_, i) => (3 + i * 2) + " 0 R").join(" ");
  objs.push(`2 0 obj<< /Type /Pages /Count ${chunks.length} /Kids [${kids}] >>endobj`);
  chunks.forEach((stream, i) => {
    const page = 3 + i * 2;
    const content = page + 1;
    objs.push(`${page} 0 obj<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Contents ${content} 0 R /Resources<< /Font<< /F1 ${3 + chunks.length * 2} 0 R >> >> >>endobj`);
    objs.push(`${content} 0 obj<< /Length ${stream.length} >>stream\n${stream}\nendstream endobj`);
  });
  const font = 3 + chunks.length * 2;
  objs.push(`${font} 0 obj<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>endobj`);
  let pdf = "%PDF-1.3\n";
  const xref = [0];
  for (const o of objs) { xref.push(pdf.length); pdf += o + "\n"; }
  const start = pdf.length;
  pdf += `xref\n0 ${xref.length}\n`;
  pdf += "0000000000 65535 f \n";
  for (let i = 1; i < xref.length; i++) pdf += String(xref[i]).padStart(10, "0") + " 00000 n \n";
  pdf += `trailer<< /Size ${xref.length} /Root 1 0 R >>\nstartxref\n${start}\n%%EOF`;
  return pdf;
}
function bajarArchivo(nombre, texto, mime) {

async function corregirMarca(form, anular) {
  const fecha = new Date().toLocaleDateString("en-CA", { timeZone: "America/Guayaquil" });
  const id = form.elements.namedItem("id").value.trim();
  const hora = form.elements.namedItem("hora").value.trim();
  const motivo = form.elements.namedItem("motivo").value.trim();
  const err = form.querySelector("#f-err-corr");
  const body = { id, motivo };
  if (anular) body.anulado = true;
  else if (!hora) { err.textContent = "Escribe la hora, por ejemplo 09:05."; return; }
  else body.ts = fecha + "T" + hora.slice(0, 5) + ":00-05:00";
  const data = await api("asis_corregir", body);
  if (data.error) { err.textContent = data.error; return; }
  recargarAsis();
}

async function marcarAsistencia(tipo, foto) {
  const err = document.getElementById("reloj-err");
  if (err) err.textContent = "";
  if (state.vista) {
    const msg = "Estás viendo como " + (state.vista.name || "otra persona") + ". Sal de la vista para guardar.";
    if (err) err.textContent = msg;
    toast(msg);
    return;
  }
  if (!foto) { if (err) err.textContent = "Falta la selfie."; return; }
  const body = { tipo, origen: window.innerWidth > 860 ? "recepcion" : "telefono", foto };
  try {
    const pos = await new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 });
    });
    body.lat = pos.coords.latitude;
    body.lng = pos.coords.longitude;
    body.precision_m = pos.coords.accuracy;
  } catch {
    if (err) err.textContent = "Sin la ubicación del teléfono no se puede marcar.";
    return;
  }
  const data = await api("asis_marcar", body);
  if (data.error) { if (err) err.textContent = data.error; return; }
  cerrarCamara();
  toast(tipo === "salida" ? "Salida marcada" : tipo === "entrada" ? "Entrada marcada" : "Marca guardada");
  await cargarReloj();
  if ((location.hash || "").indexOf("asistencia") >= 0) recargarAsis();
}
