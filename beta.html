<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2a211c">
<title>Sunsu · Sistema Central BETA</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-beta.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAAjUlEQVR42u3boQ2AQBAEwC8Eg6UCeqA2Gn2HeftIGiAk3I5YcXbEZZPLtW1dZnIaAADPcB57RAAAAAAAAAAAAAAAAADgNYBx9c8DAEBxgPgdAAAAAACaIAAANQDKN0EAAAAAAAAAAABNEAAAOwAAAAAA4gDcBgGEA2iCAAAAAAAAAAAAAAD8F8DvMIC83FNeRXlbgRroAAAAAElFTkSuQmCC">
<style>
  :root {
    --ink: #241c18;
    --muted: #6f625a;
    --line: #e6dbd0;
    --paper: #f6f1ea;
    --card: #fffdfb;
    --side: #2a211c;
    --side-dim: #cbbbae;
    --accent: #8d4b38;
    --ok: #2c6b4a;
    --warn: #8a5a12;
    --danger: #8d3030;
    --shadow: 0 16px 40px rgba(36, 28, 24, 0.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.45;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  h1, h2, .brand {
    font-family: Georgia, "Iowan Old Style", Palatino, serif;
    font-weight: 500;
    letter-spacing: -0.02em;
  }
  .login {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px 20px 64px;
  }
  .login-card {
    width: min(420px, 100%);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 36px 32px 32px;
  }
  .pill {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12px;
    letter-spacing: 0.14em;
    white-space: nowrap;
  }
  .brand { font-size: 40px; margin: 18px 0 6px; }
  .lede { color: var(--muted); margin: 0 0 28px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input, select, textarea {
    width: 100%;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  textarea { min-height: 88px; resize: vertical; }
  .pin { font-size: 28px; letter-spacing: 0.4em; text-align: center; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--ink);
    color: #f6f1ea;
    border: 0;
    border-radius: 999px;
    padding: 12px 18px;
    white-space: nowrap;
  }
  .btn.wide { width: 100%; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn.small { padding: 8px 12px; font-size: 14px; }
  .err { color: var(--danger); min-height: 1.2em; margin: 0 0 12px; }
  .app { min-height: 100vh; display: grid; grid-template-columns: 248px 1fr; }
  .side {
    background: var(--side);
    color: #f6f1ea;
    padding: 22px 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .side .brand { font-size: 28px; margin: 10px 8px 0; }
  .side nav { overflow: auto; display: flex; flex-direction: column; gap: 2px; margin-top: 12px; padding-right: 4px; }
  .side button.nav {
    text-align: left;
    background: transparent;
    color: var(--side-dim);
    border: 0;
    border-radius: 10px;
    padding: 10px 12px;
    white-space: nowrap;
  }
  .side button.nav.on, .side button.nav:hover { background: rgba(255,255,255,.08); color: #fff; }
  .who { margin-top: auto; padding: 12px; color: var(--side-dim); font-size: 13px; }
  .who strong { color: #fff; display: block; font-weight: 600; }
  .main { min-width: 0; }
  .top {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 28px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: rgba(246, 241, 234, .92);
    backdrop-filter: blur(8px);
    z-index: 5;
  }
  .top h1 { font-size: 26px; margin: 0; flex: 1; }
  .menu-btn { display: none; }
  .crear { position: relative; }
  .crear-menu {
    position: absolute;
    right: 0;
    top: calc(100% + 8px);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    min-width: 240px;
    padding: 8px;
    z-index: 6;
  }
  .crear-menu button {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: 0;
    border-radius: 10px;
    padding: 10px 12px;
    white-space: nowrap;
  }
  .crear-menu button:hover { background: var(--paper); }
  .content { padding: 28px; max-width: 1080px; }
  .banner {
    background: #f3e6d4;
    border: 1px solid #e4d0b4;
    color: #5c4328;
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 22px;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }
  .card .k { color: var(--muted); font-size: 13px; }
  .card .v { font-family: Georgia, serif; font-size: 28px; margin-top: 4px; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row {
    display: grid;
    grid-template-columns: 92px 1fr auto;
    gap: 14px;
    align-items: center;
    width: 100%;
    text-align: left;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
  }
  .row .sku { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
  .name {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.35;
  }
  .meta { color: var(--muted); font-size: 13px; white-space: nowrap; text-align: right; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 16px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .note { color: var(--muted); }
  .ok { color: var(--ok); }
  .linea {
    display: grid;
    grid-template-columns: 1.4fr 90px 110px 140px auto;
    gap: 8px;
    align-items: start;
    margin-bottom: 8px;
  }
  .linea input, .linea select { margin: 0; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 14px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 13px; color: var(--muted); font-weight: 600; }
  .matrix select { margin: 0; padding: 8px; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .side {
      position: fixed;
      z-index: 20;
      width: min(280px, 86vw);
      transform: translateX(-105%);
      transition: transform .2s ease;
    }
    .app.nav-open .side { transform: none; }
    .menu-btn { display: inline-flex; }
    .content, .top { padding-left: 16px; padding-right: 16px; }
    .linea { grid-template-columns: 1fr 1fr; }
    .row { grid-template-columns: 72px 1fr; }
    .meta { grid-column: 2; text-align: left; white-space: normal; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const PROD_API = "https://heuolwxyxoezkewyufrl.supabase.co/functions/v1/api";
const local = location.hostname === "localhost" || location.hostname === "127.0.0.1";
const API = local && new URLSearchParams(location.search).get("api") || PROD_API;
const VENTA = "11111111-1111-4111-8111-111111111111";
const CABINA = "22222222-2222-4222-8222-222222222222";
const MENU = [
  ["inicio", "Inicio"],
  ["tickets", "Tickets"],
  ["productos", "Productos"],
  ["inventario", "Inventario"],
  ["compras", "Compras"],
  ["transferencias", "Transferencias"],
  ["conteos", "Conteos"],
  ["kardex", "Kardex"],
  ["clientes", "Clientes"],
  ["proveedores", "Proveedores"],
  ["cotizaciones_cliente", "Cotizaciones"],
  ["comisiones", "Comisiones"],
  ["rol_pagos", "Rol de pagos"],
  ["asistencia", "Asistencia"],
  ["paquetes", "Paquetes"],
  ["gift_cards", "Gift cards"],
  ["caja", "Caja"],
  ["bitacora", "Bitácora"],
  ["cabina", "Cabina"],
  ["usuarios", "Usuarios"],
  ["permisos", "Permisos"],
];
const state = { token: localStorage.getItem("sunsu.beta.token") || "", user: null, acceso: {}, verCostos: false, admin: false, mega: false };

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function money(n) {
  const x = Number(n);
  return Number.isFinite(x) ? "$" + x.toFixed(2) : "";
}
function acceso(mod) { return state.acceso[mod] || "no"; }
function uuid() { return crypto.randomUUID(); }

async function api(accion, body = {}) {
  const payload = { accion, ...body };
  if (state.token) payload.token = state.token;
  let res;
  try {
    res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
  } catch {
    return { error: "No hay conexión con la función api. El PIN entra cuando el coordinador la publique." };
  }
  let data;
  try { data = await res.json(); } catch { return { error: "La función no devolvió JSON." }; }
  if (data && data.requiere_aprobacion && !body.aprobar_negativo) {
    const ok = window.confirm(data.error || "El stock quedaría negativo. ¿Aprobar y dejar constancia de quién lo autorizó?");
    if (!ok) return data;
    return api(accion, { ...body, aprobar_negativo: true });
  }
  return data;
}

function applySession(data) {
  state.user = data.user || null;
  state.verCostos = !!data.ver_costos;
  state.acceso = {};
  for (const m of data.modulos || []) state.acceso[m.modulo] = m.acceso;
  const rol = state.user && state.user.role;
  state.admin = rol === "admin" || rol === "super_admin";
  state.mega = rol === "super_admin";
}

function parseRoute() {
  const parts = (location.hash.replace(/^#/, "") || "/m/inicio").split("/").filter(Boolean);
  if (parts[0] === "doc") return { kind: "doc", doc: parts[1] || "", id: decodeURIComponent(parts[2] || "") };
  return { kind: "mod", mod: parts[1] || "inicio", sub: parts[2] || "" };
}

function go(hash) {
  if (location.hash === hash) draw();
  else location.hash = hash;
}

function autosize(root) {
  root.querySelectorAll("textarea").forEach((t) => {
    const fit = () => { t.style.height = "auto"; t.style.height = Math.max(88, t.scrollHeight) + "px"; };
    t.addEventListener("input", fit);
    fit();
  });
}

function paintLogin(msg) {
  document.getElementById("app").innerHTML = `
    <main class="login">
      <form class="login-card" id="login-form">
        <span class="pill">BETA</span>
        <div class="brand">Sunsu</div>
        <p class="lede">Sistema central en prueba. La app de todos los días no cambia.</p>
        <label for="pin">PIN</label>
        <input id="pin" class="pin" name="pin" inputmode="numeric" autocomplete="off" maxlength="8" required>
        <p class="err" id="login-err">${esc(msg || "")}</p>
        <button class="btn wide" id="login-btn" type="submit">Entrar</button>
      </form>
    </main>`;
  document.getElementById("login-form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const pin = document.getElementById("pin").value.trim();
    const btn = document.getElementById("login-btn");
    btn.disabled = true;
    const data = await api("login", { pin });
    btn.disabled = false;
    if (!data.ok || !data.token) {
      document.getElementById("login-err").textContent = data.error || "PIN incorrecto";
      return;
    }
    state.token = data.token;
    localStorage.setItem("sunsu.beta.token", data.token);
    applySession(data);
    go("#/m/inicio");
  });
}

function crearItems() {
  const items = [];
  if (acceso("tickets") !== "no") items.push(["Ticket (orden de venta)", "#/doc/ov"]);
  if (acceso("cotizaciones_cliente") === "todos") items.push(["Cotización a clienta", "#/doc/cot"]);
  if (state.admin && acceso("compras") !== "no") {
    items.push(["Cotización de compra", "#/doc/rfq"]);
    items.push(["Orden de compra", "#/doc/oc"]);
  }
  if (state.admin && acceso("productos") !== "no") items.push(["Producto", "#/doc/prod"]);
  if (acceso("clientes") !== "no") items.push(["Cliente", "#/doc/cli"]);
  if (state.admin && acceso("proveedores") !== "no") items.push(["Proveedor", "#/doc/prov"]);
  if (acceso("transferencias") === "todos") items.push(["Transferencia", "#/doc/trf"]);
  return items;
}

function paintShell(title) {
  const nav = MENU.filter(([id]) => acceso(id) !== "no").map(([id, label]) => {
    const on = parseRoute().mod === id ? " on" : "";
    return `<button class="nav${on}" type="button" data-go="#/m/${id}">${esc(label)}</button>`;
  }).join("");
  const crear = crearItems().map(([label, hash]) => `<button type="button" data-go="${esc(hash)}">${esc(label)}</button>`).join("");
  const u = state.user || {};
  document.getElementById("app").innerHTML = `
    <div class="app" id="shell">
      <aside class="side">
        <span class="pill">BETA</span>
        <div class="brand">Sunsu</div>
        <nav>${nav}</nav>
        <div class="who"><strong>${esc(u.name || "")}</strong>${esc(u.role || "")}${u.es_cosmetologa ? " · cuenta para N" : ""}<br><button class="nav" type="button" id="salir">Salir</button></div>
      </aside>
      <section class="main">
        <header class="top">
          <button class="btn ghost small menu-btn" type="button" id="menu">Menú</button>
          <h1>${esc(title || "Sistema central")}</h1>
          <div class="crear">
            <button class="btn" type="button" id="crear">Crear</button>
            <div class="crear-menu" id="crear-menu" hidden>${crear}</div>
          </div>
        </header>
        <div class="content" id="main"></div>
      </section>
    </div>`;
  document.getElementById("salir").onclick = () => {
    state.token = "";
    localStorage.removeItem("sunsu.beta.token");
    paintLogin();
  };
  document.getElementById("menu").onclick = () => document.getElementById("shell").classList.toggle("nav-open");
  document.getElementById("crear").onclick = () => {
    const menu = document.getElementById("crear-menu");
    menu.hidden = !menu.hidden;
  };
  document.getElementById("app").querySelectorAll("[data-go]").forEach((b) => {
    b.onclick = () => {
      document.getElementById("crear-menu").hidden = true;
      document.getElementById("shell").classList.remove("nav-open");
      go(b.getAttribute("data-go"));
    };
  });
}

function banner() {
  return `<div class="banner">Esta es la beta. sunsu.html sigue siendo la operación. Lo que guardes aquí vive en Supabase.</div>`;
}
function fail(data) {
  return `<p class="err">${esc((data && data.error) || "No se pudo cargar.")}</p>`;
}
function lineHtml(opts) {
  const precio = opts.precio ? `<input name="precio" inputmode="decimal" placeholder="Precio" aria-label="Precio">` : `<input type="hidden" name="precio" value="0">`;
  const bodega = opts.bodega ? `<select name="bodega" aria-label="Bodega"><option value="">Bodega</option><option value="${VENTA}">Venta</option><option value="${CABINA}">Cabina</option></select>` : `<input type="hidden" name="bodega" value="">`;
  const clase = opts.clase ? `<select name="clase" aria-label="Clase"><option value="producto">Producto</option><option value="servicio">Servicio</option></select>` : `<input type="hidden" name="clase" value="producto">`;
  return `<div class="linea">
    <input name="sku" placeholder="SKU" aria-label="SKU" autocomplete="off">
    <input name="cantidad" inputmode="decimal" placeholder="Cant." aria-label="Cantidad" value="1">
    ${precio}${bodega}${clase}
    <button class="btn ghost small" type="button" data-quitar>Quitar</button>
  </div>`;
}
function bindLines(root) {
  root.querySelectorAll("[data-quitar]").forEach((b) => {
    b.onclick = () => b.closest(".linea").remove();
  });
}
function readLines(root) {
  return [...root.querySelectorAll(".linea")].map((row) => ({
    sku: row.querySelector("[name=sku]").value.trim(),
    cantidad: Number(row.querySelector("[name=cantidad]").value),
    precio: Number(row.querySelector("[name=precio]").value || 0),
    bodega_id: row.querySelector("[name=bodega]").value,
    clase: row.querySelector("[name=clase]").value || "producto",
  })).filter((l) => l.sku && l.cantidad > 0);
}

async function draw() {
  if (!state.token) { paintLogin(); return; }
  if (!state.user) {
    const who = await api("whoami");
    if (!who.ok) { state.token = ""; localStorage.removeItem("sunsu.beta.token"); paintLogin(who.error); return; }
    applySession(who);
  }
  const route = parseRoute();
  const title = route.kind === "doc" ? tituloDoc(route.doc) : (MENU.find((m) => m[0] === route.mod) || ["", "Sistema central"])[1];
  paintShell(title);
  const main = document.getElementById("main");
  main.innerHTML = banner() + `<p class="note">Cargando…</p>`;
  try {
    const html = route.kind === "doc" ? await renderDoc(route) : await renderMod(route);
    main.innerHTML = banner() + html;
    bind(main, route);
    autosize(main);
  } catch (e) {
    main.innerHTML = banner() + `<p class="err">${esc(e.message || e)}</p>`;
  }
}

function tituloDoc(doc) {
  return {
    ov: "Nuevo ticket", cot: "Cotización a clienta", rfq: "Cotización de compra",
    oc: "Orden de compra", prod: "Producto", cli: "Cliente", prov: "Proveedor", trf: "Transferencia",
  }[doc] || "Documento";
}

async function renderMod(route) {
  if (acceso(route.mod) === "no" && route.mod !== "inicio") return `<p class="err">Este módulo no está en tu menú.</p>`;
  if (route.mod === "inicio") return renderInicio();
  if (route.mod === "productos") return renderProductos();
  if (route.mod === "inventario") return renderInventario(route.sub || "venta");
  if (route.mod === "compras") return renderCompras();
  if (route.mod === "tickets") return renderTickets();
  if (route.mod === "kardex") return renderKardex();
  if (route.mod === "clientes") return renderClientes();
  if (route.mod === "proveedores") return renderProveedores();
  if (route.mod === "cotizaciones_cliente") return renderCotizaciones();
  if (route.mod === "comisiones") return renderComisiones();
  if (route.mod === "rol_pagos") return renderRol();
  if (route.mod === "asistencia") return renderAsistencia();
  if (route.mod === "paquetes") return renderPaquetes();
  if (route.mod === "gift_cards") return renderGift();
  if (route.mod === "caja") return renderCaja();
  if (route.mod === "bitacora") return renderBitacora();
  if (route.mod === "cabina") return renderCabina();
  if (route.mod === "transferencias") return renderTrf();
  if (route.mod === "conteos") return renderConteos();
  if (route.mod === "permisos") return renderPermisos();
  if (route.mod === "usuarios") return renderUsuarios();
  return `<p class="note">Módulo sin pantalla todavía.</p>`;
}

async function renderInicio() {
  const data = await api("home");
  if (data.error && !data.bajos) return fail(data) + `<p class="note">Inicio lee el inventario ERP. Si la base todavía no tiene 0009, el resto de módulos de hoja sigue disponible.</p>`;
  const bajos = (data.bajos || []).slice(0, 8).map((b) => `<div class="row"><div class="sku">${esc(b.sku)}</div><div><div class="name">${esc(b.nombre)}</div></div><div class="meta">${esc(b.bodega)} · ${esc(b.stock)} / mín ${esc(b.stock_min)}</div></div>`).join("");
  let pulso = "";
  if (state.admin) {
    const dash = await api("getDashboardHoy", {});
    if (!dash.error && dash.hoy && dash.semana) {
      const dias = (dash.semana.dias || []).map((d) => `<div class="card"><div class="k">${esc(d.label)}</div><div class="v">${money(d.total)}</div><div class="note">${esc(d.tickets)} tickets</div></div>`).join("");
      const semanas = (dash.mes.semanas || []).filter((w) => Number(w.total) > 0).map((w) => `<div class="row"><div class="name">${esc(w.label)}</div><div class="meta">${money(w.total)}</div></div>`).join("");
      pulso = `<h2>Hoy</h2>
        <div class="grid">
          <div class="card"><div class="k">Tickets</div><div class="v">${esc(dash.hoy.tickets ?? 0)}</div></div>
          <div class="card"><div class="k">Venta</div><div class="v">${money(dash.hoy.venta)}</div></div>
          <div class="card"><div class="k">Semana</div><div class="v">${money(dash.semana.total)}</div></div>
          <div class="card"><div class="k">${esc(dash.mes.nombre || "Mes")}</div><div class="v">${money(dash.mes.total)}</div></div>
        </div>
        <h2>Semana</h2><div class="grid">${dias}</div>
        <h2>Mes</h2><div class="list">${semanas || `<p class="note">Sin ventas este mes.</p>`}</div>`;
    }
  }
  return `${pulso}
    <div class="grid">

function horaEc(ts) {
  const d = new Date(ts || "");
  if (!ts || Number.isNaN(d.getTime())) return "";
  return d.toLocaleString("es-EC", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", timeZone: "America/Guayaquil" });
}
function etiquetaMarca(tipo) {
  return { entrada: "Entrada", salida: "Salida", almuerzo_inicio: "Almuerzo", almuerzo_fin: "Fin de almuerzo" }[tipo] || tipo;
}

async function renderDoc(route) {
  if (route.doc === "prod") return renderProd(route.id);
  if (route.doc === "oc") return route.id ? renderOc(route.id) : renderOcNueva();
  if (route.doc === "ov") return renderOv();
  if (route.doc === "cot") return renderCot();
  if (route.doc === "rfq") return renderRfq();
  if (route.doc === "cli") return renderClientes();
  if (route.doc === "prov") return renderProveedores();
  if (route.doc === "trf") return renderTrfNueva();
  return `<p class="note">Documento desconocido.</p>`;
}

function bind(main) {
  main.querySelectorAll("[data-go]").forEach((b) => {
    b.onclick = () => {
      const shell = document.getElementById("shell");
      if (shell) shell.classList.remove("nav-open");
      const menu = document.getElementById("crear-menu");
      if (menu) menu.hidden = true;
      go(b.getAttribute("data-go"));
    };
  });
  const filtro = main.querySelector("#filtro");
  if (filtro) filtro.addEventListener("input", () => {
    const q = filtro.value.toLowerCase();
    main.querySelectorAll("#lista .row").forEach((row) => {
      row.hidden = q && !row.textContent.toLowerCase().includes(q);
    });
  });
  const add = main.querySelector("#add-line");
  if (add) add.onclick = () => {
    const box = main.querySelector("#lineas");
    const precio = !!box.querySelector("[name=precio]:not([type=hidden])") || !!main.querySelector("#f-oc, #f-ov, #f-cot");
    const bodega = !!main.querySelector("#f-oc");
    const clase = !!main.querySelector("#f-ov");
    box.insertAdjacentHTML("beforeend", lineHtml({ precio, bodega, clase }));
    bindLines(box);
  };
  bindLines(main);
  const form = (id, fn) => {
    const f = main.querySelector(id);
    if (f) f.addEventListener("submit", async (ev) => { ev.preventDefault(); await fn(f); });
  };
  form("#f-prod", saveProd);
  form("#f-oc", saveOc);
  form("#f-rec", saveRec);
  form("#f-pago", savePago);
  form("#f-dev", saveDev);
  form("#f-ov", saveOv);
  form("#f-cot", saveCot);
  form("#f-rfq", saveRfq);
  form("#f-rfq-line", saveRfqLine);
  form("#f-cli", saveCli);
  form("#f-prov", saveProv);
  form("#f-trf", saveTrf);
  form("#f-caja", saveCaja);
  wireAsistencia(main);
  form("#f-paq", savePaq);
  form("#f-cnt", saveCnt);
  const adj = main.querySelector("#adjudicar");
  if (adj) adj.onclick = () => adjudicar(main);
  main.querySelectorAll("select[data-rol]").forEach((sel) => {
    sel.addEventListener("change", async () => {
      const data = await api("permisos_guardar", { rol: sel.dataset.rol, modulo: sel.dataset.mod, acceso: sel.value });
      const err = main.querySelector("#f-err");
      if (data.error) { err.textContent = data.error; sel.value = sel.dataset.prev || "no"; }
      else err.textContent = "";
      sel.dataset.prev = sel.value;
    });
    sel.dataset.prev = sel.value;
  });
}

function setMsg(form, data, okText) {
  const err = form.querySelector("#f-err") || form.parentElement.querySelector("#f-err");
  const ok = form.querySelector("#f-ok");
  if (data.error) { if (err) err.textContent = data.error; if (ok) ok.textContent = ""; return false; }
  if (err) err.textContent = "";
  if (ok) ok.textContent = okText || "Listo";
  return true;
}

function wireAsistencia(main) {
  main.querySelectorAll("[data-marca]").forEach((b) => {

  });
  const perm = main.querySelector("#f-asis-perm");

    ev.preventDefault();
    const data = await api("asis_permiso_solicitar", Object.fromEntries(new FormData(perm).entries()));
    const err = main.querySelector("#f-err-perm");
    if (data.error) { err.textContent = data.error; return; }
    go("#/m/asistencia");
  });
  main.querySelectorAll("[data-aprobar]").forEach((b) => {
    b.onclick = async (ev) => {
      ev.stopPropagation();
      const data = await api("asis_permiso_resolver", { id: b.getAttribute("data-aprobar"), estado: "APROBADO" });
      if (data.error) { main.querySelector("#f-err-perm").textContent = data.error; return; }
      go("#/m/asistencia");
    };
  });
  const cfg = main.querySelector("#f-asis-cfg");
  if (cfg) cfg.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const body = Object.fromEntries(new FormData(cfg).entries());
    const data = await api("asis_config_guardar", body);
    const err = main.querySelector("#f-err-cfg");
    if (data.error) { err.textContent = data.error; return; }
    go("#/m/asistencia");
  });
  main.querySelectorAll("[data-foto]").forEach((b) => {
    b.onclick = async () => {
      const data = await api("asis_foto", { id: b.getAttribute("data-foto") });
      const err = main.querySelector("#f-err-marca");
      if (data.error) { if (err) err.textContent = data.error; return; }
      window.open(data.url, "_blank", "noopener");
    };
  });
  main.querySelectorAll("[data-usar]").forEach((b) => {
    b.onclick = () => {
      const corr = main.querySelector("#f-asis-corr");
      const id = corr && corr.elements.namedItem("id");
      const hora = corr && corr.elements.namedItem("hora");
      if (id) id.value = b.getAttribute("data-usar");
      if (hora) hora.focus();
    };
  });
  const corr = main.querySelector("#f-asis-corr");
  if (corr) {
    corr.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      await corregirMarca(corr, false);
    });
    main.querySelector("#asis-anular").onclick = () => corregirMarca(corr, true);
  }
  const fer = main.querySelector("#f-asis-fer");
  if (fer) fer.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const data = await api("asis_feriado", Object.fromEntries(new FormData(fer).entries()));
    const err = main.querySelector("#f-err-fer");
    if (data.error) { err.textContent = data.error; return; }
    go("#/m/asistencia");
  });
  const mes = main.querySelector("#f-asis-mes");
  if (mes) mes.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const [anio, m] = (mes.mes.value || "").split("-");
    const data = await api("asis_periodo", { anio: Number(anio), mes: Number(m) });
    const box = main.querySelector("#asis-mes");
    if (data.error) { box.innerHTML = fail(data); return; }
    box.innerHTML = (data.personas || []).map((p) => `<div class="card"><div class="k">${esc(p.nombre)}</div><div class="note">Supl ${esc(p.hrsSupl)} h · Extr ${esc(p.hrsExtr)} h · Descanso ${esc(p.hrsDesc)} h · Atraso ${esc(p.atrasoMin)} min · Faltas ${esc(p.faltas)}${p.hayDatos ? "" : " · sin marcas, el rol no recorta el sueldo"}</div></div>`).join("") || `<p class="note">Sin personas.</p>`;
  });
}

async function corregirMarca(form, anular) {
  const fecha = new Date().toLocaleDateString("en-CA", { timeZone: "America/Guayaquil" });
  const id = form.elements.namedItem("id").value.trim();
  const hora = form.elements.namedItem("hora").value.trim();
  const motivo = form.elements.namedItem("motivo").value.trim();
  const err = form.querySelector("#f-err-corr");
  const body = { id, motivo };
  if (anular) body.anulado = true;
  else if (!hora) { err.textContent = "Escribe la hora, por ejemplo 09:05."; return; }
  else body.ts = fecha + "T" + hora.slice(0, 5) + ":00-05:00";
  const data = await api("asis_corregir", body);
  if (data.error) { err.textContent = data.error; return; }
  go("#/m/asistencia");
}

async function marcarAsistencia(tipo, main) {
  const err = main.querySelector("#f-err-marca");
  err.textContent = "";
  const file = main.querySelector("#selfie").files[0];
  if (!file) { err.textContent = "Falta la selfie."; return; }
  const body = { tipo, origen: main.querySelector("#origen-pc")?.checked ? "recepcion" : "telefono" };
  try {
    const pos = await new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 });
    });
    body.lat = pos.coords.latitude;
    body.lng = pos.coords.longitude;
    body.precision_m = pos.coords.accuracy;
  } catch {
    err.textContent = "Sin la ubicación del teléfono no se puede marcar.";
    return;
  }
  body.foto = await new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(file);
  });
  const data = await api("asis_marcar", body);
  if (data.error) { err.textContent = data.error; return; }
  go("#/m/asistencia");
}
async function savePaq(form) {
  const data = await api("buscarPaquetes", { q: form.q.value });
  const out = document.getElementById("f-out");
  if (data.error) { out.innerHTML = fail(data); return; }
  const items = data.resultados || data.items || data.paquetes || (Array.isArray(data) ? data : []);
  out.innerHTML = `<div class="list">${(items || []).map((p) => `<div class="row"><div class="sku">${esc(p.sku || p.cedula)}</div><div><div class="name">${esc(p.paquete || p.nombre || "")}</div><div class="note">${esc((p.nombre || "") + " " + (p.apellido || ""))}</div></div><div class="meta">${esc(p.usados ?? "")}/${esc((p.usos || []).length)}</div></div>`).join("") || `<p class="note">Sin resultados.</p>`}</div>`;
}
async function saveCnt(form) {
  const data = await api("conteo_abrir", { bodega_id: form.bodega_id.value });
  setMsg(form, data, data.numero ? "Abierto " + data.numero : "Listo");
}

window.addEventListener("hashchange", draw);
if ("serviceWorker" in navigator && !local) {
  navigator.serviceWorker.getRegistrations().then((regs) => {
    for (const reg of regs) {
      let path = "/";
      try { path = new URL(reg.scope).pathname || "/"; } catch { path = "/"; }
      const script = (reg.active && reg.active.scriptURL) || (reg.waiting && reg.waiting.scriptURL) || (reg.installing && reg.installing.scriptURL) || "";
      if ((path === "/" || path === "") && script.indexOf("/sw.js") >= 0) reg.unregister();
    }
  }).catch(() => {});
  navigator.serviceWorker.register("/sw.js", { scope: "/beta" }).catch(() => {});
}
draw();
</script>
