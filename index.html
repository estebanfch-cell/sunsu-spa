<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5B7FA6">
<title>순수 Sunsu Spa</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-sunsu-192.png" type="image/png" sizes="192x192">
<link rel="icon" href="/icon-sunsu-64.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="/icon-sunsu-180.png" sizes="180x180">
<meta name="apple-mobile-web-app-title" content="Sunsu">
<meta name="application-name" content="순수 Sunsu Spa">
<script>
(function () {
  function pintarRecuperacion(err) {
    if (window.__sunsuRecuperacion) return;
    window.__sunsuRecuperacion = true;
    var msg = "La app no pudo arrancar.";
    try {
      if (err && (err.message || err)) msg = String(err.message || err);
      else if (window.__sunsuBootErrs && window.__sunsuBootErrs.length) msg = String(window.__sunsuBootErrs[0]);
    } catch (e0) {}
    var box = document.getElementById("app") || document.body;
    if (!box) return;
    box.innerHTML = '<div style="min-height:100vh;background:#F5F0E8;color:#3A3530;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,sans-serif">' +
      '<div style="max-width:22rem;background:#fff;border-radius:16px;padding:22px 18px;box-shadow:0 10px 30px rgba(61,90,122,.12)">' +
      "<h1 style=\"margin:0 0 8px;font-size:1.15rem;color:#3D5A7A\">No se pudo abrir la app</h1>" +
      '<p style="margin:0 0 16px;font-size:.9rem;line-height:1.45">Hubo un error al cargar. Recarga la página. Si vuelve a pasar, entra de nuevo.</p>' +
      '<p id="sunsu-boot-err" style="margin:0 0 16px;font-size:.75rem;color:#8A90A0;word-break:break-word"></p>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<button type="button" id="sunsu-boot-reload" style="background:#3D5A7A;color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer">Recargar</button>' +
      '<button type="button" id="sunsu-boot-reset" style="background:#fff;color:#3D5A7A;border:1.5px solid #3D5A7A;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer">Entrar de nuevo</button>' +
      "</div></div></div>";
    var p = document.getElementById("sunsu-boot-err");
    if (p) p.textContent = msg;
    var a = document.getElementById("sunsu-boot-reload");
    if (a) a.onclick = function () { location.reload(); };
    var b = document.getElementById("sunsu-boot-reset");
    if (b) b.onclick = function () {
      try {
        localStorage.removeItem("sunsu.beta.token");
        localStorage.removeItem("sunsu.beta.sesion");
        sessionStorage.clear();
      } catch (e1) {}
      location.reload();
    };
  }
  window.sunsuPantallaRecuperacion = pintarRecuperacion;
  window.__sunsuBootErrs = [];
  window.addEventListener("error", function (ev) {
    window.__sunsuBootErrs.push((ev && ev.error) ? String(ev.error) : String((ev && ev.message) || "error"));
  });
  window.addEventListener("unhandledrejection", function (ev) {
    window.__sunsuBootErrs.push(String((ev && ev.reason) || "promesa"));
  });
  function revisarBoot() {
    if (window.__sunsuRecuperacion) return;
    if (typeof window.draw !== "function") {
      pintarRecuperacion(window.__sunsuBootErrs[0] || "El script principal no cargó");
    }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function () { setTimeout(revisarBoot, 0); });
  else setTimeout(revisarBoot, 0);
})();
</script>

  if (!state.vista && state.user && state.user.tiene_usuario) return false;
  const real = state.userReal || (!state.vista ? state.user : null);
  return !!(real && !real.tiene_usuario);
}

  try { sessionStorage.setItem("sunsu.beta.avisoPin", "1"); } catch (eA) {}
  const b = document.getElementById("aviso-pin-5d"); if (b) b.remove();
  const m = document.getElementById("aviso-pin-modal"); if (m) m.remove();

function sunsuTrasCrearUsuario() {
  state.tiene_usuarioReal = true;
  if (state.user) state.user.tiene_usuario = true;
  if (state.userReal) state.userReal.tiene_usuario = true;
  try {
    const j = cargarSesionLocal();
    if (j) { j.tiene_usuario = true; if (j.user) j.user.tiene_usuario = true; if (j.userReal) j.userReal.tiene_usuario = true; localStorage.setItem("sunsu.beta.sesion", JSON.stringify(j)); }

  const k = document.querySelector("a.top-icon[href='#/m/acceso']"); if (k) k.remove();
  cerrarAvisoPinSesion();
  try { sessionStorage.removeItem("sunsu.beta.avisoPin"); } catch (eS) {}
}

function rutaRetiradaAProductos(route) {
  // TK123: Stock Venta, Stock Cabina y la pantalla suelta de códigos ya no están en el menú.
  if (!route || route.kind !== "mod") return false;
  if (route.mod === "barras") return true;
  if (route.mod === "inventario" && (route.sub === "venta" || route.sub === "cabina")) return true;
  return false;
}
function parseRoute() {
  const raw = (location.hash.replace(/^#/, "") || "/m/inicio");
  const path = raw.split("?")[0];
  const parts = path.split("/").filter(Boolean);
  if (parts[0] === "doc") return { kind: "doc", doc: parts[1] || "", id: decodeURIComponent(parts[2] || ""), mod: "", sub: "", tab: "" };
  if (parts[0] === "s") return { kind: "sunsu", tab: parts[1] || "ticket", doc: "", id: "", mod: "", sub: "" };
  return { kind: "mod", mod: parts[1] || "inicio", sub: parts[2] || "", doc: "", id: decodeURIComponent(parts[3] || ""), tab: "" };
}
function rutaInventarioAdmin(route) {
  if (!route || route.kind !== "mod") return false;
  if (route.mod === "barras" || route.mod === "transferencias" || route.mod === "ajustes" || route.mod === "lugares" || route.mod === "kardex") return true;
  if (route.mod === "inventario") return true; // el personal usa #/m/productos
  return false;
}
function moduloDeRuta(route) {
  if (!route || route.kind !== "mod") return route && route.mod || "";
  if (route.mod === "personal") {
    if (route.sub === "comisiones") return "comisiones";
    if (route.sub === "rol") return "rol_pagos";
    return "asistencia";
  }
  if (route.mod === "gift") return route.sub === "paquetes" ? "paquetes" : "gift_cards";
  if (route.mod === "citas" || route.mod === "inicio") return "inicio";
  if (route.mod === "borradores") return "tickets"; // TK94: Facturas borrador vive en Ventas con el permiso de Tickets
  if (route.mod === "lugares") return "inventario";
  if (route.mod === "conteos") return "inicio"; // TK108: el personal abre el conteo físico (el servidor limita)
  if (route.mod === "ajustes") return "inventario";
  // 📦 Abrir producto: cualquiera del equipo; el costo por facial va por inventario (y los $ por ver_costos en el servidor).
  if (route.mod === "aperturas") return route.sub === "costo" ? "inventario" : "inicio";
  // 🔑 Mi acceso: cada quien el suyo (la lista del equipo la decide el servidor: solo admin).
  if (route.mod === "acceso") return "inicio";
  if (route.mod === "portal") return "inicio"; // 📱 Cuentas de la app: el servidor exige admin
  if (route.mod === "solicitudes") return "inicio";
  // 🏷️ Códigos de barras: mismo permiso que Productos (generar/asignar es solo admin en el servidor).
  if (route.mod === "barras") return "productos";
  return route.mod;
}

function bindDataGo(root) {
  if (!root || !root.querySelectorAll) return;
  root.querySelectorAll("[data-go]").forEach((b) => {
    b.onclick = (ev) => {
      if (ev && ev.preventDefault) ev.preventDefault();
      const shell = document.getElementById("shell");
      if (shell) shell.classList.remove("nav-open");
      const menu = document.getElementById("crear-menu");
      if (menu) menu.hidden = true;
      go(b.getAttribute("data-go"));
    };
  });
}

/* TK209 (Emilia): las listas no deben saltar al inicio al refrescar ni al volver del detalle.
   Conserva scroll, filtros y búsqueda (Tickets, Clientes, Pagos recibidos, Inventario). */
window.SunsuListaPos = (function () {
  var KEY = "sunsu.lista.pos.v1.";
  var prevHash = (typeof location !== "undefined" && location.hash) || "";
  var restoring = false;
  var watchers = {};
  function isWin(el) { return !el || el === window || el === document || el === document.documentElement || el === document.body; }
  function yOf(el) {
    if (isWin(el)) return window.scrollY || document.documentElement.scrollTop || document.body.scrollTop || 0;
    return el.scrollTop || 0;
  }
  function goY(el, y) {
    y = Math.max(0, Number(y) || 0);
    if (isWin(el)) {
      try { window.scrollTo(0, y); } catch (e) {}
      try { document.documentElement.scrollTop = y; } catch (e2) {}
      try { document.body.scrollTop = y; } catch (e3) {}
    } else { el.scrollTop = y; }
  }
  function scrollersNear(root) {
    var out = [window], seen = { window: 1 };
    function add(el) {
      if (!el || seen[el === window ? "window" : (el.id || "") + ":" + (el.className || "")]) return;
      seen[el === window ? "window" : (el.id || el.className || Math.random())] = 1;
      out.push(el);
    }
    var starts = [];
    if (root) starts.push(root);
    ["hist-res", "content", "main", "inv-root", "mccj-root", "mccl-root", "app", "shell"].forEach(function (id) {
      var el = document.getElementById(id); if (el) starts.push(el);
    });
    document.querySelectorAll(".sheet-scroll, .tk-list, .desk-list, .mob-cards, #ss-md-tickets-lb, #ss-md-clientes-lb").forEach(function (el) { starts.push(el); });
    starts.forEach(function (el) {
      var n = el;
      var hops = 0;
      while (n && n !== document.body && hops++ < 12) {
        try {
          var st = window.getComputedStyle(n);
          if (st && (st.overflowY === "auto" || st.overflowY === "scroll" || st.webkitOverflowScrolling === "touch") && n.scrollHeight > n.clientHeight + 8) add(n);
        } catch (e) {}
        n = n.parentElement;
      }
    });
    return out;
  }
  function keyFromHash(h) {
    var p = String(h || location.hash || "").split("?")[0];
    if (/^#\/m\/tickets(\/?$)/.test(p) || p === "#/s/historial") return "tickets";
    if (/^#\/m\/clientes(\/?$)/.test(p)) return "clientes";
    if (/^#\/m\/caja\/pagos/.test(p)) return "pagos";
    if (/^#\/m\/inventario(\/?$)/.test(p) || p === "#/m/inventario/lista") return "inventario";
    return "";
  }
  function snapshot(name) {
    var ys = {};
    scrollersNear(document.getElementById("hist-res") || document.getElementById("inv-root") || document.getElementById("mccj-root") || document.getElementById("main")).forEach(function (el, i) {
      ys[isWin(el) ? "win" : ("e" + i)] = { y: yOf(el), win: isWin(el) };
    });
    var st = {
      y: yOf(window),
      ys: ys,
      busq: window._histBusqueda || "",
      filtro: window._histFiltroActual || {},
      cosm: window._histCosmFiltro || "",
      tkFiltro: window._tkFiltro || {},
      invQ: window._invQ || "",
      cliQ: (window.MCClientes && window.MCClientes.q) || window._cliQ || "",
      pagDesde: window._pagDesde || "",
      pagHasta: window._pagHasta || "",
      ts: Date.now()
    };
    try { sessionStorage.setItem(KEY + name, JSON.stringify(st)); } catch (e) {}
    window._listaPosMem = window._listaPosMem || {};
    window._listaPosMem[name] = st;
    return st;
  }
  function read(name) {
    var mem = (window._listaPosMem || {})[name];
    if (mem) return mem;
    try { return JSON.parse(sessionStorage.getItem(KEY + name) || "null"); } catch (e) { return null; }
  }
  function applyFilters(name, st) {
    if (!st || name !== "tickets") return;
    if (st.busq != null && window._histBusqueda == null) window._histBusqueda = st.busq;
    if (st.filtro && !window._histFiltroActual) window._histFiltroActual = st.filtro;
    if (st.cosm && window._histCosmFiltro == null) window._histCosmFiltro = st.cosm;
    if (st.tkFiltro && !window._tkFiltro) window._tkFiltro = st.tkFiltro;
  }
  function applyY(st) {
    if (!st) return;
    restoring = true;
    goY(window, st.y);
    var list = scrollersNear(document.getElementById("hist-res") || document.getElementById("inv-root") || document.getElementById("mccj-root") || document.getElementById("main"));
    if (st.ys) {
      list.forEach(function (el, i) {
        if (isWin(el) && st.ys.win) goY(window, st.ys.win.y);
        var hit = st.ys["e" + i];
        if (hit && !hit.win) goY(el, hit.y);
      });
    }
    setTimeout(function () { restoring = false; }, 400);
  }
  function save(name) {
    name = name || keyFromHash(prevHash) || keyFromHash(location.hash);
    if (!name) return null;
    return snapshot(name);
  }
  function saveFromCurrent() {
    var k = keyFromHash(prevHash);
    if (k) snapshot(k);
    prevHash = location.hash || prevHash;
  }
  function restore(name, opts) {
    name = name || keyFromHash(location.hash);
    if (!name) return;
    var st = read(name);
    if (!st) return;
    applyFilters(name, st);
    var run = function () { applyY(st); };
    run();
    if (typeof requestAnimationFrame === "function") {
      requestAnimationFrame(function () {
        run();
        requestAnimationFrame(run);
      });
    }
    setTimeout(run, 50);
    setTimeout(run, 250);
    if (!(opts && opts.inplace)) setTimeout(run, 500);
  }
  function watch(name) {
    name = name || keyFromHash(location.hash);
    if (!name || watchers[name]) return;
    watchers[name] = true;
    var on = function () {
      if (restoring) return;
      if (keyFromHash(location.hash) !== name && keyFromHash(prevHash) !== name) return;
      snapshot(name);
    };
    window.addEventListener("scroll", on, { passive: true, capture: true });
    document.addEventListener("scroll", on, { passive: true, capture: true });
  }
  function markHash(h) { if (h) prevHash = h; }
  return { keyFromHash: keyFromHash, save: save, saveFromCurrent: saveFromCurrent, restore: restore, watch: watch, markHash: markHash, _prev: function () { return prevHash; } };
})();

function go(hash) {
  if (window.SunsuListaPos) window.SunsuListaPos.saveFromCurrent();
  if (typeof window._ticketAntesDeIr === "function") window._ticketAntesDeIr(hash);
  if (location.hash === hash) draw();
  else location.hash = hash;
}

function autosize(root) {
  root.querySelectorAll("textarea").forEach((t) => {
    const fit = () => { t.style.height = "auto"; t.style.height = Math.max(88, t.scrollHeight) + "px"; };

function paintLogin(msg) {
  try { if (window._tkCacheLimpiar) window._tkCacheLimpiar(); } catch (eC) {}
  // TK163: inicio de la app = «Iniciar sesión» (usuario o correo + contraseña) / «Crear cuenta». El PIN del
  // equipo queda como acceso discreto («Personal Sunsu: entrar con PIN») mientras todas crean su usuario.
  if (window.SunsuPortal && !window._sunsuLoginViejo) { window.SunsuPortal.paintInicio(msg); return; }
  window._sunsuLoginViejo = false;
  paintLoginEquipo(msg);
}
window.paintLoginPin = function () { localStorage.setItem("sunsu.beta.loginModo", "pin"); window._sunsuLoginViejo = true; paintLogin(""); };
window.sunsuEntrarEquipo = function (data) {
  state.token = data.token;
  localStorage.setItem("sunsu.beta.token", data.token);
  applySession(data);
  if (data.debe_cambiar) { paintCambiarClave(); return; }
  go(destinoInicio());
};

    personal.push(["asistencia", "Multas", "#/m/personal/multas"]);

  if (personal.length) out.push({ id: "personal", label: "👤 Personal", items: personal });

  if (esRolCitas()) add("Citas", "📅", [["inicio", "Mis citas", "#/m/citas"]]);

function fmtReloj(min) {

}

function htmlReloj() {
  const abierto = !!reloj.abierto;
  const texto = abierto ? "Marcar salida" : "Marcar entrada";
  let crono = "";
  if (abierto) {
    const base = Number(reloj.transcurridoMin || 0) * 60000 + Math.max(0, Date.now() - (reloj._t0 || Date.now()));
    const s = Math.floor(base / 1000);
    const hh = String(Math.floor(s / 3600)).padStart(2, "0");
    const mm = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
    const ss = String(s % 60).padStart(2, "0");
    crono = `<span class="asis-timer" title="Tiempo desde la entrada">${hh}:${mm}:${ss}</span>`;
  }
  return `<button class="reloj-btn ${abierto ? "salida" : "entrada"}" type="button" data-reloj-open="1">${esc(texto)}</button>${crono}`;

function codigoCat(sku) {
  return String(sku || "").toUpperCase().replace(/^SUNSU-/, "");
}
function tipoNumerico(tipo) {
  return /FACIAL|PAQUETE|ADD|EXTRA|SERVICIO/.test(String(tipo || "").toUpperCase());
}
function prefijosCatalogo(rows) {
  const set = new Set();
  (rows || []).forEach((p) => {
    const m = codigoCat(p.sku).match(/^([A-Z]{2,3})-\d+/);
    if (m) set.add(m[1]);
  });
  return [...set].sort();
}
function siguientePrefijo(rows, pref) {
  let max = 0;
  (rows || []).forEach((p) => {
    const m = codigoCat(p.sku).match(new RegExp("^" + pref + "-(\\d+)$"));
    if (m) max = Math.max(max, Number(m[1]));
  });
  return "SUNSU-" + pref + "-" + String(max + 1).padStart(3, "0");
}
function siguienteSunsuNN(rows) {
  let max = 0;
  (rows || []).forEach((p) => {
    const m = String(p.sku || "").toUpperCase().match(/^SUNSU-(\d+)$/);
    if (m) max = Math.max(max, Number(m[1]));
  });
  return "SUNSU-" + String(max + 1).padStart(2, "0");
}
function skuNuevoDe(rows, tipo, prefijo) {
  if (tipoNumerico(tipo)) return siguienteSunsuNN(rows);
  const pref = String(prefijo || "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 3);
  return pref.length >= 2 ? siguientePrefijo(rows, pref) : "";
}
function vivosCatalogo(sub, real, comision) {
  const venta = Number(sub) || 0;
  const costo = Number(real) || 0;
  const com = Math.round(Math.max(0, venta - (Number(comision) || 0)) * PCT_COM_PROD * 100) / 100;
  const faltaCosto = !(costo > 0);
  const util = faltaCosto ? 0 : Math.round((venta - costo - com) * 100) / 100;
  return { com, util, faltaCosto };
}

async function asegurarLugares() {
  const ttl = 10 * 60 * 1000;
  if (state.lugares && state.lugares.locales && state._lugaresAt && Date.now() - state._lugaresAt < ttl) return;
  const hit = swrGet("lugares_list", { local_id: state.localId || "" });
  if (hit && hit.d && hit.d.locales && Date.now() - hit.t < ttl) {
    state.lugares = hit.d;
    state._lugaresAt = hit.t;
    const activosHit = (hit.d.locales || []).filter((l) => l.activo !== false);
    state.unLocal = activosHit.length < 2;
    if (!state.localId || !activosHit.some((l) => l.id === state.localId)) {
      state.localId = hit.d.local_id || (activosHit[0] && activosHit[0].id) || state.localId;
    }
    return;
  }
  const data = await apiSWR("lugares_list", { local_id: state.localId || "" }, { maxAge: ttl, noRefresh: true });
  if (!data || data.error || !data.locales) return;
  state.lugares = data;
  state._lugaresAt = Date.now();
  const activos = (data.locales || []).filter((l) => l.activo !== false);
  state.unLocal = activos.length < 2;
  if (!state.localId || !activos.some((l) => l.id === state.localId)) {
    state.localId = data.local_id || (activos[0] && activos[0].id) || LOCAL_ESQUINA;
  }
}

function previewCotizacion(accion, body) {
  if (!state.previewCots) {
    state.previewCots = [
      { numero: "COT-0042", fecha: "2026-10-24", cliente: "María Paz", cedula: "1711", total: 75, subtotal: 75, descuento: 0, iva: 9.78, sinIva: 65.22, estado: "Enviada", validez: "Válida por 15 días", creado_por: "Emilia", items: [
        { sku: "SUNSU-01", nombre: "Facial S.O.S", tipo: "facial", cant: 1, precio: 75, desc: 0, neto: 75 },
      ] },
      { numero: "TK-SQ-0009", fecha: "2026-10-02", cliente: "Ana Luz", cedula: "1722", total: 166.2, subtotal: 166.2, descuento: 0, iva: 21.68, sinIva: 144.52, estado: "Enviada", validez: "Válida por 15 días", creado_por: "Emilia", items: [
        { sku: "SUNSU-18", nombre: "x3 Facial Reparación", tipo: "paquete", cant: 1, precio: 166.2, desc: 0, neto: 166.2 },
      ] },
    ];
  }
  if (accion === "getCotizaciones") return { ok: true, items: state.previewCots };
  if (accion === "getCotizacion") {
    const item = state.previewCots.find((c) => c.numero === body.numero);
    return item ? { ok: true, item } : { error: "No encontrada" };
  }
  const lineas = Array.isArray(body.lineas) ? body.lineas : [];
  const subtotal = lineas.reduce((a, ln) => a + (Number(ln.cant) || 0) * (Number(ln.precio) || 0), 0);
  const descuento = Math.min(subtotal, Number(body.dscVal) || 0);
  const total = Math.max(0, Math.round((subtotal - descuento) * 100) / 100);
  const sinIva = Math.round(total / 1.15 * 100) / 100;
  const iva = Math.round((total - sinIva) * 100) / 100;
  const maxCot = state.previewCots.reduce((m, c) => {
    const hit = /^COT-(\d+)$/.exec(String(c.numero || ""));
    return hit ? Math.max(m, Number(hit[1])) : m;
  }, 0);
  const numero = body.numero || ("COT-" + String(maxCot + 1).padStart(4, "0"));
  const row = {
    numero, fecha: ymdEc(), cliente: body.cliente || "", cedula: body.cedula || "",
    total, subtotal, descuento, iva, sinIva, estado: "Enviada",
    validez: body.validez || "Válida por 15 días", creado_por: "Emilia", items: lineas, lineas,
  };
  if (!body.numero) state.previewCots = state.previewCots.concat([row]);
  return { ok: true, numero, lineas, subtotal, descuento, iva, sinIva, total };
}

function pintarCotizaciones() {
  const q = normBusca((document.getElementById("filtro-cot") || {}).value || "");
  const key = window._cotSort || "fecha";
  const dir = window._cotDir || -1;
  const rows = (window._cotRows || []).filter((c) => !q || normBusca([c.numero, c.cliente, c.cedula, c.estado].join(" ")).includes(q));
  rows.sort((a, b) => {
    const va = key === "total" ? Number(a.total) || 0 : String(a[key] || "").toLowerCase();
    const vb = key === "total" ? Number(b.total) || 0 : String(b[key] || "").toLowerCase();
    if (va < vb) return -dir;
    if (va > vb) return dir;
    return String(a.numero || "").localeCompare(String(b.numero || ""));
  });
  const body = document.getElementById("lista");
  if (!body) return;
  body.innerHTML = rows.map(filaCotizacion).join("") || `<tr><td colspan="6">No hay cotizaciones.</td></tr>`;

function cicloInicioUi(ymd) {
  const [y, m, d] = String(ymd || ymdEc()).split("-").map(Number);
  if (d >= 26) return y + "-" + String(m).padStart(2, "0") + "-26";
  const dt = new Date(Date.UTC(y, m - 2, 26));
  return dt.toISOString().slice(0, 10);
}
function cicloFinUi(ini) {
  const [y, m] = String(ini).split("-").map(Number);
  return new Date(Date.UTC(y, m, 25)).toISOString().slice(0, 10);
}
function opcionesCiclo() {
  let c = cicloInicioUi(ymdEc());
  const out = [];
  for (let i = 0; i < 8; i++) {
    out.push(c);
    const [y, m] = c.split("-").map(Number);
    c = new Date(Date.UTC(y, m - 2, 26)).toISOString().slice(0, 10);
  }
  return out;
}

}

function estadoAsisHoy(marcajes) {

  const ms = (marcajes || []).filter((m) => !m.anulado && m.tipo !== "almuerzo_inicio" && m.tipo !== "almuerzo_fin").slice().sort((a, b) => String(a.ts).localeCompare(String(b.ts)));

    if (m.tipo === "entrada" || m.tipo === "almuerzo_fin") {
      if (m.tipo === "almuerzo_fin" && almuerzoDesde != null) { almuerzoMs += t - almuerzoDesde; almuerzoDesde = null; }
      desde = t; estado = "trabajando";
    } else if (m.tipo === "almuerzo_inicio") {
      if (desde != null) trabajadoMs += t - desde;
      desde = null; almuerzoDesde = t; estado = "almuerzo"; tuvoAlmuerzo = true;
    } else if (m.tipo === "salida") {
      if (desde != null) trabajadoMs += t - desde;

function leerDiasHorario(form) {

    const desde = row.querySelector("[data-desde]").value || null;
    const hasta = row.querySelector("[data-hasta]").value || null;
    let duracion = null;
    if (desde && hasta) {
      const [ah, am] = desde.split(":").map(Number);
      const [bh, bm] = hasta.split(":").map(Number);
      duracion = Math.max(0, (bh * 60 + bm) - (ah * 60 + am));

  });
}

function urlBase64ToUint8Array(base64) {

}

  if (!reg || !reg.pushManager) return;

}

function wireMarcasAdmin(cont, onCambio, fechaIni, abierto) {
  const det = cont.querySelector("[data-mk-de]");
  if (!det) return;
  const nombre = det.getAttribute("data-mk-de");
  const selF = det.querySelector("[data-mk-fecha]");
  const box = det.querySelector("[data-mk-box]");
  const motivo = () => (det.querySelector("[data-mk-motivo]").value || "").trim() || "Corrección de marca";
  if (fechaIni) selF.value = fechaIni;
  const ts = (hora) => selF.value + "T" + String(hora).slice(0, 5) + ":00-05:00";
  const cargar = async () => {
    box.innerHTML = `<p class="note">Cargando…</p>`;
    const data = await api("asis_marcas_admin", { nombre, fecha: selF.value });
    if (data.error) { box.innerHTML = `<p class="err">${esc(data.error)}</p>`; return; }
    box.innerHTML = htmlMarcasAdminDia(data);
    const err = (m) => { const e = box.querySelector("[data-mk-err]"); if (e) e.textContent = m || ""; };
    const hecho = async (res) => { if (res && res.error) { err(res.error); return; } await onCambio(selF.value); };
    box.querySelectorAll("[data-mk-id]").forEach((row) => {
      const id = row.getAttribute("data-mk-id");
      const g = row.querySelector("[data-mk-guardar]");
      if (g) g.onclick = async () => {
        const hora = row.querySelector("[data-mk-hora]").value;
        if (!hora) { err("Elige la hora."); return; }
        await hecho(await api("asis_corregir", { id, tipo: row.querySelector("[data-mk-tipo]").value, ts: ts(hora), motivo: motivo() }));
      };
      const b = row.querySelector("[data-mk-borrar]");
      if (b) b.onclick = async () => {
        if (!confirm("¿Borrar esta marca? Queda en el historial y se puede restaurar.")) return;
        await hecho(await api("asis_corregir", { id, anulado: true, motivo: motivo() }));
      };
      const rs = row.querySelector("[data-mk-restaurar]");
      if (rs) rs.onclick = async () => hecho(await api("asis_corregir", { id, anulado: false, motivo: motivo() }));
    });
    const add = box.querySelector("[data-mk-agregar]");
    if (add) add.onclick = async () => {
      const hora = box.querySelector("[data-mk-nhora]").value;
      if (!hora) { err("Elige la hora."); return; }
      await hecho(await api("asis_marca_manual", { nombre, tipo: box.querySelector("[data-mk-ntipo]").value, ts: ts(hora), motivo: motivo() }));
    };
  };
  selF.onchange = cargar;
  det.addEventListener("toggle", () => { if (det.open && !box.querySelector(".mk-row")) cargar(); });
  if (abierto) { det.open = true; cargar(); }
}

// TK175 (urgente): la selfie se achica en el teléfono antes de subir (máx. 800 px, JPEG ~0.7, objetivo < 300 KB).
function selfieComprimida(fuente, w, h, espejo) {
  const max = 800;
  const k = Math.min(1, max / Math.max(w || 1, h || 1));
  const cw = Math.max(1, Math.round(w * k)), ch = Math.max(1, Math.round(h * k));
  const c = document.createElement("canvas");
  c.width = cw; c.height = ch;
  const g = c.getContext("2d");
  if (espejo) { g.translate(cw, 0); g.scale(-1, 1); }
  g.drawImage(fuente, 0, 0, cw, ch);
  let q = 0.7, data = c.toDataURL("image/jpeg", q);
  while (data.length > 400000 && q > 0.35) { q -= 0.1; data = c.toDataURL("image/jpeg", q); }
  if (data.length > 400000) {
    const c2 = document.createElement("canvas");
    c2.width = Math.round(cw / 2); c2.height = Math.round(ch / 2);
    c2.getContext("2d").drawImage(c, 0, 0, c2.width, c2.height);
    data = c2.toDataURL("image/jpeg", 0.6);
  }
  return data;
}
function selfieDesdeArchivo(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onerror = () => resolve("");
    reader.onload = () => {
      const raw = String(reader.result || "");
      const img = new Image();
      img.onload = () => { try { resolve(selfieComprimida(img, img.naturalWidth, img.naturalHeight, false)); } catch { resolve(raw); } };
      // HEIC u otro formato que el navegador no abre: se manda igual; el servidor guarda la marca sin foto.
      img.onerror = () => resolve(raw);
      img.src = raw;
    };
    reader.readAsDataURL(file);
  });
}

function hmEc(ts) {
  const d = new Date(ts || "");
  if (!ts || Number.isNaN(d.getTime())) return "";
  const p = new Intl.DateTimeFormat("en-GB", { timeZone: "America/Guayaquil", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(d);
  return (p.find((x) => x.type === "hour") || {}).value + ":" + (p.find((x) => x.type === "minute") || {}).value;
}
function horaEc(ts) {
  const d = new Date(ts || "");
  if (!ts || Number.isNaN(d.getTime())) return "";
  return d.toLocaleString("es-EC", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", timeZone: "America/Guayaquil" });
}

function parseSnap(o) {
  if (o && o.snap && typeof o.snap === "object") return o.snap;
  const nota = String((o && o.nota) || "");

  try { const j = JSON.parse(nota); return j && j.tipo === "consignacion" ? j : null; } catch { return null; }
}

async function abrirCliente(key) {

  if (!window._cliAbierto) {
    window._cliAbierto = true;

    pintarClientes(window._cliQ || "");

    document.querySelectorAll("#lista [data-cli]").forEach((tr) => tr.classList.toggle("on", tr.getAttribute("data-cli") === key));
  }

  const cards = typeof _buildTicketCard === "function"
    ? visitas.map((t) => _buildTicketCard(t, admin)).join("")

      <div style="font-size:0.65rem;font-weight:700;color:var(--gray);text-transform:uppercase;margin-bottom:9px;letter-spacing:0.5px">Resumen — ${esc(c.nombre || "")} · ${esc(visitas.length)} ticket(s)</div>
      ${ficha}
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr${gasto ? " 1fr" : ""};gap:7px">
        <div style="background:var(--blue-l);border-radius:9px;padding:9px;text-align:center"><div style="font-size:1.3rem;font-weight:800;color:var(--navy)">${totFac}</div><div style="font-size:0.6rem;color:var(--gray);text-transform:uppercase">Faciales</div></div>
        <div style="background:var(--green-l);border-radius:9px;padding:9px;text-align:center"><div style="font-size:1.3rem;font-weight:800;color:var(--green)">${totPaq}</div><div style="font-size:0.6rem;color:var(--gray);text-transform:uppercase">Paquetes</div></div>
        <div style="background:var(--peach-l);border-radius:9px;padding:9px;text-align:center"><div style="font-size:1.3rem;font-weight:800;color:var(--peach)">${totProd}</div><div style="font-size:0.6rem;color:var(--gray);text-transform:uppercase">Productos</div></div>
        ${gasto}
      </div></div>
    ${cards || `<p class="note">Sin tickets.</p>`}`;
  body.querySelectorAll("[data-quitar-ln]").forEach((b) => { b.onclick = () => b.closest(".ln").remove(); });
  body.querySelectorAll("[data-add-ln]").forEach((b) => {
    b.onclick = () => {

      box.insertAdjacentHTML("beforeend", html);
      box.querySelectorAll("[data-quitar-ln]").forEach((q) => { q.onclick = () => q.closest(".ln").remove(); });

  body.querySelectorAll("[data-save-tk]").forEach((b) => { b.onclick = () => guardarTicket(b); });

function bajarReporte(tipo) {

function pctBuffer(data) {
  const b = Number(data && data.buffer);
  const ratio = Number.isFinite(b) && b >= 0 ? (b > 1 ? b / 100 : b) : 0.2;
  return Math.round(ratio * 1000) / 10;
}
function consigActual() {
  const data = window._consig || {};
  const inp = document.getElementById("consig-buffer");
  const pct = inp ? Number(inp.value) : pctBuffer(data);
  const buffer = Number.isFinite(pct) && pct >= 0 ? pct / 100 : 0.2;
  const pedir = {};
  document.querySelectorAll("[data-pedir]").forEach((el) => { pedir[el.getAttribute("data-pedir")] = Number(el.value); });
  const fact = data.fact || [];
  const restock = fact.map((it) => {
    const cant = pedir[it.sku] != null && Number.isFinite(pedir[it.sku]) ? pedir[it.sku] : Number(it.sugerido) || 0;
    return { sku: it.sku, nombre: it.nombre, compra: it.compra, vendido: it.vendido, sugerido: cant, pedir: cant };
  }).filter((it) => it.pedir > 0);
  return { ...data, buffer, fact, restock };
}
function aplicarBufferConsig() {
  const data = window._consig;

function pdfPaginas(paginas) {

  chunks.forEach((stream, i) => {
    const page = 3 + i * 2;
    const content = page + 1;
    objs.push(`${page} 0 obj<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Contents ${content} 0 R /Resources<< /Font<< /F1 ${3 + chunks.length * 2} 0 R >> >> >>endobj`);

  for (let i = 1; i < xref.length; i++) pdf += String(xref[i]).padStart(10, "0") + " 00000 n \n";

function bindCfgPriv(main) {
  const box = main.querySelector("#cfg-permisos-box") || main.querySelector("#usr-page");
  if (!box) return;
  const raw = main.querySelector("#cfg-priv-json");
  let data = { flags: [], usuarios: [] };
  try { data = JSON.parse(raw && raw.textContent || "{}"); } catch (e) { data = { flags: [], usuarios: [] }; }
  const msg = (t, ok) => {
    const p = main.querySelector("#cfg-priv-msg");
    if (!p) return;
    p.hidden = !t;
    p.className = ok ? "ok" : "err";
    p.id = "cfg-priv-msg";
    p.textContent = t || "";
  };
  const pintar = (uid) => {
    const u = (data.usuarios || []).find((x) => x.uid === uid);
    main.querySelectorAll("[data-priv-user-cell]").forEach((td) => {
      const id = td.getAttribute("data-priv-user-cell");
      if (!u) { td.innerHTML = '<span class="note">—</span>'; return; }
      const on = !!(u.flags && u.flags[id]);
      const origen = u.origen && u.origen[id] === "usuario" ? ' <span class="note">personalizado</span>' : ' <span class="note">del rol</span>';
      td.innerHTML = `<label class="cfg-priv-lab"><input type="checkbox" data-priv-ambito="usuario" data-priv-uid="${esc(u.uid)}" data-priv-flag="${esc(id)}"${on ? " checked" : ""}> ${on ? "sí" : "no"}</label>${origen}`;
    });
  };
  const sel = main.querySelector("#cfg-priv-uid");
  if (sel) {
    sel.addEventListener("change", () => { msg(""); pintar(sel.value); });
    if (sel.value) pintar(sel.value);
  }
  box.addEventListener("change", async (e) => {
    const t = e.target;
    if (!t || !t.getAttribute || !t.getAttribute("data-priv-flag")) return;
    const payload = { ambito: t.getAttribute("data-priv-ambito"), flag: t.getAttribute("data-priv-flag"), valor: t.checked };
    if (payload.ambito === "rol") payload.rol = t.getAttribute("data-priv-rol");
    else payload.uid = t.getAttribute("data-priv-uid");
    t.disabled = true;
    const r = await api("cfg_priv_guardar", payload);
    t.disabled = false;
    if (r && r.error) { t.checked = !t.checked; msg(r.error, false); return; }
    msg("Guardado.", true);
    if (payload.ambito === "rol") {
      const lab = t.parentNode;
      if (lab && lab.lastChild) lab.lastChild.textContent = " " + (t.checked ? "sí" : "no");
    } else if (payload.uid) {
      const u = (data.usuarios || []).find((x) => x.uid === payload.uid);
      if (u) {
        u.flags = u.flags || {};
        u.origen = u.origen || {};
        if (r.origen === "rol") { u.flags[payload.flag] = t.checked; u.origen[payload.flag] = "rol"; }
        else { u.flags[payload.flag] = t.checked; u.origen[payload.flag] = "usuario"; }
      }
      pintar(payload.uid);
    }
  });
}

function setMsg(form, data, okText) {
  const err = form.querySelector("#f-err") || form.parentElement.querySelector("#f-err");
  const ok = form.querySelector("#f-ok");
  if (data.error) { if (err) err.textContent = data.error; if (ok) ok.textContent = ""; return false; }
  if (err) err.textContent = "";
  if (ok) ok.textContent = okText || "Listo";
  return true;
}

async function saveProd(form) {
  const body = Object.fromEntries(new FormData(form).entries());
  if (!state.admin) { setMsg(form, { error: "Solo admin edita el catálogo." }); return; }
  const data = await api("prod_save", body);
  if (setMsg(form, data, data.sku || "Guardado")) go("#/m/productos");
}
async function saveInv(form) {
  if (!state.admin) { setMsg(form, { error: "Solo admin edita el catálogo." }); return; }
  const body = Object.fromEntries(new FormData(form).entries());
  const uso = form.querySelector('input[name="uso"]:checked');
  body.uso = uso ? uso.value : body.uso || "";
  if (body.costo_promedio === "") delete body.costo_promedio;
  if (!body.id) delete body.id;
  const data = await api("prod_save", body);
  if (!setMsg(form, data, data.sku || "Guardado")) return;
  const file = document.getElementById("inv-foto");
  if (file && file.files && file.files[0] && data.id) {
    const b64 = await new Promise((res) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result || ""));
      r.onerror = () => res("");
      r.readAsDataURL(file.files[0]);
    });
    if (b64) {
      const foto = await api("prod_foto", { id: data.id, foto_b64: b64, nombre: file.files[0].name });
      if (foto.error) { setMsg(form, foto); return; }
    }
  }
  go("#/m/inventario/prod/" + encodeURIComponent(data.id));
}

  const comCiclo = main.querySelector("#com-ciclo");
  if (comCiclo) comCiclo.onchange = () => { void cargarComisiones(); };
  pintarRol();
  const rolVer = main.querySelector("#rol-ver");
  if (rolVer) rolVer.onclick = async () => {
    const persona = (main.querySelector("#rol-persona") || {}).value || "";
    const data = await api("getRolCiclo", { persona, desde: main.querySelector("#rol-ciclo").value });
    if (data.error) { toast(data.error); return; }
    window._rol = data;
    pintarRol();
  };
  const pdf = main.querySelector("#rol-pdf");
  if (pdf) pdf.onclick = () => {
    const d = window._rol || {};
    if (typeof _pdfRol === "function") {
      // TK166: mismo PDF oficial que el rol mensual, con una línea por concepto.
      const c = d.comisiones || {};
      const busca = (re) => (d.ingresos || []).filter((r) => re.test(r.concepto)).reduce((a, r) => a + (Number(r.monto) || 0), 0);
      const buscaD = (re) => (d.descuentos || []).filter((r) => re.test(r.concepto)).reduce((a, r) => a + (Number(r.monto) || 0), 0);
      _pdfRol({
        nombre: d.persona, cedula: d.cedula, cargo: d.cargo, etiqueta: "Ciclo " + (d.ciclo || "") + " a " + (d.fin || ""),
        sueldo: busca(/^Sueldo/), bono: busca(/^Bono/), extras: busca(/^Horas extra/),
        comFacialesSolo: busca(/^Faciales/), comExtras: busca(/^Extras/), comRecepcion: busca(/^Recepci/),
        comPaquetes: c.comPaquetes != null ? c.comPaquetes : busca(/^Paquetes/), comProductos: busca(/^Productos/),
        dec13: busca(/tercero/), dec14: busca(/cuarto/), fondoReserva: busca(/reserva/), vacaciones: busca(/^Vacaciones/),
        iess: buscaD(/^IESS/), multas: buscaD(/^Multas/), prestQuir: buscaD(/quirograf/), prestHip: buscaD(/hipotec/), prestOtro: buscaD(/^Otros/),

      }, "Ciclo " + (d.ciclo || ""), null);
      return;
    }
    const lineas = ["SUNSU SPA — ROL DE PAGOS", (d.persona || "") + " · " + (d.ciclo || "") + " a " + (d.fin || ""), ""];
    (d.ingresos || []).forEach((r) => lineas.push(r.concepto + "  " + money(r.monto)));
    lineas.push("Total ingresos  " + money(d.totalIngresos), "");
    (d.descuentos || []).forEach((r) => lineas.push(r.concepto + "  " + money(r.monto)));
    lineas.push("Total descuentos  " + money(d.totalDescuentos), "", "Neto a recibir  " + money(d.neto));
    bajarArchivo("rol-" + (d.persona || "pago") + ".pdf", pdfTexto(lineas), "application/pdf");
  };
}

async function idProducto(sku) {
  const list = await api("prod_list");
  const want = sku.toUpperCase().replace(/^SUNSU-/, "");
  const hit = (list.items || []).find((p) => String(p.sku || "").toUpperCase().replace(/^SUNSU-/, "") === want);
  return hit ? hit.id : "";
}

function wireTrf(main) {
  const form = main.querySelector("#f-trf");
  if (!form || !form.origen_id) return;
  const elegido = main.querySelector("#trf-elegido");
  const consig = main.querySelector("#trf-consig");
  const oculto = main.querySelector("#trf-prod");
  const tq = main.querySelector("#trf-q");
  if (tq) tq.addEventListener("input", () => {
    main.querySelectorAll("[data-trf-prod]").forEach((b) => {
      const t = b.textContent || "";
      b.hidden = !!tq.value.trim() && !(window.MCBuscar ? window.MCBuscar.coincide(tq.value, (t.match(/\b[A-Z]{1,6}-?\d{1,6}\b|SUNSU-[A-Z0-9-]+/g) || []), [t]) : normBusca(t).includes(normBusca(tq.value)));
    });
  });
  const pintar = (btn) => {
    main.querySelectorAll("[data-trf-prod]").forEach((b) => { b.classList.toggle("on", b === btn); });
    oculto.value = btn.getAttribute("data-trf-prod");
    const sku = btn.getAttribute("data-sku") || "";
    const uso = btn.getAttribute("data-uso") || "";
    elegido.textContent = sku + " · " + (btn.querySelector(".name") ? btn.querySelector(".name").textContent : "");
    const fam = familiaSkuUi(sku);
    const dest = lugaresVisibles().find((b) => b.id === form.destino_id.value);
    const aCabina = dest && dest.tipo === "cabina";
    consig.hidden = !(fam && aCabina);
    if (aCabina && uso === "venta") elegido.textContent += " · este producto es de venta y no entra a cabina";
  };
  main.querySelectorAll("[data-trf-prod]").forEach((b) => { b.onclick = () => pintar(b); });
  form.destino_id.addEventListener("change", () => {
    const on = main.querySelector("[data-trf-prod].on");
    if (on) pintar(on);
  });
}

async function marcarAsistencia(tipo, foto) {

    const msg = "Estás viendo como " + (state.vista.name || "otra persona") + ". Sal de la vista para guardar.";

  try {

    body.lng = pos.lng;
    body.precision_m = pos.precision_m;
  } catch {

  if (regBtn) { regBtn.disabled = false; regBtn.textContent = regTxt; }
  if (!data || data.error) {
    const msg = "No se registró la marca: " + ((data && data.error) || "error desconocido");
    if (err) err.textContent = msg;
    toast(msg);
    void cargarReloj().catch(() => null);
