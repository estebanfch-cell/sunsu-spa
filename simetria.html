<!DOCTYPE html>
<!-- K-Lift loader v19.27 — entrada estable. No cachear; lee simetria.version.json y carga el artifact. -->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sunsu · Simetría K-Lift</title>
<style>
  html,body{margin:0;min-height:100%;background:#FAF6F1;color:#6E6A60;
    font-family:Karla,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;}
  p{font-size:14px;letter-spacing:.04em;}
</style>
<script>
/* Atajo de escritorio: https://app.sunsuspa.com/simetria.html (sin ?v=).
   Cada recarga pide simetria.version.json con cache no-store y Date.now();
   luego reemplaza por el artifact actual (simetria.app.html?v=<build>).
   Bookmarks con ?v= viejo no se rompen: se reescriben al build vigente. */
(function(){
  var fallback = "simetria.app.html?v=" + Date.now();
  fetch("simetria.version.json?t=" + Date.now(), { cache: "no-store" })
    .then(function(r){
      if(!r.ok) throw new Error("version " + r.status);
      return r.json();
    })
    .then(function(info){
      var v = String((info && info.v) || Date.now());
      var file = ((info && info.file) || "simetria.app.html").replace(/^\//, "");
      var p = new URLSearchParams(location.search);
      p.set("v", v);
      location.replace(file + "?" + p.toString() + location.hash);
    })
    .catch(function(){
      location.replace(fallback + location.hash);
    });
})();
</script>
</head>
<body>
<p>Cargando K-Lift…</p>
</body>
</html>
