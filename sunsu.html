var _compFotos={};
// ══════ DICTADO POR VOZ (Notas y Recomendaciones del ticket) ══════
var _dictadoAct=null;
function _dictar(targetId){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  var btn=document.getElementById('mic-'+targetId);
  if(!SR){
    toast('🎤 En iPhone usa el micrófono del teclado para dictar','var(--blue)');
    return;
  }
  // Si ya está grabando este campo → detener
  if(_dictadoAct&&_dictadoAct.target===targetId){
    _dictadoAct.rec.stop();
    return;
  }
  if(_dictadoAct){ try{_dictadoAct.rec.stop();}catch(e){} }
  var rec=new SR();
  rec.lang='es-EC'; rec.continuous=true; rec.interimResults=true;
  var el=document.getElementById(targetId);
  var base=el?el.value:'';
  rec.onresult=function(ev){
    var fin='', inter='';
    for(var i=0;i<ev.results.length;i++){
      if(ev.results[i].isFinal) fin+=ev.results[i][0].transcript;
      else inter+=ev.results[i][0].transcript;
    }
    if(el) el.value=(base+(base&&(fin||inter)?' ':'')+fin+inter).replace(/ {2,}/g,' ');
  };
  rec.onend=function(){
    if(btn){btn.textContent='🎤';btn.style.background='white';btn.style.color='';}
    _dictadoAct=null;
  };
  rec.onerror=function(ev){
    if(ev.error==='not-allowed') toast('🎤 Permite el acceso al micrófono en el navegador','#C9A227');
    rec.onend();
  };
  try{
    rec.start();
    _dictadoAct={rec:rec,target:targetId};
    if(btn){btn.textContent='🔴 Detener';btn.style.background='#B86B6B';btn.style.color='white';}
    toast('🎤 Escuchando... habla y toca 🔴 al terminar','var(--blue)');
  }catch(eD){toast('❌ No se pudo iniciar el dictado','#B86B6B');}
}

// ══════ FOTOS DE LA CLIENTA EN EL TICKET ══════
function cargarFotoClienta(input, seccion){
  var f=input.files&&input.files[0]; if(!f) return;
  var key=seccion==='despues'?'fotosDespues':'fotosAntes';
  T[key]=T[key]||[];
  if(T[key].length>=3){toast('Máximo 3 fotos de '+(seccion==='despues'?'después':'antes'),'#C9A227');input.value='';return;}
  var rd=new FileReader();
  rd.onload=function(){
    var img=new Image();
    img.onload=function(){
      var MAX=1280, w=img.width, h=img.height;
      if(w>MAX||h>MAX){var esc=Math.min(MAX/w,MAX/h);w=Math.round(w*esc);h=Math.round(h*esc);}
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      T[key].push(cv.toDataURL('image/jpeg',0.8));
      _fotosCliRender();
      toast('📷 Foto '+(seccion==='despues'?'después':'antes')+' '+T[key].length+' agregada','var(--green)');
    };
    img.onerror=function(){toast('❌ No se pudo leer la imagen','#B86B6B');};
    img.src=rd.result;
  };
  rd.readAsDataURL(f);
  input.value='';
}
function _fotosCliRender(){
  [['fotosAntes','fotos-antes-prev'],['fotosDespues','fotos-despues-prev']].forEach(function(par){
    var box=document.getElementById(par[1]); if(!box) return;
    box.innerHTML=(T[par[0]]||[]).map(function(d,i){
      return '<div style="position:relative"><img src="'+d+'" style="width:78px;height:78px;object-fit:cover;border-radius:10px;border:1.5px solid var(--cream-d)">'
        +'<button onclick="T.'+par[0]+'.splice('+i+',1);_fotosCliRender()" style="position:absolute;top:-6px;right:-6px;background:#B86B6B;color:white;border:none;border-radius:99px;width:20px;height:20px;font-size:0.7rem;cursor:pointer;line-height:1">✕</button></div>';
    }).join('');
  });
}

function cargarComprobante(input,fila){
  var f=input.files&&input.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    var img=new Image();
    img.onload=function(){
      // Comprimir a máx 1280px JPEG para subida rápida
      var MAX=1280, w=img.width, h=img.height;
      if(w>MAX||h>MAX){var esc=Math.min(MAX/w,MAX/h);w=Math.round(w*esc);h=Math.round(h*esc);}
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      _compFotos[fila]=cv.toDataURL('image/jpeg',0.8);
      var prev=document.getElementById('cobfoto-prev-'+fila), im=document.getElementById('cobfoto-img-'+fila);
      if(im)im.src=_compFotos[fila];
      if(prev)prev.style.display='block';
      toast('📎 Comprobante adjuntado','var(--green)');
    };
    img.onerror=function(){toast('❌ No se pudo leer la imagen','#B86B6B');};
    img.src=rd.result;
  };
  rd.readAsDataURL(f);
  input.value='';
}

function guardarUnificado(fila,sinFac,soloCobro){
  try{

  var seleccionados=Object.keys(_cobroSelects[fila]||{}).filter(function(t){return _cobroSelects[fila][t];});

  var compStr=seleccionados.map(function(tipo){var det=document.getElementById('cobdet-'+fila+'-'+tipo);var val=det?det.value.trim():'';return val?tipo+':'+val:tipo;}).join(', ');
  cerrarModal('modal-uni-'+fila);

  var _fotoComp=(seleccionados.indexOf('Trans')>=0)?(_compFotos[fila]||null):null;
  var _subida=Promise.resolve('');
  if(_fotoComp){
    toast('⏳ Subiendo comprobante...','var(--navy)');
    _subida=fetch(APPS_SCRIPT_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain'},
      body:JSON.stringify({accion:'subirComprobante', imagen:_fotoComp, nombre:'ticket fila '+fila, usuario:CU?CU.name:'—'})
    })
    .then(function(r){return r.json();})
    .then(function(d){return (d&&d.url)||'';})
    .catch(function(){return '';});
  }
  _subida.then(function(urlComp){
    if(_fotoComp&&!urlComp) toast('⚠️ No se pudo subir la foto — el cobro se registra sin comprobante','#C9A227');
    fetch(APPS_SCRIPT_URL+'?action=registrarFacturaCobro&fila='+encodeURIComponent(fila)+(numFac?'&numFac='+encodeURIComponent(numFac):'')+'&comp='+encodeURIComponent(compStr)+'&soloCobro='+(soloCobro?'1':'0')+(urlComp?'&comprobanteUrl='+encodeURIComponent(urlComp):''))
      .then(function(r){return r.text();})

          toast(urlComp?'✅ Registrado con comprobante 📎':'✅ Registrado','var(--green)');
          delete _compFotos[fila];

      })
      .catch(function(err){toast('❌ Error: '+err.message,'#B86B6B');});
  });
  }catch(errGU){
    // Blindaje: ante cualquier error, cerrar el modal para nunca dejar la pantalla bloqueada
    try{cerrarModal('modal-uni-'+fila);}catch(e2){}
    toast('❌ Error: '+errGU.message,'#B86B6B');

}

function verTodasGC(filtro){
  var res=document.getElementById('bgc-results');
  if(!res) return;
  res.innerHTML='<div class="loading"><div class="spinner"></div>Cargando todas las gift cards...</div>';
  fetch(APPS_SCRIPT_URL+'?action=buscarGiftCards&q='+encodeURIComponent('*')+'&_t='+Date.now())
    .then(function(r){return r.json();})
    .then(function(d){
      var arr=d.resultados||[];
      var conEstado=arr.map(function(g){var vc=_gcVencimiento(g);return {g:g,cad:!g.usado&&vc&&vc.cad,vig:!g.usado&&vc&&!vc.cad};});
      var nCad=conEstado.filter(function(x){return x.cad;}).length;
      var nVig=conEstado.filter(function(x){return x.vig;}).length;
      var nUso=arr.length-nCad-nVig;
      var lista=conEstado.filter(function(x){
        if(filtro==='cad') return x.cad;
        if(filtro==='vig') return x.vig;
        return true;
      });
      // Caducadas primero, luego por vencer, luego el resto
      lista.sort(function(a,b){return (b.cad?2:(b.vig?1:0))-(a.cad?2:(a.vig?1:0));});
      res.innerHTML='<div style="font-size:0.66rem;color:var(--gray);margin-bottom:8px">'+arr.length+' gift cards · <b style="color:#2E7D52">'+nVig+' vigentes</b> · <b style="color:#E8543F">'+nCad+' caducadas</b> · '+nUso+' consumidas</div>'
        +(lista.length?lista.map(function(x){return _buildGCCard(x.g);}).join(''):'<div class="card" style="text-align:center;color:var(--gray);padding:20px">Sin gift cards en este filtro</div>');
    })
    .catch(function(){res.innerHTML='<div class="card" style="color:var(--red)">❌ Error de conexión</div>';});
}

function _gcVencimiento(g){
  // Vigencia: 6 meses desde la fecha de compra.
  // REGLA: aplica solo a gift cards vendidas DESDE el 14/07/2026 — las anteriores
  // salieron sin caducidad marcada, así que siguen vigentes indefinidamente.
  var CORTE=new Date(2026,6,14); // 14 jul 2026
  var d=parseInt(g.dia), m=parseInt(g.mes), a=parseInt(g.ano);
  if(!d||!m||!a) return null;
  var compra=new Date(a, m-1, d);
  if(compra<CORTE) return {venc:null, cad:false, dias:99999, sinCad:true, str:''};
  var venc=new Date(a, m-1+6, d);
  var hoy=new Date(); hoy.setHours(0,0,0,0);
  return {venc:venc, cad:hoy>venc, dias:Math.ceil((venc-hoy)/86400000),
    str:('0'+venc.getDate()).slice(-2)+'/'+('0'+(venc.getMonth()+1)).slice(-2)+'/'+venc.getFullYear()};
}
function _buildGCCard(g){
  var usado=g.usado;
  var vc=_gcVencimiento(g);
  var caducada=!usado&&vc&&vc.cad;
  var borderCol=usado?'var(--gray-l)':(caducada?'#E8543F':'var(--green)');
  var headerBg=usado?'#8A90A0':(caducada?'#E8543F':'var(--green)');
  var fecha=(g.dia||'?')+'/'+(g.mes||'?')+'/'+(g.ano||'?');
  var slotId='gc-uso-'+g.fila;

  // Facial autocomplete for quick select
  var facOptsHtml=FACIALES.map(function(f){
    return '<option value="'+f.n+'">'+f.n+'</option>';
  }).join('');

  var interactivo=!usado?
    '<div id="row-'+slotId+'" style="margin-top:10px;border-top:1px solid var(--gray-ll);padding-top:10px">'
    +'<div style="font-size:0.65rem;font-weight:700;color:var(--gray);text-transform:uppercase;margin-bottom:7px">✅ Marcar como usada</div>'
    +'<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">'
    +'<input type="checkbox" id="chk-'+slotId+'" onchange="toggleGCUso(this,\''+slotId+'\')" style="width:16px;height:16px;cursor:pointer;flex-shrink:0">'
    +'<label style="font-size:0.72rem;color:var(--gray);cursor:pointer" for="chk-'+slotId+'">Marcar GC como usada</label>'
    +'</div>'
    +'<div id="inputs-'+slotId+'" style="display:none">'
    // Facial hecho
    +'<div style="margin-bottom:6px"><label style="font-size:0.65rem;font-weight:700;color:var(--gray);text-transform:uppercase;display:block;margin-bottom:3px">💆 Facial hecho (col L)</label>'
    +'<input list="faclist-'+slotId+'" id="facial-'+slotId+'" placeholder="Escribe el facial..." style="width:100%;padding:7px 10px;border:1.5px solid var(--cream-d);border-radius:9px;font-size:0.78rem;font-family:inherit;outline:none;box-sizing:border-box">'

function _cargarTodosPaquetes(){
  var cont=document.getElementById('bpq-todos');
  if(!cont) return;
  cont.innerHTML='<div class="loading"><div class="spinner"></div>Cargando todos los paquetes...</div>';
  fetch(APPS_SCRIPT_URL+'?action=getSeguimientoPaquetes&_t='+Date.now())
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.error){cont.innerHTML='<div class="card" style="color:#B86B6B">❌ '+d.error+'</div>';return;}
    var P3=window._P3S||[], P6=window._P6S||[];
    var parseF=function(s){var m=(s||'').toString().match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(!m)return null;var a=parseInt(m[3]);if(a<100)a+=2000;return new Date(a,parseInt(m[2])-1,parseInt(m[1]));};
    window._todosPaq=(d.items||[]).map(function(p){
      var esP3=P3.some(function(s){return p.sku.indexOf(s)>=0;});
      var total=p.total||(esP3?3:6);
      var usados=0;
      p.usos.slice(0,total).forEach(function(u){if(u.u||u.f)usados++;});
      var aL=parseInt(p.ano)||0; if(aL>0&&aL<100)aL+=2000;
      var compra=new Date(aL,parseInt(p.mes)-1,parseInt(p.dia));
      return {p:p,total:total,usados:Math.min(usados,total),pend:Math.max(0,total-usados),compra:isNaN(compra)?new Date(0):compra};
    });
    window._paqOrden=window._paqOrden||'desc';
    _pintarTodosPaquetes();
  })
  .catch(function(e){cont.innerHTML='<div class="card" style="color:#B86B6B">❌ '+e.message+'</div>';});
}
function _pintarTodosPaquetes(){
  var cont=document.getElementById('bpq-todos');
  if(!cont) return;
  var arr=(window._todosPaq||[]).slice();
  var q=(window._paqQ||'').toLowerCase().trim();
  if(q) arr=arr.filter(function(x){
    return ((x.p.nombre+' '+x.p.apellido).toLowerCase().indexOf(q)>=0)||(x.p.cedula||'').indexOf(q)>=0||(x.p.sku||'').toLowerCase().indexOf(q)>=0;
  });
  window._paqVer=window._paqVer||'pend';
  var nComp=arr.filter(function(x){return x.pend===0;}).length;
  var nPend=arr.length-nComp;
  if(window._paqVer==='pend'&&!q) arr=arr.filter(function(x){return x.pend>0;}); // buscando se ven todos
  arr.sort(function(a,b){return window._paqOrden==='desc'?b.compra-a.compra:a.compra-b.compra;});
  var fS=function(f){return ('0'+f.getDate()).slice(-2)+'/'+('0'+(f.getMonth()+1)).slice(-2)+'/'+f.getFullYear();};
  var html='<div style="display:flex;justify-content:space-between;align-items:center;margin:16px 0 10px">'
    +'<div style="font-size:0.76rem;font-weight:800;color:var(--navy)">📦 Todos los paquetes <span style="font-weight:400;font-size:0.6rem;color:var(--gray)">('+arr.length+')</span></div>'
    +'<div style="display:flex;gap:6px">'
    +'<button onclick="window._paqVer=window._paqVer===\'pend\'?\'todos\':\'pend\';_pintarTodosPaquetes()" style="padding:6px 11px;background:'+(window._paqVer==='pend'?'var(--blue-l)':'white')+';color:var(--navy);border:1.5px solid var(--navy);border-radius:9px;font-size:0.62rem;font-weight:700;cursor:pointer">'+(window._paqVer==='pend'?'⏳ Por completar ('+nPend+')':'📋 Todos ('+(nPend+nComp)+')')+'</button>'
    +'<button onclick="window._paqOrden=window._paqOrden===\'desc\'?\'asc\':\'desc\';_pintarTodosPaquetes()" style="padding:6px 11px;background:white;color:var(--navy);border:1.5px solid var(--navy);border-radius:9px;font-size:0.62rem;font-weight:700;cursor:pointer">'+(window._paqOrden==='desc'?'⬇ Nuevos':'⬆ Antiguos')+'</button>'
    +'</div></div>'
    +'<input type="text" value="'+(window._paqQ||'').replace(/"/g,'&quot;')+'" placeholder="🔍 Filtrar por nombre, cédula o paquete..." oninput="window._paqQ=this.value;clearTimeout(window._paqQT);window._paqQT=setTimeout(_pintarTodosPaquetes,250)" style="width:100%;padding:9px;border:1.5px solid #ECEEF4;border-radius:10px;font-size:0.76rem;font-family:inherit;outline:none;box-sizing:border-box;margin-bottom:10px">';
  if(!arr.length) html+='<div class="card" style="text-align:center;color:var(--gray);padding:16px">Sin paquetes</div>';
  arr.forEach(function(x){
    var p=x.p;
    var iSeg=(window._todosPaq||[]).indexOf(x);
    html+='<div class="card" style="padding:11px;margin-bottom:8px">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">'
      +'<div style="flex:1;min-width:0">'
      +'<div style="font-size:0.74rem;font-weight:800;color:var(--navy)">'+(p.nombre+' '+p.apellido).trim()+'</div>'
      +'<div style="font-size:0.57rem;color:var(--gray)">📦 '+p.sku+' · comprado '+fS(x.compra)+'</div>'
      +'</div>'
      +'<span style="font-size:0.64rem;font-weight:800;padding:4px 9px;border-radius:8px;white-space:nowrap;'+(x.pend>0?'background:var(--blue-l);color:var(--navy)':'background:#E8F8EE;color:#2E7D52')+'">'+(x.pend>0?(x.usados+' de '+x.total+' · queda'+(x.pend!==1?'n':'')+' '+x.pend):'✓ Completo')+'</span>'
      +'<button onclick="tarjetaPaqueteDe('+iSeg+')" style="padding:7px 10px;background:var(--navy);color:white;border:none;border-radius:9px;font-size:0.62rem;font-weight:800;cursor:pointer;white-space:nowrap">📄 Tarjeta</button>'
      +(function(){
        var telQ=(p.telefono||'').replace(/[^0-9]/g,'');
        if(telQ&&telQ.length===10&&telQ.charAt(0)==='0') telQ='593'+telQ.slice(1);
        return telQ?'<a href="https://wa.me/'+telQ+'?text='+encodeURIComponent('Hola '+(p.nombre||'').split(' ')[0]+'! Te compartimos el control de tu paquete en Sunsu Spa.')+'" target="_blank" style="padding:7px 10px;background:#25D366;color:white;border-radius:9px;font-size:0.62rem;font-weight:800;text-decoration:none">💬</a>':'';
      })()
      +'<button onclick="paqDesplegar('+p.fila+',\''+(p.cedula||'').replace(/'/g,'')+'\')" style="padding:7px 10px;background:white;color:var(--navy);border:1.5px solid var(--navy);border-radius:9px;font-size:0.66rem;font-weight:800;cursor:pointer">▾</button>'
      +'</div><div id="paq-exp-'+p.fila+'"></div></div>';
  });
  cont.innerHTML=html;
}

// Desplegable de una fila: trae la tarjeta de marcado completa (la misma de siempre)
function paqDesplegar(fila, cedula){
  var box=document.getElementById('paq-exp-'+fila);
  if(!box) return;
  if(box.innerHTML){box.innerHTML='';return;}
  box.innerHTML='<div class="loading" style="padding:10px"><div class="spinner"></div>Cargando paquete...</div>';
  fetch(APPS_SCRIPT_URL+'?action=buscarPaquetes&q='+encodeURIComponent(cedula)+'&_t='+Date.now())
  .then(function(r){return r.json();})
  .then(function(d){
    var arr=(d.resultados||[]).filter(function(r2){return r2.fila===fila;});
    if(!arr.length) arr=d.resultados||[];
    box.innerHTML=arr.length?('<div style="margin-top:8px">'+arr.map(function(p){return _buildPaqueteCard(p);}).join('')+'</div>')
      :'<div style="padding:8px;color:var(--gray);font-size:0.66rem">No pude cargar el detalle</div>';
  })
  .catch(function(e){box.innerHTML='<div style="padding:8px;color:#B86B6B;font-size:0.66rem">❌ '+e.message+'</div>';});
}
function tarjetaPaqueteDe(i){

function renderBuscarPaquetes(c){
  c.innerHTML=
    '<div style="font-size:0.88rem;font-weight:800;color:var(--navy);margin-bottom:12px">📦 Buscar Paquetes</div>'
    +'<input id="bpq-inp" type="text" style="display:none">'

    if(window._paqPrefill){
      inp.value=window._paqPrefill;window._paqPrefill='';
      // Esperar a que las marcaciones automáticas terminen antes de buscar (evita ver el paquete desactualizado)
      var _esperarMarcas=function(n){
        if((window._paqMarcasPendientes||0)>0 && n<13){
          if(n===0) toast('⏳ Actualizando el paquete...','var(--blue)');
          setTimeout(function(){_esperarMarcas(n+1);},800);
        } else {
          ejecutarBuscarPaquetes();
        }
      };
      setTimeout(function(){_esperarMarcas(0);},50);
    }
    inp.addEventListener('keydown',function(e){if(e.key==='Enter')ejecutarBuscarPaquetes();});
    inp.addEventListener('input',function(){
      clearTimeout(window._bpqTimer);
      window._bpqTimer=setTimeout(function(){
        if(inp.value.trim().length>=2) ejecutarBuscarPaquetes();

function ejecutarBuscarPaquetes(){
  var q=(document.getElementById('bpq-inp')||{}).value||'';
  if(!q.trim()){return;}
  var res=document.getElementById('bpq-results');
  if(!res) return;
  res.innerHTML='<div class="loading"><div class="spinner"></div>Buscando...</div>';
  fetch(APPS_SCRIPT_URL+'?action=buscarPaquetes&q='+encodeURIComponent(q.trim()))
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.error){res.innerHTML='<div class="card" style="color:var(--red)">❌ '+d.error+'</div>';return;}
      var arr=d.resultados||[];
      if(!arr.length){res.innerHTML='<div class="card" style="text-align:center;color:var(--gray);padding:20px">Sin resultados para "'+q+'"</div>';return;}
      res.innerHTML=arr.map(function(p){return _buildPaqueteCard(p);}).join('');
    })
    .catch(function(){res.innerHTML='<div class="card" style="color:var(--red)">❌ Error de conexión</div>';});
}

function _buildPaqueteCard(p){
  var completo = p.completo;
  var borderCol = completo ? 'var(--red)' : 'var(--cream-d)';
  var headerBg  = completo ? 'var(--red)' : 'var(--navy)';
  var fecha = (p.dia||'?')+'/'+(p.mes||'?')+'/'+(p.ano||'?');
  var usados = p.usados||0;
  var total  = p.totalSes||3;
  var restantes = total - usados;

  // Progress bar
  var pct = Math.round((usados/total)*100);
  var barCol = completo ? 'var(--red)' : usados===0 ? 'var(--blue)' : usados===total ? 'var(--red)' : 'var(--green)';

  // Usos detail — all users can mark unused sessions
  var usosHtml = (p.usos||[]).map(function(u, i){
    var label = (i+1)+'/'+total;
    var isGC = u.fecha && u.fecha.indexOf('Gift Card')>=0;
    if(u.usado){
      return '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--gray-ll)">'

function guardarMulta(tkRow){
  var isTicket=tkRow!=null;
  var prefix=isTicket?'mtk-':'mul-';
  var get=function(id){var el=document.getElementById(prefix+id);return el?el.value.trim():'';};
  var btn=document.getElementById(prefix+'btn');
  var msg=document.getElementById(prefix+'msg');
  var cosm=get('cosm'), tipo=get('tipo'), montoStr=get('monto'), motivo=get('motivo');
  var monto=parseFloat(montoStr)||0;
  if(!cosm||!monto||!motivo){
    msg.style.display='block'; msg.style.background='var(--red-l)'; msg.style.color='var(--red)';
    msg.textContent='❌ Completa cosmetóloga, monto y motivo';
    return;
  }
  btn.disabled=true; btn.textContent='⏳ Guardando...';
  fetch(APPS_SCRIPT_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({
      accion:'registrarMulta',
      cosmetologa: cosm,
      tipo: tipo,
      monto: monto,
      motivo: motivo,
      tkRow: tkRow||'',
    })
  })
  .then(function(r){return r.json();})
  .then(function(d){
    btn.disabled=false; btn.textContent=isTicket?'⚠️ Aplicar multa':'⚠️ Registrar';
    if(d.ok){
      msg.style.display='block'; msg.style.background='var(--green-l)'; msg.style.color='var(--green)';
      msg.textContent='✅ Registrado correctamente';
      setTimeout(function(){
        if(isTicket){var ov=document.getElementById('multa-overlay');if(ov)ov.remove();}
        else{renderMultas(document.getElementById('content'));}
      },1300);
    } else {
      msg.style.display='block'; msg.style.background='var(--red-l)'; msg.style.color='var(--red)';
      msg.textContent='❌ '+(d.error||'Error al guardar');
    }
  })
  .catch(function(){
    btn.disabled=false; btn.textContent=isTicket?'⚠️ Aplicar multa':'⚠️ Registrar';
    msg.style.display='block'; msg.style.background='var(--red-l)'; msg.style.color='var(--red)';
    msg.textContent='❌ Error de conexión';
  });
}

function ejecutarBusqueda(){
  if(!_histData) return;
  var isAdmin=CU&&(CU.role==='admin'||CU.role==='admin_master');
  var q=((document.getElementById('buscar-q')||{}).value||'').trim().toLowerCase();
  var res=document.getElementById('buscar-res');
  if(!res) return;
  if(q.length<2){
    res.innerHTML='<div style="text-align:center;color:var(--gray);font-size:0.8rem;padding:16px">Escribe al menos 2 caracteres</div>';
    return;
  }
  var matches=_histData.filter(function(t){
    var nom=((t.nombre||'')+' '+(t.apellido||'')).toLowerCase();
    var ced=(t.cedula||'').toLowerCase();
    return nom.indexOf(q)>=0||ced.indexOf(q)>=0;
  });
  if(!matches.length){
    res.innerHTML='<div style="text-align:center;color:var(--gray);font-size:0.82rem;padding:20px">Sin resultados para "'+q+'"</div>';
    return;
  }
  var totFac=0,totPaq=0,totProd=0,totGasto=0;
  matches.forEach(function(t){
    if(t.facial) totFac++;
    if(t.pack3||t.pack6) totPaq++;
    if(t.productos) totProd+=t.productos.length;
    totGasto+=parseFloat(t.estimado)||0;
  });
  var html='<div style="background:white;border-radius:14px;box-shadow:var(--shadow-sm);padding:14px;margin-bottom:14px">'
    +'<div style="font-size:0.65rem;font-weight:700;color:var(--gray);text-transform:uppercase;margin-bottom:9px;letter-spacing:0.5px">Resumen — '+matches.length+' ticket(s)</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:7px">'
    +'<div style="background:var(--blue-l);border-radius:9px;padding:9px;text-align:center"><div style="font-size:1.3rem;font-weight:800;color:var(--navy)">'+totFac+'</div><div style="font-size:0.6rem;color:var(--gray);text-transform:uppercase">Faciales</div></div>'
    +'<div style="background:var(--green-l);border-radius:9px;padding:9px;text-align:center"><div style="font-size:1.3rem;font-weight:800;color:var(--green)">'+totPaq+'</div><div style="font-size:0.6rem;color:var(--gray);text-transform:uppercase">Paquetes</div></div>'
    +'<div style="background:var(--peach-l);border-radius:9px;padding:9px;text-align:center"><div style="font-size:1.3rem;font-weight:800;color:var(--peach)">'+totProd+'</div><div style="font-size:0.6rem;color:var(--gray);text-transform:uppercase">Productos</div></div>'
    +'<div style="background:var(--gold-l);border-radius:9px;padding:9px;text-align:center"><div style="font-size:1.1rem;font-weight:800;color:var(--gold)">$'+totGasto.toFixed(2)+'</div><div style="font-size:0.6rem;color:var(--gray);text-transform:uppercase">Total</div></div>'
    +'</div></div>';
  matches.forEach(function(t){
    html+=_buildTicketCard(t, true);
  });
  res.innerHTML=html;
}

function _cajaCargarMovimientos(){
  var el=document.getElementById('caja-movs');
  if(!el) return;
  el.innerHTML='<div class="loading"><div class="spinner"></div>Cargando...</div>';
  fetch(APPS_SCRIPT_URL+'?action=getCajaMovimientos&_t='+Date.now())
    .then(function(r){return r.json();})
    .then(function(d){
      if(!el) return;
      var movs=d.movimientos||[];
      if(!movs.length){
        el.innerHTML='<div style="text-align:center;color:var(--gray);padding:16px;font-size:0.78rem">Sin movimientos registrados hoy</div>';
        return;
      }
      var html='';
      movs.slice().reverse().forEach(function(m){
        var esGasto=m.tipo==='GASTO';
        var esDep=m.tipo==='DEPOSITO';
        var esIng=m.tipo.indexOf('INGRESO')>=0;
        var col=esGasto?'var(--peach)':esDep?'var(--navy)':esIng?'var(--green)':'var(--gray)';
        var bg=esGasto?'var(--pink-l)':esDep?'var(--blue-ll)':esIng?'var(--green-l)':'var(--gray-ll)';
        var signo=m.monto>=0?'+':'';
        html+='<div style="border-bottom:1px solid var(--gray-ll);padding:8px 0;display:flex;gap:10px;align-items:flex-start">'          +'<div style="flex-shrink:0;background:'+bg+';color:'+col+';font-size:0.6rem;font-weight:700;padding:2px 7px;border-radius:5px;margin-top:2px;white-space:nowrap">'+m.tipo+'</div>'          +'<div style="flex:1;min-width:0">'          +'<div style="font-size:0.78rem;font-weight:700;color:var(--navy)">'+m.desc+(m.quien?' · <span style="font-weight:400;color:var(--gray)">'+m.quien+'</span>':'')+'</div>'          +(m.notas?'<div style="font-size:0.68rem;color:var(--gray);margin-top:1px">'+m.notas+'</div>':'')          +(m.registradoPor?'<div style="font-size:0.63rem;color:var(--blue);margin-top:2px">📱 '+m.registradoPor+'</div>':'')          +'<div style="font-size:0.62rem;color:var(--gray);margin-top:1px">'+m.ts+'</div>'          +'</div>'          +'<div style="text-align:right;flex-shrink:0">'          +'<div style="font-size:0.88rem;font-weight:800;color:'+col+'">'+signo+m.monto.toFixed(2)+'</div>'          +'<div style="font-size:0.65rem;color:var(--gray)">Saldo: $'+m.saldo.toFixed(2)+'</div>'          +'</div>'          +'</div>';
      });
      el.innerHTML=html;
    })
    .catch(function(){
      if(el) el.innerHTML='<div style="color:var(--red);font-size:0.78rem;text-align:center;padding:10px">❌ Error cargando movimientos</div>';
    });
}

async function renderRoles(c) {
  const isAdmin = CU && (CU.role==='admin' || CU.role==='admin_master');
  const miCedula = CEDULAS_MAP[CU && CU.id] || '';

  c.innerHTML = '<div style="padding:16px">' +
    '<h2 style="font-size:16px;font-weight:600;margin-bottom:16px">📄 Roles de Pago</h2>' +
    '<div id="roles-loading" style="text-align:center;color:#888;padding:40px">' +
      '<div style="font-size:24px;margin-bottom:8px">⏳</div>' +
      'Cargando historial...' +
    '</div>' +
    '<div id="roles-content" style="display:none"></div>' +
  '</div>';

  let res;
  try {
    const url = APPS_SCRIPT_URL + '?action=getRoles&_t=' + Date.now();
    const r = await fetch(url);
    const txt = await r.text();
    res = JSON.parse(txt);
  } catch(err) {
    document.getElementById('roles-loading').innerHTML = '<div style="color:red">❌ Error: ' + err.message + '</div>';
    return;
  }
  if (!res || !res.ok) {
    document.getElementById('roles-loading').innerHTML = '<div style="color:red">❌ ' + (res&&res.error ? res.error : 'Redesplegar Sistema Central') + '</div>';
    return;
  }

  const meses = res.data && res.data.meses ? res.data.meses : [];
  document.getElementById('roles-loading').style.display = 'none';
  const ct = document.getElementById('roles-content');
  ct.style.display = 'block';

  if (!meses.length) {
    ct.innerHTML = '<div style="text-align:center;color:#888;padding:40px">No hay roles generados aún.<br>Genera el primer rol desde el sheet SUNSU RRHH.</div>';
    return;
  }

  // Agrupar por año
  const porAnio = {};
  meses.forEach(function(m) {
    const k = m.anio;
    if (!porAnio[k]) porAnio[k] = [];
    porAnio[k].push(m);
  });

  let html = '';
  Object.keys(porAnio).sort().reverse().forEach(function(anio) {
    html += '<div style="margin-bottom:20px">' +
      '<div style="background:#3D5A7A;color:#fff;padding:10px 14px;border-radius:8px 8px 0 0;font-weight:600;cursor:pointer" onclick="toggleAnio(\'' + anio + '\')">' +
        '📁 Roles ' + anio +
        '<span id="arrow-' + anio + '" style="float:right">▼</span>' +
      '</div>' +
      '<div id="anio-' + anio + '" style="border:1px solid #e0e0e0;border-top:none;border-radius:0 0 8px 8px;overflow:hidden">';

    porAnio[anio].forEach(function(mes) {
      const mesKey = mes.mes.toUpperCase() + '_' + mes.anio;

      if (isAdmin) {
        html += '<div style="border-bottom:1px solid #f0f0f0">' +
          '<div style="background:#f5f8fc;padding:10px 14px;font-weight:600;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center" onclick="toggleMes(\'' + mesKey + '\')">' +
            '<span>📋 ' + mes.mes + ' ' + mes.anio + '</span>' +
            '<span style="font-size:12px;color:#666">' + (mes.empleadas ? mes.empleadas.length : 0) + ' empleadas ▾</span>' +
          '</div>' +
          '<div id="mes-' + mesKey + '" style="display:none;padding:12px">' +
            renderResumenAdmin(mes, mesKey) +
          '</div>' +
        '</div>';
      } else {
        html += '<div style="padding:12px 14px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center">' +
          '<span style="font-size:14px">📋 ' + mes.mes + ' ' + mes.anio + '</span>' +
          '<button onclick="visualizarRol(\'' + mesKey + '\',\'' + miCedula + '\',this)" style="background:#6A9E7A;color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;margin-right:6px">👁 Visualizar</button>' +
          (isAdmin?'<button onclick="verAprobacionesRol(\'' + mesKey + '\')" style="background:white;color:#3D5A7A;border:1px solid #3D5A7A;border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;margin-right:6px">👁 Aprob.</button>':'') +
          '<button onclick="descargarRol(\'' + mesKey + '\',\'' + miCedula + '\',this)" style="background:#3D5A7A;color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer">⬇️ Descargar</button>' +
        '</div>';
      }
    });
    html += '</div></div>';
  });

  ct.innerHTML = html;
}

function renderResumenAdmin(mes, mesKey) {
  var totalIngr = 0, totalPatronal = 0, totalCosto = 0;
  var emps = mes.empleadas || [];
  var rows = emps.map(function(emp) {
    totalIngr     += parseFloat(emp.totalIngresos) || 0;
    totalPatronal += parseFloat(emp.iessPatronal)  || 0;
    totalCosto    += parseFloat(emp.costoEmpresa)  || 0;
    var empCed = (emp.cedula||'').toString().replace('.','');
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f5f5f5;font-size:13px">' +
      '<div>' +
        '<div style="font-weight:500">' + emp.nombre + '</div>' +
        '<div style="color:#888;font-size:11px">Total: $' + (parseFloat(emp.totalIngresos)||0).toFixed(2) + ' | Patronal: $' + (parseFloat(emp.iessPatronal)||0).toFixed(2) + '</div>' +
      '</div>' +
      '<button onclick="descargarRol(\'' + mesKey + '\',\'' + empCed + '\',this)" style="background:#5B7FA6;color:#fff;border:none;border-radius:6px;padding:5px 10px;font-size:11px;cursor:pointer;white-space:nowrap">⬇️ Descargar</button>' +
    '</div>';
  }).join('');

  return rows +
    '<div style="background:#EEF3FA;border-radius:8px;padding:12px;margin-top:12px">' +
      '<div style="font-weight:600;font-size:13px;margin-bottom:8px;color:#3D5A7A">💰 Resumen del mes</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center">' +
        '<div style="background:#fff;border-radius:6px;padding:8px"><div style="font-size:11px;color:#888">Total Ingresos</div><div style="font-size:15px;font-weight:600;color:#3D5A7A">$' + totalIngr.toFixed(2) + '</div></div>' +
        '<div style="background:#fff;border-radius:6px;padding:8px"><div style="font-size:11px;color:#888">IESS Patronal</div><div style="font-size:15px;font-weight:600;color:#C4943A">$' + totalPatronal.toFixed(2) + '</div></div>' +
        '<div style="background:#fff;border-radius:6px;padding:8px"><div style="font-size:11px;color:#888">Costo Total</div><div style="font-size:15px;font-weight:600;color:#2D7A4F">$' + totalCosto.toFixed(2) + '</div></div>' +
      '</div>' +
    '</div>';
}

async function descargarRol(sheetName, cedula, btnEl) {
  var btn = btnEl || event.target;
  var origText = btn.textContent;
  btn.textContent = '⏳';
  btn.disabled = true;
  var fin=function(){btn.textContent=origText;btn.disabled=false;};
  var res, apro=null;
  try {
    var r = await fetch(APPS_SCRIPT_URL + '?action=getRolIndividual&sheet=' + encodeURIComponent(sheetName) + '&cedula=' + encodeURIComponent(cedula) + '&_t=' + Date.now());
    res = await r.json();
    // Aprobación digital (si existe) para sellar el PDF
    try {
      var rA = await fetch(APPS_SCRIPT_URL + '?action=getAprobacionesRol&sheet=' + encodeURIComponent(sheetName) + '&_t=' + Date.now());
      var dA = await rA.json();
      apro = (dA.aprobaciones||{})[(cedula||'').replace('.','')] || null;
    } catch(eA){}
  } catch(err) {
    fin(); alert('Error de conexión: ' + err.message); return;
  }
  if (!res || !res.ok || !res.data) {
    fin(); alert('No se encontró el rol. Verifica que el rol fue generado y el Sistema Central redesplegado.'); return;
  }
  // Regla: las chicas solo pueden DESCARGAR su rol después de APROBARLO (los admins sí pueden siempre)
  var esAdminRol=CU&&(CU.role==='admin'||CU.role==='admin_master');
  if(!esAdminRol && !apro){
    fin();
    toast('👁 Primero visualiza y aprueba tu rol para poder descargarlo','#C9A227');
    visualizarRol(sheetName, cedula);
    return;
  }
  var img=new Image();
  img.crossOrigin='anonymous';
  img.onload=function(){_pdfRolFondo(res.data, sheetName, apro, img); fin();};
  img.onerror=function(){_pdfRolFondo(res.data, sheetName, apro, null); fin();};
  img.src=GCD_PAG3_URL;
}

// ── Rol de pagos en PDF con la identidad SUNSU (mismo fondo que OC y actas) ──
// OJO tipografía: jsPDF (helvetica estándar) solo codifica latin-1 — nada de ✔ ni −
function _pdfRolFondo(d, sheetName, apro, fondo){
  _gcdCargarJsPDF(function(ok){
    if(!ok){toast('❌ No se pudo cargar el generador de PDF','#B86B6B');return;}
    var doc=new window.jspdf.jsPDF({unit:'pt',format:'a4'});
    var W=595, H=842, NAVY='#3D5A7A', TXT='#4A5568', GOLD='#8A6D1A', VERDE='#2E7D52', ROJO='#B84040';
    var xI=55, ANCHO=485, xD=xI+ANCHO, FILA=17;
    var bg=fondo?_fondoA4Sunsu(fondo):null;
    var pintar=function(){ if(bg) doc.addImage(bg,'JPEG',0,0,W,H); };
    pintar();
    var mesLabel=(sheetName||'').replace('_',' ');
    var y=150;
    doc.setTextColor(NAVY); doc.setFont('helvetica','bold'); doc.setFontSize(19);
    doc.text('ROL DE PAGOS',W/2,y,{align:'center'}); y+=17;
    doc.setFontSize(9.5); doc.setFont('helvetica','normal'); doc.setTextColor(TXT);
    doc.text('Sunsu Spa - Quito - Período: '+mesLabel,W/2,y,{align:'center'}); y+=26;
    doc.setFontSize(9);
    var n2=function(v){return '$'+(parseFloat(v)||0).toFixed(2);};
    var fila=function(l,v){
      if(v===undefined||v===null||v==='') return;
      doc.setFont('helvetica','bold'); doc.setTextColor(NAVY); doc.text(l,xI,y);
      doc.setFont('helvetica','normal'); doc.setTextColor(TXT);
      doc.text(v.toString(),xI+130,y); y+=14;
    };
    fila('EMPLEADA:',d.nombre);
    fila('CÉDULA:',d.cedula);
    fila('CARGO:',d.cargo);
    // Días REALES contados en Jibble (días con marcación) — nunca derivados de horas
    fila('DÍAS TRABAJADOS:',(d.diasJibble?d.diasJibble+' días (según registro Jibble)':'—'));
    y+=6;
    var salto=function(need){ if(y+need>H-70){doc.addPage();pintar();y=140;} };
    var barra=function(titulo,cRGB){
      salto(60);
      doc.setFillColor(cRGB[0],cRGB[1],cRGB[2]);
      doc.roundedRect(xI,y,ANCHO,20,4,4,'F');
      doc.setTextColor('#FFFFFF'); doc.setFont('helvetica','bold'); doc.setFontSize(9.5);
      doc.text(titulo,xI+10,y+13.5);
      y+=20; // las filas empiezan JUSTO debajo de la barra, sin traslape
    };
    // Fila de tabla perfectamente cuadrada: zebra + concepto izq + monto der, misma tipografía
    var linea=function(concepto,monto,color,idx){
      var m=parseFloat(monto)||0;
      if(m===0) return 0;
      salto(FILA+4);
      if(idx%2===1){doc.setFillColor(246,243,234);doc.rect(xI,y,ANCHO,FILA,'F');}
      else{doc.setFillColor(255,255,255);doc.rect(xI,y,ANCHO,FILA,'F');}
      doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(TXT);
      doc.text(concepto,xI+10,y+12);
      doc.setFont('helvetica','bold'); doc.setTextColor(color);
      doc.text(n2(m),xD-10,y+12,{align:'right'});
      y+=FILA;
      return m;
    };
    var totalLinea=function(lbl,monto,color){
      salto(24); y+=6;
      doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(color);
      doc.text(lbl+': '+n2(monto),xD-10,y+6,{align:'right'});
      y+=20;
    };
    // ── INGRESOS ──
    barra('INGRESOS',[46,125,82]);
    var iIdx=0;
    [['Sueldo',d.sueldo],['Bono',d.bono],['Comisión faciales',d.comFaciales],['Comisión paquetes',d.comPaquetes],
     ['Comisión productos',d.comProductos],['Horas suplementarias ('+(d.hrsSupl||0)+'h)',d.valSupl],
     ['Horas extraordinarias ('+(d.hrsExtr||0)+'h)',d.valExtr],['Décimo tercero',d.dec13],['Décimo cuarto',d.dec14],
     ['Fondo de reserva',d.fondoReserva]].forEach(function(par){ if(linea(par[0],par[1],NAVY,iIdx)) iIdx++; });
    totalLinea('TOTAL INGRESOS',d.totalIngresos,VERDE);
    // ── EGRESOS (mismo formato y tipografía que ingresos, montos en rojo) ──
    barra('EGRESOS',[184,64,64]);
    var eIdx=0;
    [['Aporte IESS (9.45%)',d.iess],['Anticipo de sueldo',d.anticipo],['Préstamo hipotecario',d.prestHip],
     ['Préstamo quirografario',d.prestQuir]].forEach(function(par){ if(linea(par[0],par[1],ROJO,eIdx)) eIdx++; });
    // Multas y descuentos: SOLO tipo, fecha y valor (el detalle va en el cuadro del pie)
    var multas=(d.multasDetalle||[]).filter(function(m){return (parseFloat(m.monto)||0)>0;});
    multas.forEach(function(m){
      var lbl=((m.tipo||'MULTA').toString().toUpperCase()+(m.fecha?' - '+m.fecha:''));
      linea(lbl,m.monto,ROJO,eIdx); eIdx++;
    });
    totalLinea('TOTAL EGRESOS',d.egresos,ROJO);
    // ── NETO ──
    salto(40); y+=4;
    doc.setFillColor(253,247,230);
    doc.roundedRect(xI,y,ANCHO,32,6,6,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(GOLD);
    doc.text('NETO A RECIBIR:',xI+12,y+21);
    doc.text(n2(d.totalRecibir),xD-12,y+21,{align:'right'});
    y+=46;
    // ── Cuadro de explicaciones de multas y descuentos ──
    if(multas.length){
      var expl=[];
      doc.setFontSize(7.6);
      multas.forEach(function(m){
        var txt=(m.tipo||'MULTA').toString().toUpperCase()+(m.fecha?' '+m.fecha:'')+' ('+n2(m.monto)+'): '+((m.motivo||m.detalle||'—').toString());
        doc.splitTextToSize(txt, ANCHO-24).forEach(function(l){expl.push(l);});
      });
      var altoEx=26+expl.length*10+8;
      salto(altoEx+8);
      doc.setDrawColor(196,148,58); doc.setLineWidth(0.8);
      doc.setFillColor(255,252,242);
      doc.roundedRect(xI,y,ANCHO,altoEx,6,6,'FD');
      doc.setFont('helvetica','bold'); doc.setFontSize(8.5); doc.setTextColor(GOLD);
      doc.text('DETALLE DE MULTAS Y DESCUENTOS',xI+12,y+16);
      doc.setFont('helvetica','normal'); doc.setFontSize(7.6); doc.setTextColor(TXT);
      var yEx=y+28;
      expl.forEach(function(l){doc.text(l,xI+12,yEx);yEx+=10;});
      y+=altoEx+14;
    }
    // ── Aceptación: sello digital o línea de firma ──
    salto(70);
    if(apro&&apro.fecha){
      doc.setFillColor(232,248,238);
      doc.roundedRect(xI,y,ANCHO,42,6,6,'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(VERDE);
      doc.text('ROL APROBADO DIGITALMENTE',xI+12,y+16);
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(TXT);
      doc.text('Por '+(d.nombre||'')+' el '+apro.fecha+' desde el app SUNSU - constancia de recepción y aceptación',xI+12,y+30);
      y+=54;
    } else {
      var yF=y+30;
      doc.setDrawColor(90,110,140); doc.setLineWidth(0.8);
      doc.line(xI+130,yF,xD-130,yF);
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(TXT);
      doc.text('Recibí conforme - '+(d.nombre||''),W/2,yF+11,{align:'center'});
      y=yF+20;
    }
    _entregarPDF(doc, 'ROL '+mesLabel+' '+(d.nombre||'').split(' ')[0]+'.pdf');
    toast('📄 Rol listo','var(--green)');
  });
}

function _aprobarDesdeVista(sheetName, cedula){
  if(!confirm('✅ APROBAR MI ROL — '+sheetName.replace('_',' ')+'\n\nAl aprobar confirmas que revisaste tu rol y estás de acuerdo con los valores.\nQuedará registrado con fecha y hora.\n\n¿Aprobar?')) return;
  fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({accion:'aprobarRol',sheet:sheetName,cedula:cedula,nombre:CU?CU.name:'',usuario:CU?CU.name:'app'})})
  .then(function(r){return r.json();})
  .then(function(d){
    if(!d.ok){toast('❌ '+(d.error||'Error'),'#B86B6B');return;}
    toast(d.ya?'✔ Ya lo habías aprobado':'✅ Rol aprobado — ya puedes descargarlo','var(--green)');
    var foot=document.getElementById('rol-vista-foot');
    if(foot&&window._rolFootBtns) foot.innerHTML=window._rolFootBtns({fecha:d.fecha||''});
    var banA=document.getElementById('banner-rol'); if(banA) banA.style.display='none';
  })
  .catch(function(e){toast('❌ '+e.message,'#B86B6B');});
}

var TIPOS_PERMISO = [
  {id:'medico',    label:'Permiso médico / cita IESS / judicial', unidad:'horas',  remunerado:true},
  {id:'personal',  label:'Permiso personal no remunerado',        unidad:'horas',  remunerado:false},
  {id:'enfermedad',label:'Enfermedad justificada con certificado', unidad:'dias',   remunerado:true},
  {id:'calamidad', label:'Fallecimiento / calamidad familiar',     unidad:'dias',   remunerado:true},
  {id:'maternidad',label:'Licencia de maternidad',                 unidad:'dias',   remunerado:true},
  {id:'capacit',   label:'Capacitación o reunión interna',        unidad:'dias',   remunerado:true},
  {id:'vacaciones',label:'Vacaciones anuales',                     unidad:'dias',   remunerado:true},
];

async function renderPermisos(c) {
  var isAdmin = CU && (CU.role==='admin' || CU.role==='admin_master');
  c.innerHTML =
    '<div style="padding:16px">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">' +
      '<h2 style="font-size:16px;font-weight:600;margin:0">🏖️ Permisos</h2>' +
      (!isAdmin ? '<button onclick="abrirSolicitudPermiso()" style="background:#3D5A7A;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;font-weight:600">+ Solicitar Permiso</button>' : '') +
    '</div>' +
    '<div id="permisos-loading" style="text-align:center;color:#888;padding:40px">⏳ Cargando...</div>' +
    '<div id="permisos-content" style="display:none"></div>' +
    '</div>';

  var res;
  try {
    var r = await fetch(APPS_SCRIPT_URL + '?action=getPermisos&_t=' + Date.now());
    res = await r.json();
  } catch(e) {
    document.getElementById('permisos-loading').innerHTML = '<div style="color:red">❌ Error: ' + e.message + '</div>';
    return;
  }

  document.getElementById('permisos-loading').style.display = 'none';
  var ct = document.getElementById('permisos-content');
  ct.style.display = 'block';

  var permisos = (res.ok && res.data) ? res.data : [];

  // Filtrar según rol
  if (!isAdmin) {
    var miNombre = CU.name || '';
    permisos = permisos.filter(function(p) {
      return p.empleada && p.empleada.toLowerCase().indexOf(miNombre.toLowerCase().split(' ')[0]) >= 0;
    });
  }

  // Separar pendientes y resto
  var pendientes = permisos.filter(function(p){ return p.estado === 'PENDIENTE'; });
  var otros      = permisos.filter(function(p){ return p.estado !== 'PENDIENTE'; });

  var html = '';

  // Pendientes (admins con botones de acción)
  if (pendientes.length > 0) {
    html += '<div style="margin-bottom:20px">' +
      '<div style="background:#C4943A;color:#fff;padding:8px 14px;border-radius:8px 8px 0 0;font-weight:600;font-size:13px">' +
        '⏳ Pendientes (' + pendientes.length + ')' +
      '</div>' +
      '<div style="border:1px solid #e0e0e0;border-top:none;border-radius:0 0 8px 8px">';

    pendientes.forEach(function(p, i) {
      html += renderPermisoRow(p, i, isAdmin, true);
    });
    html += '</div></div>';
  }

  // Historial
  if (otros.length > 0) {
    html += '<div>' +
      '<div style="background:#5B7FA6;color:#fff;padding:8px 14px;border-radius:8px 8px 0 0;font-weight:600;font-size:13px">' +
        '📋 Historial' +
      '</div>' +
      '<div style="border:1px solid #e0e0e0;border-top:none;border-radius:0 0 8px 8px">';
    otros.forEach(function(p, i) {
      html += renderPermisoRow(p, i, isAdmin, false);
    });
    html += '</div></div>';
  }

  if (!pendientes.length && !otros.length) {
    html = '<div style="text-align:center;color:#888;padding:40px">No hay solicitudes de permiso aún.</div>';
  }

  ct.innerHTML = html;
}

function renderPermisoRow(p, i, isAdmin, showActions) {
  var estadoColor = p.estado==='APROBADO' ? '#2D7A4F' : p.estado==='RECHAZADO' ? '#B86B6B' : '#C4943A';
  var estadoIcon  = p.estado==='APROBADO' ? '✅' : p.estado==='RECHAZADO' ? '❌' : '⏳';
  var tipo = TIPOS_PERMISO.find(function(t){ return t.id === p.tipo; });
  var tipoLabel = tipo ? tipo.label : p.tipo;
  var remLabel = (tipo && !tipo.remunerado) ? ' · No remunerado' : '';

  var row = '<div style="padding:12px 14px;border-bottom:1px solid #f5f5f5;background:' + (i%2===0?'#fff':'#f9f9f9') + '">' +
    '<div style="display:flex;justify-content:space-between;align-items:flex-start">' +
      '<div style="flex:1">' +
        '<div style="font-weight:600;font-size:13px">' + p.empleada + '</div>' +
        '<div style="font-size:12px;color:#555;margin-top:2px">' + tipoLabel + remLabel + '</div>' +
        '<div style="font-size:11px;color:#888;margin-top:2px">' +
          p.fechaInicio + (p.fechaFin && p.fechaFin!==p.fechaInicio ? ' → ' + p.fechaFin : '') +
          (p.horas ? ' · ' + p.horas + 'h' : '') +
        '</div>' +
        (p.motivo ? '<div style="font-size:11px;color:#666;margin-top:3px;font-style:italic">"' + p.motivo + '"</div>' : '') +
        (p.urlFoto ? '<a href="' + p.urlFoto + '" target="_blank" style="font-size:11px;color:#3D5A7A;text-decoration:none">📎 Ver certificado</a>' : '') +
      '</div>' +
      '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-left:8px">' +
        '<span style="font-size:11px;font-weight:600;color:' + estadoColor + '">' + estadoIcon + ' ' + p.estado + '</span>';

  if (isAdmin && showActions) {
    row +=
      '<div style="display:flex;gap:6px">' +
        '<button data-pid="' + p.id + '" data-est="APROBADO" onclick="accionPermiso(this)" ' +
          'style="background:#2D7A4F;color:#fff;border:none;border-radius:5px;padding:4px 10px;font-size:11px;cursor:pointer">✅ Aprobar</button>' +
        '<button data-pid="' + p.id + '" data-est="RECHAZADO" onclick="accionPermiso(this)" ' +
          'style="background:#B86B6B;color:#fff;border:none;border-radius:5px;padding:4px 10px;font-size:11px;cursor:pointer">❌ Rechazar</button>' +
      '</div>';
  }

  row += '</div></div></div>';
  return row;
}

function abrirSolicitudPermiso() {
  var modal = document.getElementById('permiso-modal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'permiso-modal';
    modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box';
    document.body.appendChild(modal);
  }

  var opcionesHtml = TIPOS_PERMISO.map(function(t){
    return '<option value="' + t.id + '" data-unidad="' + t.unidad + '">' + t.label + '</option>';
  }).join('');

  modal.innerHTML =
    '<div style="background:#fff;border-radius:12px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">' +
        '<h3 style="margin:0;font-size:15px;color:#3D5A7A">🏖️ Solicitar Permiso</h3>' +
        '<button onclick="document.getElementById(\'permiso-modal\').remove()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#888">✕</button>' +
      '</div>' +

      '<label style="display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:4px">Tipo de permiso</label>' +
      '<select id="perm-tipo" onchange="actualizarFormPermiso()" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:13px;margin-bottom:12px">' +
        opcionesHtml +
      '</select>' +

      '<div id="perm-fecha-unica" style="margin-bottom:12px">' +
        '<label style="display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:4px">Fecha inicio</label>' +
        '<input type="date" id="perm-fecha-inicio" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:13px;box-sizing:border-box">' +
      '</div>' +

      '<div id="perm-fecha-fin-div" style="margin-bottom:12px">' +
        '<label style="display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:4px">Fecha fin</label>' +
        '<input type="date" id="perm-fecha-fin" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:13px;box-sizing:border-box">' +
      '</div>' +

      '<div id="perm-horas-div" style="margin-bottom:12px;display:none">' +
        '<label style="display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:4px">Horas solicitadas</label>' +
        '<input type="number" id="perm-horas" min="0.5" max="8" step="0.5" value="1" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:13px;box-sizing:border-box">' +
      '</div>' +

      '<label style="display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:4px">Motivo</label>' +
      '<textarea id="perm-motivo" rows="3" placeholder="Describe brevemente el motivo..." style="width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:13px;box-sizing:border-box;resize:none;margin-bottom:12px"></textarea>' +

      '<div id="perm-foto-div" style="display:none;margin-bottom:16px">' +
        '<label style="display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:4px">📎 Foto del certificado médico</label>' +
        '<input type="file" id="perm-foto" accept="image/*" capture="camera" ' +
          'style="width:100%;padding:6px;border:1px solid #ddd;border-radius:6px;font-size:13px;box-sizing:border-box">' +
        '<div id="perm-foto-preview" style="margin-top:8px"></div>' +
      '</div>' +

      '<button onclick="enviarSolicitudPermiso()" style="width:100%;background:#3D5A7A;color:#fff;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:600;cursor:pointer">Enviar Solicitud</button>' +
    '</div>';

  // Set today as default date
  var hoy = new Date().toISOString().slice(0,10);
  document.getElementById('perm-fecha-inicio').value = hoy;
  document.getElementById('perm-fecha-fin').value = hoy;
  actualizarFormPermiso();
}

function actualizarFormPermiso() {
  var sel = document.getElementById('perm-tipo');
  if (!sel) return;
  var unidad = sel.options[sel.selectedIndex].getAttribute('data-unidad');
  var tipo = sel.value;
  document.getElementById('perm-horas-div').style.display = unidad === 'horas' ? 'block' : 'none';
  document.getElementById('perm-fecha-fin-div').style.display = unidad === 'dias' ? 'block' : 'none';
  // Mostrar campo de foto solo para permiso médico y enfermedad
  var fotoDiv = document.getElementById('perm-foto-div');
  if (fotoDiv) fotoDiv.style.display = (tipo === 'medico' || tipo === 'enfermedad') ? 'block' : 'none';
  // Preview de foto
  var fotoInput = document.getElementById('perm-foto');
  if (fotoInput) fotoInput.onchange = function() {
    var preview = document.getElementById('perm-foto-preview');
    if (this.files && this.files[0]) {
      var reader = new FileReader();
      reader.onload = function(e) {
        preview.innerHTML = '<img src="' + e.target.result + '" style="max-width:100%;max-height:150px;border-radius:6px;margin-top:4px">';
      };
      reader.readAsDataURL(this.files[0]);
    }
  };
}

async function enviarSolicitudPermiso() {
  // Prevent double submission
  var submitBtn = document.querySelector('#permiso-modal button:last-child');
  if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Enviando...'; }
  var tipo       = document.getElementById('perm-tipo').value;
  var fechaInicio= document.getElementById('perm-fecha-inicio').value;
  var fechaFin   = document.getElementById('perm-fecha-fin').value || fechaInicio;
  var horas      = document.getElementById('perm-horas').value;
  var motivo     = document.getElementById('perm-motivo').value.trim();
  var sel        = document.getElementById('perm-tipo');
  var unidad     = sel.options[sel.selectedIndex].getAttribute('data-unidad');

  if (!fechaInicio) { alert('Selecciona una fecha'); return; }
  if (!motivo)      { alert('Escribe el motivo'); return; }

  // Leer foto si existe (como base64)
  var fotoBase64 = null;
  var fotoInput = document.getElementById('perm-foto');
  if (fotoInput && fotoInput.files && fotoInput.files[0]) {
    fotoBase64 = await new Promise(function(resolve) {
      var reader = new FileReader();
      reader.onload = function(e) { resolve(e.target.result); };
      reader.readAsDataURL(fotoInput.files[0]);
    });
  }

  var payload = {
    empleada:   CU.name,
    tipo:       tipo,
    fechaInicio:fechaInicio,
    fechaFin:   unidad === 'dias' ? fechaFin : fechaInicio,
    horas:      unidad === 'horas' ? horas : null,
    motivo:     motivo,
    estado:     'PENDIENTE',
    solicitado: new Date().toISOString().slice(0,10),
    foto:       fotoBase64,
  };

  try {
    var r = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({accion: 'savePermiso', permiso: payload})
    });
    var res = await r.json();
    if (res.ok) {
      var m = document.getElementById('permiso-modal');
      if (m) m.remove();
      alert('✅ Solicitud enviada. Pendiente de aprobación.');
      var ct = document.getElementById('content');
      if (ct) renderPermisos(ct);
    } else {
      alert('❌ Error: ' + (res.error||'No se pudo enviar'));
    }
  } catch(e) {
    alert('❌ Error de conexión: ' + e.message);
  }
}

async function accionPermiso(btn) {
  var id     = btn.dataset ? btn.dataset.pid : btn.getAttribute('data-pid');
  var estado = btn.dataset ? btn.dataset.est : btn.getAttribute('data-est');
  if (!id || !estado) { alert('Error: datos del permiso no disponibles'); return; }
  var confirmMsg = estado === 'APROBADO'
    ? '¿Aprobar este permiso? Recuerda registrarlo también en Jibble.'
    : '¿Rechazar este permiso?';
  if (!confirm(confirmMsg)) return;

  try {
    var r = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({accion: 'updatePermiso', id: id, estado: estado, aprobadoPor: CU.name})
    });
    var res = await r.json();
    if (res.ok) {
      var ct = document.getElementById('content');
      renderPermisos(ct);
      if (estado === 'APROBADO') {
        alert('✅ Permiso aprobado. Regístralo en Jibble → Tiempo Libre.');
      }
    } else {
      alert('❌ Error: ' + (res.error||'No se pudo actualizar'));
    }
  } catch(e) {
    alert('❌ Error: ' + e.message);
  }
}

</script>
