          +(esAdminIF?'<button onclick="resolverIF(\''+d.id+'\',\''+f.sku+'\',\''+f.nombre.replace(/'/g,'')+'\')" style="flex:1;padding:8px;background:#6A9E7A;color:white;border:none;border-radius:9px;font-size:0.68rem;font-weight:700;cursor:pointer">✔️ Resolver</button>':'')
          +'</div><div id="mov-'+f.sku.replace(/[^A-Za-z0-9]/g,'')+'"></div></div>';
      });
      html+='<div style="font-size:0.58rem;color:var(--gray);margin-bottom:8px">💡 El re-cruce compara tu conteo contra el stock ACTUAL. Ojo: si hubo ventas o entradas después del conteo, esas mueven el stock y pueden explicar la diferencia sin ser error.</div>';
    }
    html+='<button onclick="renderInvFisicoHist(document.getElementById(\'content\'))" style="width:100%;padding:11px;background:white;color:var(--navy);border:1.5px solid var(--navy);border-radius:11px;font-size:0.78rem;font-weight:700;cursor:pointer;margin:6px 0 24px">← Historial de inventarios</button>';
    c.innerHTML=html;
    window.scrollTo(0,0);
  })
  .catch(function(e){c.innerHTML+='<div class="card" style="color:#B86B6B">❌ '+e.message+'</div>';});
}

// ══════ INVENTARIO ══════
function renderInventario(c){
  c.innerHTML='<div style="font-size:0.88rem;font-weight:800;color:var(--navy);margin-bottom:12px">📊 Inventario</div>'
    +'<div class="loading"><div class="spinner"></div>Cargando inventario...</div>';
  // Fetch both inventory and catalog to filter by activo
  Promise.all([
    fetch(APPS_SCRIPT_URL+'?action=getInventario').then(function(r){return r.text();}),
    fetch(APPS_SCRIPT_URL+'?action=getCatalogo').then(function(r){return r.text();})
  ]).then(function(results){
    var d,cat;
    try{d=JSON.parse(results[0]);}catch(e){d={error:results[0].slice(0,100)};}
    try{cat=JSON.parse(results[1]);}catch(e){cat=[];}
    if(d.error){c.innerHTML='<div class="card" style="color:var(--red)">❌ '+d.error+'</div>';return;}

    // Build active SKU set from catalog col J.
    // OJO: el catálogo usa 'HT-101' y el inventario 'SUNSU-HT-101' → normalizamos
    // quitando el prefijo en ambos lados para que el filtro de verdad funcione.
    var activoCat={};
    if(Array.isArray(cat)) cat.forEach(function(it){
      var cod=(it.sku||'').toString().trim().replace(/^SUNSU-/,'');
      if(cod) activoCat[cod]=it.activo===true;
    });

    // Solo mostrar productos activos en catálogo (fuera de catálogo = mostrar)
    var items=(d.items||[]).filter(function(it){
      var cod=(it.sku||'').toString().trim().replace(/^SUNSU-/,'');
      if(activoCat.hasOwnProperty(cod)) return activoCat[cod]===true;
      return true; // no está en catálogo = mostrar
    });
      if(!items.length){c.innerHTML='<div class="card">Sin datos</div>';return;}
      var prefixNames={'HT':'HT — ANUA','AS':'AS — Eyenlip','ML':'ML — Dr.esthe','PH':'PH — APHLORA','JN':'JN — Varios','BV':'BV — Bruno Vassari','SU':'SU — SUNSU'};
      var grupos={};
      items.forEach(function(it){
        var m=it.sku.match(/SUNSU-([A-Z]+)-/);
        var prefix=m?m[1]:'OTROS';
        var gn=prefixNames[prefix]||('CÓDIGOS '+prefix);
        if(!grupos[gn]) grupos[gn]=[];
        grupos[gn].push(it);
      });
      var sinStock=items.filter(function(i){return i.alerta==='SIN STOCK';}).length;
      var bajo=items.filter(function(i){return i.alerta==='STOCK BAJO';}).length;
      var ok=items.filter(function(i){return i.alerta==='OK';}).length;
      window._invItems=items; // para el inventario físico
      var html='<div style="font-size:0.88rem;font-weight:800;color:var(--navy);margin-bottom:12px">📊 Inventario</div>'
        +'<div style="display:flex;gap:8px;margin-bottom:8px">'
        +'<button onclick="renderInvFisico(document.getElementById(\'content\'))" style="flex:1;padding:12px;background:var(--navy);color:white;border:none;border-radius:12px;font-size:0.78rem;font-weight:800;cursor:pointer">📋 Hacer inventario físico</button>'
        +'<button onclick="renderInvFisicoHist(document.getElementById(\'content\'))" style="padding:12px 14px;background:white;color:var(--navy);border:1.5px solid var(--navy);border-radius:12px;font-size:0.78rem;font-weight:800;cursor:pointer">📜</button>'
        +'</div>'
        +(d.ultimoFisico?'<div style="font-size:0.62rem;color:var(--gray);text-align:center;margin-bottom:10px">Último inventario físico: <b>'+d.ultimoFisico+'</b></div>':'<div style="font-size:0.62rem;color:#C4943A;text-align:center;margin-bottom:10px;font-weight:700">⚠️ Nunca se ha hecho un inventario físico</div>')
        +'<div style="display:flex;gap:8px;margin-bottom:14px">'
        +'<div style="flex:1;background:#FEE2E2;border-radius:10px;padding:10px;text-align:center"><div style="font-size:1.2rem;font-weight:900;color:#C00">'+sinStock+'</div><div style="font-size:0.6rem;color:#C00;font-weight:700">SIN STOCK</div></div>'
        +'<div style="flex:1;background:#FFF9E6;border-radius:10px;padding:10px;text-align:center"><div style="font-size:1.2rem;font-weight:900;color:#C4943A">'+bajo+'</div><div style="font-size:0.6rem;color:#C4943A;font-weight:700">STOCK BAJO</div></div>'
        +'<div style="flex:1;background:#E8F8EE;border-radius:10px;padding:10px;text-align:center"><div style="font-size:1.2rem;font-weight:900;color:#2E7D52">'+ok+'</div><div style="font-size:0.6rem;color:#2E7D52;font-weight:700">OK</div></div>'
        +'</div>';
      Object.keys(grupos).forEach(function(gn,gi){
        var gItems=grupos[gn];
        var gid='inv-grp-'+gi;
        var gSin=gItems.filter(function(i){return i.alerta==='SIN STOCK';}).length;
        var gBajo=gItems.filter(function(i){return i.alerta==='STOCK BAJO';}).length;
        var aLabel=gSin>0?(gSin+' sin stock'):gBajo>0?(gBajo+' stock bajo'):'✅ OK';
        var aCol=gSin>0?'#FEE2E2':gBajo>0?'#FFF9E6':'#E8F8EE';
        var aTxt=gSin>0?'#C00':gBajo>0?'#C4943A':'#2E7D52';
        html+='<div style="background:white;border-radius:14px;margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-sm)">'
          +'<div onclick="toggleInvGrupo(\''+gid+'\')" style="background:var(--navy);padding:11px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer">'
          +'<div style="font-size:0.82rem;font-weight:800;color:white">'+gn+'</div>'
          +'<div style="display:flex;align-items:center;gap:8px">'
          +'<span style="font-size:0.65rem;font-weight:700;background:'+aCol+';color:'+aTxt+';padding:2px 8px;border-radius:6px">'+aLabel+'</span>'
          +'<span id="inv-arrow-'+gid+'" style="color:white;font-size:0.75rem">▶</span>'
          +'</div></div>'
          +'<div id="'+gid+'" style="display:none">'
          +'<table style="width:100%;border-collapse:collapse"><thead><tr style="background:var(--cream)">'
          +'<th style="padding:7px 10px;font-size:0.6rem;text-align:left;color:var(--gray);font-weight:700">SKU</th>'
          +'<th style="padding:7px 10px;font-size:0.6rem;text-align:left;color:var(--gray);font-weight:700">PRODUCTO</th>'
          +'<th style="padding:7px 10px;font-size:0.6rem;text-align:center;color:var(--gray);font-weight:700">STOCK</th>'
          +'<th style="padding:7px 10px;font-size:0.6rem;text-align:center;color:var(--gray);font-weight:700">MÍN</th>'
          +'<th style="padding:7px 10px;font-size:0.6rem;text-align:center;color:var(--gray);font-weight:700">ALERTA</th>'
          +'</tr></thead><tbody>';
        gItems.forEach(function(it,i){
          var ac=it.alerta==='SIN STOCK'?'#C00':it.alerta==='STOCK BAJO'?'#C4943A':it.alerta==='OK'?'#2E7D52':'#aaa';
          var ab=it.alerta==='SIN STOCK'?'#FEE2E2':it.alerta==='STOCK BAJO'?'#FFF9E6':it.alerta==='OK'?'#E8F8EE':'transparent';
          var ai=it.alerta==='SIN STOCK'?'🔴':it.alerta==='STOCK BAJO'?'🟡':it.alerta==='OK'?'🟢':'⚪';
          html+='<tr style="background:'+(i%2===0?'white':'var(--cream)')+';border-bottom:1px solid var(--cream-d)">'
            +'<td style="padding:7px 10px;font-size:0.6rem;font-family:monospace;color:#666">'+it.sku+'</td>'
            +'<td style="padding:7px 10px;font-size:0.7rem;color:var(--navy)">'+it.nombre+'</td>'
            +'<td style="padding:7px 10px;text-align:center;font-size:0.88rem;font-weight:900;color:'+(it.stock===0?'#C00':it.stock<=it.minimo?'#C4943A':'var(--navy)')+'">'+it.stock+'</td>'
            +'<td style="padding:7px 10px;text-align:center;font-size:0.72rem;color:var(--gray)">'+it.minimo+'</td>'
            +'<td style="padding:7px 6px;text-align:center"><span style="font-size:0.58rem;font-weight:700;color:'+ac+';background:'+ab+';padding:2px 6px;border-radius:5px">'+ai+' '+it.alerta+'</span></td>'
            +'</tr>';
        });
        html+='</tbody></table></div></div>';
      });
      c.innerHTML=html;
    })
    .catch(function(e){c.innerHTML='<div class="card" style="color:var(--red)">❌ Error: '+e.message+'</div>';});
}

function toggleInvGrupo(gid){
  var body=document.getElementById(gid);
  var arrow=document.getElementById('inv-arrow-'+gid);
  if(!body) return;
  var open=body.style.display==='none'||body.style.display==='';
  body.style.display=open?'block':'none';
  if(arrow) arrow.textContent=open?'▼':'▶';
}

// ══════ ENTRADAS DE PRODUCTOS ══════
// ══════ CATÁLOGO (administración completa desde el app — solo admin) ══════
function renderCatalogoAdmin(c){
  if(!(CU&&(CU.role==='admin'||CU.role==='admin_master'))){c.innerHTML='<div class="card">Solo administradores</div>';return;}
  c.innerHTML='<div style="font-size:0.88rem;font-weight:800;color:var(--navy);margin-bottom:12px">🏷️ Catálogo</div>'
    +'<div class="loading"><div class="spinner"></div>Cargando catálogo...</div>';
  fetch(APPS_SCRIPT_URL+'?action=getCatalogo&_t='+Date.now())
  .then(function(r){return r.json();})
  .then(function(items){
    if(!Array.isArray(items)){c.innerHTML='<div class="card" style="color:#B86B6B">❌ '+(items.error||'Error')+'</div>';return;}
    // TODO el catálogo (productos, faciales, servicios, paquetes, gift cards)
    window._catAdmin=items.filter(function(it){return (it.sku||'').toString().trim();});
    _catShell(c);           // cascarón fijo (el buscador NO se recrea al teclear)
    _pintarCatalogoAdmin(); // resultados en su propio contenedor
  })
  .catch(function(e){c.innerHTML+='<div class="card" style="color:#B86B6B">❌ '+e.message+'</div>';});
}
function _skuVista(sku){ // productos con el prefijo SUNSU-; otros códigos tal cual
  var s=(sku||'').toString().trim().toUpperCase();
  if(/^SUNSU-/.test(s)) return s;
  return /^[A-Z]{2,3}-\d{3}$/.test(s)?('SUNSU-'+s):s;
}
function _catShell(c){
  var items=window._catAdmin||[];
  var nInact=items.filter(function(it){return !it.activo;}).length;
  c.innerHTML='<div style="font-size:0.88rem;font-weight:800;color:var(--navy);margin-bottom:12px">🏷️ Catálogo <span style="font-weight:400;font-size:0.62rem;color:var(--gray)">· '+items.length+' productos · '+nInact+' inactivos</span></div>'
    +'<button onclick="formNuevoProducto()" style="width:100%;padding:12px;background:#6A9E7A;color:white;border:none;border-radius:11px;font-size:0.8rem;font-weight:800;cursor:pointer;margin-bottom:8px">＋ Nuevo producto</button>'
    +'<div id="cat-form"></div>'
    +'<input type="text" id="cat-buscar" autocomplete="off" value="'+(window._catQ||'').replace(/"/g,'&quot;')+'" placeholder="🔍 Buscar por nombre o SKU..." oninput="window._catQ=this.value;clearTimeout(window._catQT);window._catQT=setTimeout(_pintarCatalogoAdmin,250)" style="width:100%;padding:10px;border:1.5px solid #ECEEF4;border-radius:10px;font-size:0.78rem;font-family:inherit;outline:none;box-sizing:border-box;margin-bottom:12px">'
    +'<div id="cat-res"></div>';
}
function _pintarCatalogoAdmin(){
  // Solo repinta los RESULTADOS — el buscador queda intacto y el teclado no se pierde
  var c=document.getElementById('cat-res');
  if(!c){ var cont=document.getElementById('content'); if(cont){_catShell(cont); c=document.getElementById('cat-res');} }
  if(!c) return;
  var items=window._catAdmin||[];
  var q=(window._catQ||'').toLowerCase().trim();
  window._catShowInact=window._catShowInact||{};
  var html='';
  // Carpetas por TIPO con orden canónico: Producto → Facial → Servicio → Paquetes → Gift card
  var _carpetaDe=function(it){
    var t=(it.tipo||'').trim().toUpperCase();
    var s=(it.sku||'').toString().toUpperCase();
    if(t.indexOf('FACIAL')>=0||t.indexOf('LIMPIEZA')>=0) return '💆 Faciales';
    if(t.indexOf('EXTRA')>=0||t.indexOf('ADD')>=0||t.indexOf('SERVICIO')>=0) return '✨ Servicios add-on';
    if(t.indexOf('PAQ')>=0||/^(SUNSU-)?X[36]/.test(s)) return '📦 Paquetes';
    if(t.indexOf('GIFT')>=0||s.indexOf('GIFT')>=0||s.indexOf('GC')===0) return '🎁 Gift cards';
    if(t.indexOf('PROD')>=0||/^(SUNSU-)?[A-Z]{2,3}-\d{3}$/.test(s)) return '🛍️ Productos';
    return '📁 '+(t||'Otros');
  };
  var ordenCarp=['🛍️ Productos','💆 Faciales','✨ Servicios add-on','📦 Paquetes','🎁 Gift cards'];
  var fams={};
  items.forEach(function(it,i){
    if(q && _skuVista(it.sku).toLowerCase().indexOf(q)<0 && (it.nombre||'').toLowerCase().indexOf(q)<0) return;
    var f=_carpetaDe(it);
    (fams[f]=fams[f]||[]).push({it:it,i:i});
  });
  window._catAbierta=window._catAbierta||{};
  window._catFamAbierta=window._catFamAbierta||{};
  var buscando=!!q; // buscando → todo abierto para que los resultados se vean
  var filaProd=function(par){
    var it=par.it, i=par.i;
    var util=(it.subtotal||0)-(it.compra||0);
    return '<div style="padding:8px 0;border-bottom:1px solid var(--cream-d);'+(it.activo?'':'opacity:0.45')+'">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">'
      +'<div style="flex:1;min-width:0"><div style="font-size:0.7rem;font-weight:700;color:var(--navy)">'+it.nombre+'</div>'
      +'<div style="font-size:0.56rem;color:var(--gray);font-family:monospace">'+_skuVista(it.sku)+(it.activo?'':' · DESACTIVADO')+'</div></div>'
      +'<button onclick="toggleActivoCat('+i+')" style="padding:6px 10px;border-radius:9px;font-size:0.62rem;font-weight:700;cursor:pointer;border:1.5px solid '+(it.activo?'#6A9E7A;background:#E8F8EE;color:#2E7D52':'#B86B6B;background:white;color:#B86B6B')+'">'+(it.activo?'✓ Activo':'✕ Inactivo')+'</button>'
      +'<button onclick="formEditarProducto('+i+')" style="padding:6px 10px;background:white;color:var(--navy);border:1.5px solid var(--navy);border-radius:9px;font-size:0.62rem;font-weight:700;cursor:pointer">✏️</button>'
      +'</div>'
      +'<div style="display:flex;gap:5px;margin-top:5px;flex-wrap:wrap;font-size:0.56rem">'
      +'<span style="background:var(--blue-l);color:var(--navy);padding:2px 7px;border-radius:6px;font-weight:700">Venta $'+(it.subtotal||0).toFixed(2)+' s/IVA</span>'
      +'<span style="background:var(--gray-ll,#F0F1F5);color:var(--gray);padding:2px 7px;border-radius:6px">c/IVA $'+((it.subtotal||0)*1.15).toFixed(2)+'</span>'
      +'<span style="background:var(--gray-ll,#F0F1F5);color:var(--gray);padding:2px 7px;border-radius:6px">Compra $'+(it.compra||0).toFixed(2)+'</span>'
      +((it.compraReal&&Math.abs(it.compraReal-(it.compra||0))>0.01)?'<span style="background:var(--gray-ll,#F0F1F5);color:var(--gray);padding:2px 7px;border-radius:6px">C.real $'+it.compraReal.toFixed(2)+'</span>':'')
      +'<span style="background:'+(util>0?'#E8F8EE;color:#2E7D52':'#FEE2E2;color:#C00')+';padding:2px 7px;border-radius:6px;font-weight:700">Util. H $'+util.toFixed(2)+'</span>'
      +'<span style="background:#FFF9E6;color:#8A6D1A;padding:2px 7px;border-radius:6px;font-weight:700">Com. $'+(it.com||0).toFixed(2)+'</span>'
      +(function(){
        // Utilidad REAL = venta s/IVA − compra REAL proveedor − comisión (igual que el cálculo del editor)
        if(!(it.compraReal>0)) return '';
        var uReal=(it.subtotal||0)-it.compraReal-(it.com||0);
        return '<span style="background:'+(uReal>0?'#DCF2E4;color:#1D6B42':'#FEE2E2;color:#C00')+';padding:2px 7px;border-radius:6px;font-weight:800">💰 Real $'+uReal.toFixed(2)+'</span>';
      })()
      +'</div><div id="cat-edit-'+i+'"></div></div>';
  };
  Object.keys(fams).sort(function(a,b){
    var ia=ordenCarp.indexOf(a), ib=ordenCarp.indexOf(b);
    if(ia<0) ia=99; if(ib<0) ib=99;
    return ia-ib || a.localeCompare(b);
  }).forEach(function(f){
    var todos=fams[f];
    var activos=todos.filter(function(p){return p.it.activo;});
    var inactivos=todos.filter(function(p){return !p.it.activo;});
    var verInact=!!window._catShowInact[f]||buscando;
    var abierta=!!window._catAbierta[f]||buscando;
    var fKey=f.replace(/'/g,'');
    // Cabecera desplegable de la carpeta
    html+='<div class="card" style="padding:12px;margin-bottom:10px">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">'
      +'<div onclick="window._catAbierta[\''+fKey+'\']='+(abierta?'false':'true')+';_pintarCatalogoAdmin()" style="flex:1;display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none">'
      +'<span style="font-size:0.8rem;color:var(--navy)">'+(abierta?'▾':'▸')+'</span>'
      +'<span style="font-size:0.74rem;font-weight:800;color:var(--navy)">'+f+'</span>'
      +'<span style="font-weight:400;color:var(--gray);font-size:0.6rem">('+activos.length+' activos'+(inactivos.length?' · '+inactivos.length+' inact.':'')+')</span></div>'
      +(abierta&&inactivos.length?'<button onclick="window._catShowInact[\''+fKey+'\']='+(verInact?'false':'true')+';_pintarCatalogoAdmin()" style="padding:4px 9px;background:'+(verInact?'var(--gray-ll,#F0F1F5)':'white')+';color:var(--gray);border:1.5px solid var(--cream-d);border-radius:8px;font-size:0.58rem;font-weight:700;cursor:pointer">'+(verInact?'🙈':'👁')+' '+inactivos.length+'</button>':'')
      +'</div>';
    if(abierta){
      var lista=verInact?activos.concat(inactivos):activos;
      // ¿Los items son productos con código de familia? → subdividir por familia desplegable
      var esProductos=lista.length&&lista.every(function(p){return /^(SUNSU-)?[A-Z]{2,3}-\d{3}$/i.test((p.it.sku||'').trim());});
      if(esProductos){
        var subFams={};
        lista.forEach(function(p){
          var famC=_skuVista(p.it.sku).replace(/^SUNSU-/,'').split('-')[0];
          (subFams[famC]=subFams[famC]||[]).push(p);
        });
        Object.keys(subFams).sort().forEach(function(famC){
          var famAb=!!window._catFamAbierta[famC]||buscando;
          var nAct=subFams[famC].filter(function(p){return p.it.activo;}).length;
          html+='<div onclick="window._catFamAbierta[\''+famC+'\']='+(famAb?'false':'true')+';_pintarCatalogoAdmin()" style="display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;padding:9px 6px;margin-top:6px;background:var(--cream);border-radius:9px">'
            +'<span style="font-size:0.72rem;color:var(--navy)">'+(famAb?'▾':'▸')+'</span>'
            +'<span style="font-size:0.68rem;font-weight:800;color:var(--navy)">'+famC+'</span>'
            +'<span style="font-size:0.56rem;color:var(--gray)">('+nAct+' activos'+(subFams[famC].length-nAct?' · '+(subFams[famC].length-nAct)+' inact.':'')+')</span></div>';
          if(famAb) subFams[famC].forEach(function(p){ html+=filaProd(p); });
        });
      } else {
        if(!lista.length) html+='<div style="text-align:center;color:var(--gray);font-size:0.64rem;padding:8px">Sin productos activos</div>';
        lista.forEach(function(p){ html+=filaProd(p); });
      }
    }
    html+='</div>';
  });
  c.innerHTML=html;
}
function toggleActivoCat(i){
  var it=window._catAdmin[i];
  var nuevo=!it.activo;

function _catFld(lbl,id,val,ph,tipo){
  return '<div style="margin-bottom:7px"><div style="font-size:0.58rem;font-weight:700;color:var(--gray);margin-bottom:2px">'+lbl+'</div>'
    +'<input type="'+(tipo||'text')+'" '+(tipo==='number'?'step="0.01" inputmode="decimal" ':'')+'id="'+id+'" value="'+String(val===undefined||val===null?'':val).replace(/"/g,'&quot;')+'" placeholder="'+(ph||'')+'" oninput="_catCalc()" style="width:100%;padding:8px;border:1.5px solid #ECEEF4;border-radius:9px;font-size:0.76rem;font-family:inherit;outline:none;box-sizing:border-box"></div>';

function _catCalc(){
  var sub=parseFloat((document.getElementById('cp-sub')||{}).value)||0;
  var comp=parseFloat((document.getElementById('cp-compcat')||{}).value)||0;
  var compReal=parseFloat((document.getElementById('cp-compprov')||{}).value)||0;
  var util=sub-comp; // utilidad col H = subtotal (D) − compra catálogo (G)
  var el=document.getElementById('cp-calc');
  if(!el) return;
  var html='IVA 15%: <b>$'+(sub*0.15).toFixed(2)+'</b> · Total c/IVA: <b>$'+(sub*1.15).toFixed(2)+'</b> · Utilidad catálogo (col H): <b style="color:'+(util>0?'#2E7D52':'#C00')+'">$'+util.toFixed(2)+'</b>';
  // Regla Sunsu: comisión = 30% de la utilidad de la col H
  var comEst=Math.max(0, util*0.30);
  if(sub>0){
    html+='<br>💁 Comisión por chica: <b style="color:#8A6D1A">$'+comEst.toFixed(2)+'</b> <span style="font-size:0.56rem">(30% de la utilidad: 0.30 × $'+util.toFixed(2)+')</span>';
  }
  // Utilidad REAL por producto vendido: venta s/IVA − compra REAL al proveedor − comisión
  if(sub>0){
    var compBase=compReal>0?compReal:comp;
    var utilReal=sub-compBase-comEst;
    html+='<br>💰 <b>Utilidad REAL por unidad vendida:</b> <b style="font-size:0.78rem;color:'+(utilReal>0?'#2E7D52':'#C00')+'">$'+utilReal.toFixed(2)+'</b>'
      +' <span style="font-size:0.56rem">= $'+sub.toFixed(2)+' venta − $'+compBase.toFixed(2)+' compra '+(compReal>0?'real':'catálogo*')+' − $'+comEst.toFixed(2)+' comisión</span>'
      +(compReal>0?'':'<br><span style="font-size:0.54rem;color:#C4943A">* Pon la compra REAL del proveedor para el cálculo exacto</span>');
  }
  el.innerHTML=html;
}

function renderTarjetasPendientes(c){

    fetch(APPS_SCRIPT_URL+'?action=getTarjetasInfo&_t='+Date.now()).then(function(r){return r.json();}),
    fetch(APPS_SCRIPT_URL+'?action=getSeguimientoPaquetes&_t='+Date.now()).then(function(r){return r.json();}).catch(function(){return {};})
  ]).then(function(rr){
    var data=rr[0], info=rr[1]||{}, paqs=rr[2]||{};
    if(data.error){c.innerHTML='<div class="card" style="color:#B86B6B">❌ '+data.error+'</div>';return;}
    _histData=data;
    window._tarjEnv=info.enviadas||{};
    window._tarjTelCed=info.telCed||{};
    window._tarjTelNom=info.telNom||{};
    window._tarjTelAcu=info.telAcu||{};
    // Paquetes por cédula (para adjuntar el control de paquete cuando aplica)
    var P3=window._P3S||[];
    window._tarjPaqPorCed={};
    ((paqs.items)||[]).forEach(function(p){
      var esP3=P3.some(function(s){return p.sku.indexOf(s)>=0;});
      var total=p.total||(esP3?3:6);
      var usados=0; p.usos.slice(0,total).forEach(function(u){if(u.u||u.f)usados++;});
      var it={p:p,total:total,usados:Math.min(usados,total),pend:Math.max(0,total-usados)};
      var k=(p.cedula||'').split('.')[0];
      if(k){(window._tarjPaqPorCed[k]=window._tarjPaqPorCed[k]||[]).push(it);}
    });
    window._tarjDia=window._tarjDia||0; // 0=hoy 1=ayer 2=antier
    _pintarTarjetasPend();
  }).catch(function(e){c.innerHTML='<div class="card" style="color:#B86B6B">❌ '+e.message+'</div>';});
}
function _tarjClave(t){ return 'tk'+t.tkRow+'_'+(t.fecha||''); }
function _normNomCli(s){
  return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
}
function _telDeTicket(t){
  // 1º el teléfono resuelto por el SERVIDOR (una sola lógica de nombres)
  if(t.telefono){
    var tS=(t.telefono||'').toString().replace(/[^0-9]/g,'');
    if(tS.length===10&&tS.charAt(0)==='0') tS='593'+tS.slice(1);
    if(tS.length===9) tS='593'+tS;
    if(tS) return tS;
  }
  // Respaldo local: ACUITY → REGISTRO → aproximación
  var ced=(t.cedula||'').split('.')[0];
  var full=_normNomCli((t.nombre||'')+' '+(t.apellido||''));
  var tel=window._tarjTelAcu[full]||'';
  if(!tel){ // Acuity por prefijo nombre+apellido
    var pn=_normNomCli(t.nombre).split(' ')[0], pa=_normNomCli(t.apellido).split(' ')[0];
    if(pn&&pa){
      var ks=Object.keys(window._tarjTelAcu||{});
      for(var i=0;i<ks.length;i++){ if(ks[i].indexOf(pn)===0&&ks[i].indexOf(pa)>=0){tel=window._tarjTelAcu[ks[i]];break;} }
    }
  }
  if(!tel) tel=(ced&&window._tarjTelCed[ced])||'';
  if(!tel) tel=window._tarjTelNom[full]||'';
  tel=(tel||'').replace(/[^0-9]/g,'');
  if(tel&&tel.length===10&&tel.charAt(0)==='0') tel='593'+tel.slice(1);
  if(tel&&tel.length===9) tel='593'+tel; // celular sin el 0 inicial
  return tel;
}

// Descarga escalonada (900ms) — los navegadores bloquean la 2ª descarga seguida
function _descargarDocsEscalonado(docs){
  var colaD=(docs||[]).slice(), iD=0;
  var bajar=function(){
    if(iD>=colaD.length) return;
    var r=colaD[iD++];
    try{
      var urlB=URL.createObjectURL(r.doc.output('blob'));
      var aB=document.createElement('a'); aB.href=urlB; aB.download=r.nom;
      document.body.appendChild(aB); aB.click(); aB.remove();
      setTimeout(function(){URL.revokeObjectURL(urlB);},5000);
    }catch(eD){ try{ r.doc.save(r.nom); }catch(eD2){} }
    if(iD<colaD.length) setTimeout(bajar, 900);
  };
  bajar();
}
// ── Flujo WhatsApp en 2 toques ──
// Toque 1: abre el chat DIRECTO AL NÚMERO (queda en recientes) y pre-genera los PDFs.
// Toque 2: comparte los PDFs ya listos → WhatsApp → la clienta aparece en recientes.
// (wa.me no puede llevar archivos — es límite de WhatsApp, no del app)
function flujoWhatsApp(tkRow, ced, tel, conPaq, msg){
  window._waEstado=window._waEstado||{};
  var key='k'+tkRow;
  var est=window._waEstado[key];
  var btn=document.getElementById('wa-btn-'+tkRow);
  if(!est){ // ── TOQUE 1 ──
    window._waEstado[key]={listo:false, files:[]};
    var vent=window.open('https://wa.me/'+tel+'?text='+msg,'_blank');
    if(!vent) window.location.href='https://wa.me/'+tel+'?text='+msg;
    if(btn){btn.textContent='⏳ Preparando PDF'+(conPaq?'s':'')+'...';btn.disabled=true;}
    // Pre-generar en segundo plano mientras la chica manda el saludo
    var gens=[ new Promise(function(res){ tarjetaTicket(tkRow, function(doc,nom){res({doc:doc,nom:nom});}); }) ];
    if(conPaq){
      gens.push(new Promise(function(res){
        var x=(window._tarjPaqRef||{})['c'+ced];
        if(!x){res(null);return;}
        var img=new Image(); img.crossOrigin='anonymous';
        img.onload=function(){_pdfTarjetaPaquete(x, img, function(doc,nom){res({doc:doc,nom:nom});});};
        img.onerror=function(){_pdfTarjetaPaquete(x, null, function(doc,nom){res({doc:doc,nom:nom});});};
        img.src=GCD_PAG3_URL;
      }));
    }
    Promise.all(gens).then(function(rr){
      var files=[];
      rr.filter(Boolean).forEach(function(r){
        try{ files.push(new File([r.doc.output('blob')], r.nom, {type:'application/pdf'})); }catch(eF){}
      });
      window._waEstado[key]={listo:true, files:files, docs:rr.filter(Boolean)};
      var b2=document.getElementById('wa-btn-'+tkRow);
      if(_esMovil_()){
        // iPhone: la hoja de compartir EXIGE un toque fresco → botón 📎 para el segundo toque
        if(b2){b2.textContent='📎 Enviar '+files.length+' PDF'+(files.length!==1?'s':'');b2.disabled=false;b2.style.background='#128C7E';}
        toast('✅ PDF'+(files.length!==1?'s':'')+' listo'+(files.length!==1?'s':'')+' — vuelve y toca 📎 Enviar','var(--green)');
      } else {
        // Computadora: descargar AUTOMÁTICAMENTE, sin segundo toque
        _descargarDocsEscalonado(rr.filter(Boolean));
        if(b2){b2.textContent='⬇️ Re-descargar PDF'+(files.length!==1?'s':'');b2.disabled=false;b2.style.background='#128C7E';}
        toast('📄 '+files.length+' PDF'+(files.length!==1?'s':'')+' descargándose — arrástralo'+(files.length!==1?'s':'')+' al chat abierto','var(--green)');
      }
    }).catch(function(e){
      var b3=document.getElementById('wa-btn-'+tkRow);
      if(b3){b3.textContent='💬 WhatsApp';b3.disabled=false;}
      delete window._waEstado[key];
      toast('❌ '+e.message,'#B86B6B');
    });
    return;
  }
  if(!est.listo){toast('⏳ Todavía preparando los PDFs...','var(--blue)');return;}
  // ── TOQUE 2: compartir los archivos + EL MENSAJE juntos (un solo envío) ──
  try{
    if(_esMovil_() && navigator.canShare && navigator.canShare({files:est.files})){
      var txtMsg=''; try{ txtMsg=decodeURIComponent(msg||''); }catch(eM){ txtMsg=msg||''; }
      navigator.share({files:est.files, text:txtMsg, title:'Sunsu Spa'}).then(function(){
        toast('✅ PDFs + mensaje enviados juntos','var(--green)');
      }).catch(function(){});
      return;
    }
  }catch(eS){}
  // Computadora (re-descarga con el mismo botón)
  _descargarDocsEscalonado(est.docs||[]);
  toast('📄 '+(est.docs||[]).length+' PDF'+((est.docs||[]).length!==1?'s':'')+' descargándose — arrástralo'+((est.docs||[]).length!==1?'s':'')+' al chat abierto','var(--blue)');
}

// ══════ TARJETA DE TRATAMIENTO POR TICKET (PDF A4 para la clienta) ══════
function _cargarFotoTk(url){
  // El navegador NO puede leer fotos de Drive (CORS) → el SERVIDOR las manda en base64
  return new Promise(function(res){
    try{
      var m=(url||'').toString().match(/[-\w]{25,}/);
      if(!m){res(null);return;}
      var to=setTimeout(function(){res(null);},12000);
      fetch(APPS_SCRIPT_URL+'?action=fotoB64&id='+m[0]+'&_t='+Date.now())
      .then(function(r){return r.json();})
      .then(function(d){
        clearTimeout(to);
        if(!d.ok||!d.b64){res(null);return;}
        var data='data:'+(d.mime||'image/jpeg')+';base64,'+d.b64;
        var img=new Image();
        img.onload=function(){res({data:data, w:img.width, h:img.height});};
        img.onerror=function(){res(null);};
        img.src=data;
      })
      .catch(function(){clearTimeout(to);res(null);});
    }catch(e){res(null);}
  });
}
// Precargar los logos de WhatsApp e Instagram (normalmente solo cargan en el módulo GC)
function _precargarIconosGcd(){
  return new Promise(function(res){
    var falta=0, fin=function(){ if(--falta<=0) res(true); };
    var carga=function(nombre,url){
      if(window[nombre]&&window[nombre].complete&&window[nombre].naturalWidth>0){return;}
      falta++;
      var im=new Image(); im.crossOrigin='anonymous';
      im.onload=fin; im.onerror=function(){im._fallo=true;fin();};
      im.src=url; window[nombre]=im;
    };
    try{ carga('_gcdIconoWA', GCD_ICONO_WA_URL); carga('_gcdIconoIG', GCD_ICONO_IG_URL); }catch(e){}
    if(!falta) res(true);
    setTimeout(function(){res(true);},4000);
  });
}
// Tira de 5 iconitos de contacto — pequeños, elegantes y discretos
function _stripAgendaSunsu(){
  var igOK=window._gcdIconoIG&&_gcdIconoIG.complete&&_gcdIconoIG.naturalWidth>0&&!_gcdIconoIG._fallo;
  var waOK=window._gcdIconoWA&&_gcdIconoWA.complete&&_gcdIconoWA.naturalWidth>0&&!_gcdIconoWA._fallo;
  var iconos=[
    {emoji:'📅', img:null,                  label:'Agenda',    url:'https://app.acuityscheduling.com/schedule.php?owner=35065947'},
    {emoji:'💬', img:waOK?_gcdIconoWA:null, label:'WhatsApp',  url:'https://wa.me/593990665112'},
    {emoji:'🌐', img:null,                  label:'Web',       url:'https://www.sunsuspa.com'},
    {emoji:'📸', img:igOK?_gcdIconoIG:null, label:'Instagram', url:'https://www.instagram.com/sunsuspa?igsh=MWg2aHJ2ZDNoeTgzNg=='},
    {emoji:'📍', img:null,                  label:'Ubicación', url:'https://maps.app.goo.gl/ztHyuXZ1NyL3dFBB6'}
  ];
  // Discreto y elegante: círculos pequeños con aro fino, todos idénticos (dibujado @2x)
  var r=34, gap=58;
  var total=iconos.length*2*r+(iconos.length-1)*gap;
  var CW=total+24, CH=2*r+40;
  var cv=document.createElement('canvas'); cv.width=CW; cv.height=CH;
  var x=cv.getContext('2d');
  var cy=r+3, links=[];
  iconos.forEach(function(ic,i){
    var cx=12+r+i*(2*r+gap);
    x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2); x.fillStyle='#FFFFFF'; x.fill();
    x.lineWidth=2.5; x.strokeStyle='#9FB2CC'; x.stroke();
    if(ic.img){
      var s=r*1.15; try{ x.drawImage(ic.img, cx-s/2, cy-s/2, s, s); }catch(eI){}
    } else {
      x.font=Math.round(r*1.05)+'px Arial'; x.textAlign='left';
      var we=x.measureText(ic.emoji).width;
      x.fillText(ic.emoji, cx-we/2, cy+r*0.38);
    }
    x.fillStyle='#5A6E8C'; x.font='600 '+Math.round(r*0.42)+'px Arial'; x.textAlign='left';
    var wl=x.measureText(ic.label).width;
    x.fillText(ic.label, cx-wl/2, cy+r+22);
    links.push({x:cx-r-4, y:cy-r-4, w:2*r+8, h:2*r+30, url:ic.url});
  });
  return {data:cv.toDataURL('image/png'), w:CW, h:CH, links:links};
}
function tarjetaTicket(tkRow, cbTk){

function _pdfTarjetaTicket(t, fondo, fotosA, fotosD, cbTT){
  _gcdCargarJsPDF(function(ok){
    if(!ok){toast('❌ No se pudo cargar el generador de PDF','#B86B6B');return;}
    var doc=new window.jspdf.jsPDF({unit:'pt',format:'a4'});
    var W=595, H=842, NAVY='#3D5A7A', TXT='#4A5568', GOLD='#8A6D1A', VERDE='#2E7D52';
    var xI=55, ANCHO=485, xD=xI+ANCHO;
    if(fondo) doc.addImage(_fondoA4Sunsu(fondo),'JPEG',0,0,W,H);
    var limpia=function(s){return (s||'').toString()
      .replace(/SUNSU-[A-Z]{0,3}-?\d+\s*[-—:·]*\s*/gi,'')   // SUNSU-17, SUNSU-HT-101
      .replace(/\b[A-Z]{2,3}-\d{3}\b\s*[-—:·]*\s*/g,'')      // HT-101 suelto
      .replace(/\s{2,}/g,' ').trim();};
    // Nombres de productos desde el catálogo del app (código → nombre, sin precios)
    var nomProd=function(code){
      code=(code||'').trim();
      var hit=null;
      (window.PROVS||[]).some(function(pv){return (pv.prods||[]).some(function(pr){if(pr.sku.indexOf(code)>=0||code.indexOf(pr.sku)>=0){hit=pr.n;return true;}return false;});});
      return hit||code;
    };
    var fechaT=(t.fecha||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    var fechaFmt=fechaT?(fechaT[3]+'/'+fechaT[2]+'/'+fechaT[1]):(t.fecha||'');
    var y=116; // pegado al logo: TODO debe caber en UNA hoja A4
    doc.setTextColor(NAVY); doc.setFont('helvetica','bold'); doc.setFontSize(17);
    doc.text('TARJETA DE TRATAMIENTO',W/2,y,{align:'center'}); y+=14;
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(TXT);
    doc.text('Sunsu Spa - Glass Skin - '+fechaFmt,W/2,y,{align:'center'}); y+=17;
    doc.setFontSize(9.5); doc.setFont('helvetica','bold'); doc.setTextColor(NAVY);
    doc.text(((t.nombre||'')+' '+(t.apellido||'')).trim(),W/2,y,{align:'center'}); y+=11;
    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(TXT);
    doc.text('Atendida por '+(t.cosmetologa||''),W/2,y,{align:'center'}); y+=15;
    var salto=function(n){ if(y+n>H-64){doc.addPage(); if(fondo)doc.addImage(_fondoA4Sunsu(fondo),'JPEG',0,0,W,H); y=140;} };
    var seccion=function(titulo){
      salto(32);
      doc.setFillColor(61,90,122);
      doc.roundedRect(xI,y,ANCHO,17,4,4,'F');
      doc.setTextColor('#FFFFFF'); doc.setFont('helvetica','bold'); doc.setFontSize(8.4);
      doc.text(titulo,xI+9,y+12); y+=23;
    };
    var lineaTx=function(lbl,txt){
      if(!txt) return;
      salto(16);
      doc.setFont('helvetica','bold'); doc.setFontSize(8.2); doc.setTextColor(NAVY);
      doc.text(lbl,xI+4,y);
      doc.setFont('helvetica','normal'); doc.setTextColor(TXT);
      var ls=doc.splitTextToSize(txt, ANCHO-120);
      doc.text(ls,xI+118,y);
      y+=Math.max(13, ls.length*11+2);
    };
    // ── TU EXPERIENCIA: tablita vertical (cantidad | detalle | tipo) ──
    seccion('TU EXPERIENCIA DE HOY');
    var filasExp=[];
    if(limpia(t.facial)) filasExp.push({c:1, d:limpia(t.facial), tp:'Facial'});
    (limpia(t.extras)||'').split(/\s*[,;+]\s*/).forEach(function(ex){
      if(ex.trim()) filasExp.push({c:1, d:ex.trim(), tp:'Extra'});
    });
    var paqExp=limpia(t.pack3)||limpia(t.pack6);
    if(paqExp) filasExp.push({c:1, d:paqExp+(t.pack3?' (3 sesiones)':' (6 sesiones)'), tp:'Paquete'});
    (t.productos||[]).forEach(function(p){
      var m=p.match(/^(.*?)\s*×(\d+)\s*$/);
      var base=m?m[1]:p, cant=m?parseInt(m[2]):1;
      if(/^[A-Z]{2,3}-\d{3}$/.test(base.trim())) base=nomProd(base.trim());
      filasExp.push({c:cant, d:limpia(base), tp:'Producto'});
    });
    if(/^\s*SI\b/i.test(t.colS||'')) filasExp.push({c:1, d:'Canje de Gift Card', tp:'Gift card'});
    if(filasExp.length){
      // Agrupar por tipo, cada grupo con su encabezado propio
      var ordenGr=['Facial','Paquete','Producto','Gift card','Extra'];
      var titGr={'Facial':'FACIAL','Paquete':'PAQUETES','Producto':'PRODUCTOS','Gift card':'GIFT CARDS','Extra':'EXTRAS'};
      ordenGr.forEach(function(gr){
        var filasGr=filasExp.filter(function(f){return f.tp===gr;});
        if(!filasGr.length) return;
        salto(18+filasGr.length*15);
        // Encabezado del grupo
        doc.setFont('helvetica','bold'); doc.setFontSize(7.4); doc.setTextColor(NAVY);
        doc.text(titGr[gr],xI+4,y);
        doc.setDrawColor(220,224,232); doc.setLineWidth(0.6);
        doc.line(xI,y+3,xD,y+3); y+=8;
        filasGr.forEach(function(f,i){
          salto(15);
          if(i%2===1){doc.setFillColor(246,243,234);doc.rect(xI,y-2,ANCHO,13.5,'F');}
          doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(NAVY);
          doc.text(String(f.c),xI+14,y+7.8,{align:'center'});
          doc.setFont('helvetica','normal'); doc.setTextColor(TXT);
          var dTx=f.d.length>68?f.d.slice(0,66)+'..':f.d;
          doc.text(dTx,xI+38,y+7.8);
          y+=13.5;
        });
        y+=5; // aire entre grupos
      });
      y+=4;
    }
    // ── RECOMENDACIONES / NOTAS ──
    if(t.recomendaciones||t.notas){
      seccion('RECOMENDACIONES PARA TU PIEL');
      if(t.recomendaciones){
        salto(20);
        doc.setFont('helvetica','normal'); doc.setFontSize(8.4); doc.setTextColor(TXT);
        var lR=doc.splitTextToSize(t.recomendaciones, ANCHO-16);
        doc.text(lR,xI+8,y); y+=lR.length*11+8;
      }
      if(t.notas){
        salto(20);
        doc.setFont('helvetica','bold'); doc.setFontSize(7.6); doc.setTextColor(GOLD);
        doc.text('Notas de tu piel:',xI+8,y); y+=11;
        doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(TXT);
        var lN=doc.splitTextToSize(t.notas, ANCHO-16);
        doc.text(lN,xI+8,y); y+=lN.length*11+6;
      }
    }
    // ── FOTOS ANTES / DESPUÉS: incrustadas, hasta 3 por lado, una debajo de otra ──
    if((fotosA&&fotosA.length)||(fotosD&&fotosD.length)){
      seccion('TU ANTES Y DESPUES');
      var fw=(ANCHO-20)/2;
      // ALTO AUTO-AJUSTABLE: se calcula con el espacio que QUEDA en la hoja
      // (menos lo reservado para retorno + tira de agenda) — matemáticamente
      // imposible que se pase a una segunda página.
      var maxFotos=Math.max((fotosA||[]).length,(fotosD||[]).length);
      var reservaAbajo=(t.retorno?34:0)+62; // caja de retorno + tira de agenda
      var dispF=(H-reservaAbajo)-y-16;      // espacio vertical disponible para las fotos
      var base=maxFotos>=3?90:(maxFotos===2?122:150);
      var altoFoto=Math.max(52, Math.min(base, Math.floor(dispF/maxFotos)-9));
      var colFotos=function(lista,x0,lbl){
        var yy=y;
        doc.setFont('helvetica','bold'); doc.setFontSize(7.6); doc.setTextColor(NAVY);
        doc.text(lbl,x0+fw/2,yy,{align:'center'}); yy+=7;
        (lista||[]).forEach(function(img){
          var esc=Math.min(fw/img.w, altoFoto/img.h);
          var iw=img.w*esc, ih=img.h*esc;
          doc.addImage(img.data,'JPEG',x0+(fw-iw)/2,yy,iw,ih);
          yy+=ih+4;
        });
        return yy;
      };
      salto(20+maxFotos*(altoFoto+8));
      var yA=(fotosA&&fotosA.length)?colFotos(fotosA,xI,'ANTES'):y;
      var yD=(fotosD&&fotosD.length)?colFotos(fotosD,xI+fw+20,'DESPUES'):y;
      y=Math.max(yA,yD)+10;
    }
    // ── PRÓXIMA CITA RECOMENDADA ──
    if(t.retorno){
      salto(40);
      var rM=(t.retorno||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
      var retFmt=rM?(rM[3]+'/'+rM[2]+'/'+rM[1]):t.retorno;
      doc.setFillColor(253,247,230);
      doc.roundedRect(xI,y,ANCHO,24,6,6,'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(9.2); doc.setTextColor(GOLD);
      doc.text('PROXIMA CITA RECOMENDADA: '+retFmt,W/2,y+16,{align:'center'});
      y+=32;
    }
    // ── AGENDA TU SIGUIENTE CITA — DISCOS estilo gift card, anclados al fondo ──
    var strip=_stripAgendaSunsu();
    var dw=250, dh=dw*strip.h/strip.w; // pequeño y discreto
    var sx=(W-dw)/2, sy=H-dh-10;       // lo más abajo posible — SIEMPRE en la misma hoja
    doc.setFont('helvetica','normal'); doc.setFontSize(6.8); doc.setTextColor(TXT);
    doc.text('Agenda tu siguiente cita - toca una opcion:',W/2,sy-4,{align:'center'});
    doc.addImage(strip.data,'PNG',sx,sy,dw,dh);
    var escS=dw/strip.w;
    strip.links.forEach(function(l){ doc.link(sx+l.x*escS, sy+l.y*escS, l.w*escS, l.h*escS, {url:l.url}); });
    doc.setFont('helvetica','normal'); doc.setFontSize(6.4); doc.setTextColor(TXT);
    doc.text('Gracias por confiar el cuidado de tu piel en Sunsu Spa',W/2,sy-13,{align:'center'});
    var nomArchTT='Tarjeta '+(t.nombre||'').split(' ')[0]+' '+fechaFmt.replace(/\//g,'-')+'.pdf';
    if(cbTT){ cbTT(doc, nomArchTT); return; }
    _entregarPDF(doc, nomArchTT);
    toast('📄 Tarjeta lista — compártela por WhatsApp','var(--green)');
  });
}

function guardarProveedor(fila){
  var g=function(id){return (document.getElementById(id)||{}).value||'';};
  var payload={accion:'guardarProveedorApp',fila:fila,nombre:g('pv-nombre').trim(),ruc:g('pv-ruc').trim(),
    telefono:g('pv-tel').trim(),direccion:g('pv-dir').trim(),email:g('pv-email').trim(),
    familia:g('pv-fam').trim().toUpperCase(),notas:g('pv-notas').trim()};
  if(!payload.nombre||!payload.familia){toast('Nombre y familia son obligatorios','#C9A227');return;}
  toast('⏳ Guardando...','var(--blue)');
  fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)})
  .then(function(r){return r.json();})
  .then(function(d){
    if(!d.ok){toast('❌ '+(d.error||'Error'),'#B86B6B');return;}
    toast('✅ Proveedor guardado','var(--green)');
    renderProveedores(document.getElementById('content'));
  }).catch(function(e){toast('❌ '+e.message,'#B86B6B');});
}
function eliminarProveedor(i){
  var p=window._provsApp[i];
  if(!confirm('🗑️ ¿Eliminar el proveedor "'+p.nombre+'"?\nSus órdenes pasadas no se afectan.')) return;
  fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({accion:'eliminarProveedorApp',fila:p.fila})})
  .then(function(r){return r.json();})
  .then(function(d){
    if(!d.ok){toast('❌ '+(d.error||'Error'),'#B86B6B');return;}
    toast('🗑️ Proveedor eliminado','var(--gray)');
    renderProveedores(document.getElementById('content'));
  }).catch(function(e){toast('❌ '+e.message,'#B86B6B');});
}

function renderNuevaOC(c){
  c.innerHTML='<div style="font-size:0.88rem;font-weight:800;color:var(--navy);margin-bottom:12px">🛒 Nueva orden de compra</div>'
    +'<div class="loading"><div class="spinner"></div>Cargando proveedores...</div>';
  fetch(APPS_SCRIPT_URL+'?action=getProveedoresApp')
  .then(function(r){return r.json();})
  .then(function(d){
    window._provsApp=d.proveedores||[];
    if(!window._provsApp.length){c.innerHTML='<div class="card">No hay proveedores — agrégalos primero en 🏭</div>';return;}
    // Quincenas: la anterior (default) y las 3 previas + la actual
    var hoy=new Date(), ops=[], cur={m:hoy.getMonth()+1,a:hoy.getFullYear(),q:hoy.getDate()<=15?1:2};
    var back=function(o){var q=o.q-1,m=o.m,a=o.a;if(q<1){q=2;m--;if(m<1){m=12;a--;}}return {m:m,a:a,q:q};};
    var lbl=function(o){return (o.q===1?'1-15':'16-fin')+' '+['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'][o.m-1]+' '+o.a;};
    var o=cur; for(var k=0;k<5;k++){ops.push(o);o=back(o);}
    var html='<div style="font-size:0.88rem;font-weight:800;color:var(--navy);margin-bottom:12px">🛒 Nueva orden de compra</div>'
      +'<div class="card" style="padding:14px;margin-bottom:10px">'
      +'<div style="font-size:0.62rem;font-weight:700;color:var(--gray);margin-bottom:4px">PROVEEDOR</div>'
      +'<select id="oc-prov" style="width:100%;padding:10px;border:1.5px solid var(--navy);border-radius:10px;font-size:0.78rem;font-weight:700;color:var(--navy);font-family:inherit;background:white;margin-bottom:10px">'
      +window._provsApp.map(function(p,i){return '<option value="'+i+'">'+p.nombre+' ('+p.familia+')</option>';}).join('')
      +'</select>'
      +'<div style="font-size:0.62rem;font-weight:700;color:var(--gray);margin-bottom:4px">QUINCENA DE VENTAS (base del pedido)</div>'
      +'<select id="oc-q" style="width:100%;padding:10px;border:1.5px solid #ECEEF4;border-radius:10px;font-size:0.78rem;font-family:inherit;background:white;margin-bottom:10px">'
      +ops.map(function(op,i){return '<option value="'+op.q+'|'+op.m+'|'+op.a+'"'+(i===1?' selected':'')+'>'+lbl(op)+(i===0?' (en curso)':'')+'</option>';}).join('')
      +'</select>'
      +'<button onclick="cargarBorradorOC()" style="width:100%;padding:11px;background:var(--navy);color:white;border:none;border-radius:10px;font-size:0.78rem;font-weight:800;cursor:pointer">📝 Cargar borrador</button>'
      +'</div>'
      +'<div id="oc-borrador"></div>'
      +'<button onclick="showTab(\'entradas\')" style="width:100%;padding:10px;background:white;color:var(--gray);border:1.5px solid var(--cream-d);border-radius:11px;font-size:0.76rem;font-weight:700;cursor:pointer;margin:6px 0 24px">← Volver a Entradas</button>';
    c.innerHTML=html;
  })
  .catch(function(e){c.innerHTML+='<div class="card" style="color:#B86B6B">❌ '+e.message+'</div>';});
}
function cargarBorradorOC(){
  var p=window._provsApp[parseInt(document.getElementById('oc-prov').value)];
  var qp=document.getElementById('oc-q').value.split('|');
  var box=document.getElementById('oc-borrador');
  box.innerHTML='<div class="loading"><div class="spinner"></div>Calculando ventas y stock de '+p.familia+'...</div>';
  fetch(APPS_SCRIPT_URL+'?action=getBorradorOCApp&familia='+encodeURIComponent(p.familia)+'&quincena='+qp[0]+'&mes='+qp[1]+'&anio='+qp[2])
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.error){box.innerHTML='<div class="card" style="color:#B86B6B">❌ '+d.error+'</div>';return;}
    var itemsB=(d.items||[]).map(function(it){it.cant=it.sugerido;return it;});
    window._ocBorrador={prov:p,qLabel:d.qLabel,items:itemsB,
      // Bloque de facturación EDITABLE: cantidades vendidas y precios (los productos
      // propios de Sunsu que no son a consignación se quitan aquí con ✕)
      fact:itemsB.filter(function(it){return (it.vendido||0)>0;})
        .map(function(it){return {sku:it.sku,nombre:it.nombre,vendido:it.vendido,compra:it.compra};})};
    _pintarBorradorOC();
  })
  .catch(function(e){box.innerHTML='<div class="card" style="color:#B86B6B">❌ '+e.message+'</div>';});
}
function _pintarBorradorOC(){
  var B=window._ocBorrador, box=document.getElementById('oc-borrador');
  if(!B||!box) return;
  var conCant=B.items.filter(function(it){return (it.cant||0)>0;});
  var total=conCant.reduce(function(s,it){return s+(it.cant||0)*(it.compra||0);},0);
  var totalF=(B.fact||[]).reduce(function(s,it){return s+(it.vendido||0)*(it.compra||0);},0);
  // ── BLOQUE 1: FACTURACIÓN editable (consignación — lo vendido que se paga al proveedor) ──

function _ocTotal(){
  var B=window._ocBorrador;
  var conCant=B.items.filter(function(it){return (it.cant||0)>0;});
  var total=conCant.reduce(function(s,it){return s+(it.cant||0)*(it.compra||0);},0);
  var el=document.getElementById('oc-total');
  if(el) el.textContent='Total estimado: $'+total.toFixed(2)+' · '+conCant.length+' productos';
  var totalF=(B.fact||[]).reduce(function(s,it){return s+(it.vendido||0)*(it.compra||0);},0);
  var elF=document.getElementById('oc-total-fact');
  if(elF) elF.innerHTML='Subtotal: $'+totalF.toFixed(2)+' · IVA 15%: $'+(totalF*0.15).toFixed(2)+' · <b style="font-size:0.8rem">Total a facturar: $'+(totalF*1.15).toFixed(2)+'</b>';
}
function generarOCApp(){
  var B=window._ocBorrador;
  var items=B.items.filter(function(it){return (it.cant||0)>0;}).map(function(it){return {sku:it.sku,nombre:it.nombre,cant:it.cant,compra:it.compra};});
  var factF=(B.fact||[]).filter(function(it){return (it.vendido||0)>0;});
  // Se permite una orden SIN restock (solo facturación de lo vendido) — pero no vacía del todo
  if(!items.length&&!factF.length){toast('La orden está vacía: ni facturación ni restock','#C9A227');return;}
  if(!confirm('✓ GENERAR ORDEN DE COMPRA\n\nProveedor: '+B.prov.nombre+'\nFacturación: '+factF.length+' productos vendidos\nRestock: '+(items.length||'0 — solo facturación')+' productos\n\n'+(items.length?'Se registrará en Entregas y se':'Se')+' descargará el PDF. ¿Continuar?')) return;
  toast('⏳ Generando orden...','var(--blue)');
  fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({accion:'crearOCApp',proveedor:B.prov.nombre,qLabel:B.qLabel,items:items,fact:factF,provData:B.prov,usuario:CU?CU.name:'—'})})
  .then(function(r){return r.json();})
  .then(function(d){
    if(!d.ok){toast('❌ '+(d.error||'Error'),'#B86B6B');return;}
    toast('✅ Orden '+d.numOrden+' generada y registrada en Entregas','var(--green)');
    _pdfOC(d.numOrden, d.fecha, B.prov, B.qLabel, items, factF);
    setTimeout(function(){showTab('entradas');},1800);
  })
  .catch(function(e){toast('❌ '+e.message,'#B86B6B');});
}
// ── Fondo A4 vertical compuesto desde el arte del gift card:
//    crema + logo 순수 SUNSU limpio (sin "GLASS SKIN / FACIALES COREANOS") arriba,
//    florales en las esquinas inferiores. Medidas exactas del asset (1348x896):
//    logo y50-195 x480-870 · floral izq x0-300 y330-896 · floral der x1130-1348 y340-896
function _fondoA4Sunsu(fondo){
  if(window._fondoA4Cache) return window._fondoA4Cache;
  var CW=1240, CH=1754; // A4 a ~150dpi
  var cv=document.createElement('canvas'); cv.width=CW; cv.height=CH;
  var ctx=cv.getContext('2d');
  ctx.fillStyle='rgb(253,250,241)'; ctx.fillRect(0,0,CW,CH);
  try{
    // Logo limpio, centrado arriba
    var lw=340, lh=lw*(145/390);
    ctx.drawImage(fondo, 480,50,390,145, (CW-lw)/2, 60, lw, lh);
    // Florales inferiores
    var fiW=330, fiH=fiW*(566/300);
    ctx.drawImage(fondo, 0,330,300,566, 0, CH-fiH, fiW, fiH);
    var fdW=240, fdH=fdW*(556/218);
    ctx.drawImage(fondo, 1130,340,218,556, CW-fdW, CH-fdH, fdW, fdH);
  }catch(eC){}
  window._fondoA4Cache=cv.toDataURL('image/jpeg',0.85);
  return window._fondoA4Cache;
}

function _pdfOC(numOrden, fecha, prov, qLabel, items, itemsFact){
  var img=new Image();
  img.crossOrigin='anonymous';
  img.onload=function(){_pdfOCFondo(numOrden,fecha,prov,qLabel,items,itemsFact,img);};
  img.onerror=function(){_pdfOCFondo(numOrden,fecha,prov,qLabel,items,itemsFact,null);};
  img.src=GCD_PAG3_URL;
}
function _pdfOCFondo(numOrden, fecha, prov, qLabel, items, itemsFact, fondo){
  _gcdCargarJsPDF(function(ok){

    var doc=new window.jspdf.jsPDF({unit:'pt',format:'a4'}); // A4 vertical: 595 x 842
    var W=595, H=842, NAVY='#3D5A7A', TXT='#4A5568', GOLD='#8A6D1A';
    var xI=55, ANCHO=485, xD=xI+ANCHO;

    var pintar=function(){ if(bg) doc.addImage(bg,'JPEG',0,0,W,H); };
    pintar();

    doc.setFontSize(9);

      if(!v) return;
      doc.setFont('helvetica','bold'); doc.setTextColor(NAVY); doc.text(l,xI,y);
      doc.setFont('helvetica',dest?'bold':'normal'); doc.setTextColor(dest?GOLD:TXT);
      doc.text(v.toString(),xI+118,y); y+=14;
    };
    fila('# ORDEN:',numOrden,true);
    fila('FECHA:',fecha);
    fila('QUINCENA:',qLabel);
    fila('PROVEEDOR:',prov.nombre);
    fila('RUC:',prov.ruc);
    fila('TELÉFONO:',prov.telefono);

    fila('SOLICITADO POR:','Sunsu Spa — Administración');
    y+=6;
    var salto=function(need){ if(y+need>H-70){doc.addPage();pintar();y=140;} };
    var barra=function(titulo){
      salto(40);
      doc.setFillColor(61,90,122);
      doc.roundedRect(xI,y,ANCHO,20,4,4,'F');
      doc.setTextColor('#FFFFFF'); doc.setFont('helvetica','bold'); doc.setFontSize(9.5);
      doc.text(titulo,xI+8,y+13.5); y+=20;
    };
    var cabTabla=function(cLbl, conPrecios){
      doc.setFillColor(238,234,222);
      doc.rect(xI,y,ANCHO,15,'F');
      doc.setTextColor(NAVY); doc.setFont('helvetica','bold'); doc.setFontSize(7.8);

        doc.text('TOTAL',xD-6,y+10.5,{align:'right'});
      } else {
        doc.text(cLbl,xD-6,y+10.5,{align:'right'});
      }
      y+=15;
    };
    var tabla=function(lista, campoCant, cLbl, conPrecios){
      cabTabla(cLbl, conPrecios);
      doc.setFontSize(8);
      var tot=0;
      lista.forEach(function(it,i){
        salto(16);
        if(i%2===1){doc.setFillColor(246,243,234);doc.rect(xI,y,ANCHO,14,'F');}
        else{doc.setFillColor(255,255,255);doc.rect(xI,y,ANCHO,14,'F');}
        var cant=it[campoCant]||0, sub=cant*(it.compra||0); tot+=sub;
        doc.setFont('helvetica','normal'); doc.setTextColor(TXT);
        doc.text(it.sku.replace('SUNSU-',''),xI+6,y+10);

          doc.text('$'+sub.toFixed(2),xD-6,y+10,{align:'right'});
        }
        y+=14;
      });
      return tot;
    };
    // ── SECCIÓN 1: FACTURACIÓN por consignación — formato factura completo:
    //    P. unitario (sin IVA) · Subtotal · IVA 15% · Total, con sumas al pie ──
    var fact=(itemsFact||[]).filter(function(it){return (it.vendido||0)>0;});
    barra('FACTURACIÓN — VENDIDO EN '+qLabel.toUpperCase()+' (CONSIGNACIÓN)');
    if(fact.length){
      var IVA_PCT=0.15;
      // Cabecera de la tabla de factura

      doc.text('SKU',xI+6,y+10.5);
      doc.text('PRODUCTO',xI+52,y+10.5);

      doc.text('TOTAL',xD-6,y+10.5,{align:'right'});

      fact.forEach(function(it,i){
        salto(16);
        if(i%2===1){doc.setFillColor(246,243,234);}else{doc.setFillColor(255,255,255);}
        doc.rect(xI,y,ANCHO,13,'F');
        var pu=it.compra||0, sub=(it.vendido||0)*pu, iva=sub*IVA_PCT, tot=sub+iva;
        sumSub+=sub; sumIva+=iva; sumTot+=tot;
        doc.setFont('helvetica','normal'); doc.setTextColor(TXT);
        doc.text(it.sku.replace('SUNSU-',''),xI+6,y+9.5);
        doc.text((it.nombre||'').slice(0,38),xI+52,y+9.5);
        doc.setFont('helvetica','bold'); doc.setTextColor(NAVY);
        doc.text(String(it.vendido),xI+242,y+9.5,{align:'right'});
        doc.setFont('helvetica','normal'); doc.setTextColor(TXT);
        doc.text('$'+pu.toFixed(2),xI+300,y+9.5,{align:'right'});

        doc.setFont('helvetica','bold');
        doc.text('$'+tot.toFixed(2),xD-6,y+9.5,{align:'right'});

      });
      // Sumas al pie: subtotal + IVA + total
      salto(52); y+=6;

      doc.line(xI+300,y,xD,y); y+=4;
      doc.setFontSize(8.5);
      doc.setFont('helvetica','bold'); doc.setTextColor(NAVY);
      doc.text('SUBTOTAL:',xI+365,y+8,{align:'right'});
      doc.setFont('helvetica','normal'); doc.setTextColor(TXT);
      doc.text('$'+sumSub.toFixed(2),xD-6,y+8,{align:'right'}); y+=13;
      doc.setFont('helvetica','bold'); doc.setTextColor(NAVY);
      doc.text('IVA 15%:',xI+365,y+8,{align:'right'});
      doc.setFont('helvetica','normal'); doc.setTextColor(TXT);
      doc.text('$'+sumIva.toFixed(2),xD-6,y+8,{align:'right'}); y+=14;
      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(GOLD);
      doc.text('TOTAL A FACTURAR:',xI+365,y+9,{align:'right'});
      doc.text('$'+sumTot.toFixed(2),xD-6,y+9,{align:'right'});

      doc.text('Valor a pagar por Sunsu Spa según unidades vendidas en la quincena',xI,y+9);
      y+=24;
    } else {
      doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(TXT);
      doc.text('Sin ventas en esta quincena',xI+6,y+13); y+=22;
    }
    // ── SECCIÓN 2: ORDEN DE RESTOCK (el repedido editado en el app) ──
    salto(60);

    // Firmas

          +'<span id="arrow-'+gid+'" onclick="toggleGrupoEntrada(\''+gid+'\')" style="color:white;font-size:0.75rem;cursor:pointer">▶</span>'

               +'<button data-f="'+it.fila+'" data-p="'+it.pedida+'" data-t="parcial" onclick="mostrarParcialBtn(this)" style="flex:1;padding:8px 4px;background:var(--gold);color:white;border:none;border-radius:9px;font-size:0.68rem;font-weight:700;cursor:pointer">⚠️ Parcial</button>'

function cerrarPedidoGrupo(btn){
  var gname=btn.getAttribute('data-gname');
  if(!window._gruposEntrada||!window._gruposEntrada[gname]) return;
  var items=window._gruposEntrada[gname].items;
  var pendientes=items.filter(function(it){
    return it.recibida===''||it.recibida===null||it.recibida===undefined;
  });
  if(pendientes.length>0){
    toast('⚠️ Faltan '+pendientes.length+' producto(s) por marcar','#C4943A');
    return;
  }
  // All marked — remove from view
  delete window._gruposEntrada[gname];
  // Find and hide the card
  var allCards=document.querySelectorAll('[data-gname="'+gname+'"]');
  allCards.forEach(function(el){
    var card=el.closest('[style*="border-radius:14px"]');
    if(card){card.style.transition='opacity 0.3s';card.style.opacity='0';setTimeout(function(){if(card.parentNode)card.parentNode.removeChild(card);},350);}
  });
  toast('✅ Pedido '+gname+' cerrado','var(--green)');
}

function toggleGrupoEntrada(gid){
  var body=document.getElementById(gid);
  var arrow=document.getElementById('arrow-'+gid);
  if(!body) return;
  var open=body.style.display==='none'||body.style.display==='';
  body.style.display=open?'block':'none';
  if(arrow) arrow.textContent=open?'▼':'▶';
}

function _actaEntregaFondo(btn, fondo){
  var gname=btn.getAttribute('data-gname');
  var orden=btn.getAttribute('data-orden')||'—';
  var proveedorReal=btn.getAttribute('data-prov')||gname;
  var src=btn.getAttribute('data-src')||'pend';
  var store=src==='hist'?window._gruposHistOC:window._gruposEntrada;
  if(!store||!store[gname]){toast('Sin datos del grupo','#B86B6B');return;}
  var items=store[gname].items;
  var ahora=new Date();
  var fecha=ahora.toLocaleDateString('es',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'America/Guayaquil'});
  var hora=ahora.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',timeZone:'America/Guayaquil'});
  _gcdCargarJsPDF(function(ok){
    if(!ok){_actaEntregaHTML(btn);return;}
    var doc=new window.jspdf.jsPDF({unit:'pt',format:'a4'}); // A4 vertical
    var W=595, H=842, NAVY='#3D5A7A', TXT='#4A5568', GOLD='#8A6D1A';
    var xI=48, ANCHO=499, xD=xI+ANCHO;
    var bg=fondo?_fondoA4Sunsu(fondo):null;
    var pintar=function(){ if(bg) doc.addImage(bg,'JPEG',0,0,W,H); };
    pintar();
    var y=150;
    doc.setTextColor(NAVY); doc.setFont('helvetica','bold'); doc.setFontSize(19);
    doc.text('ACTA DE ENTREGA',W/2,y,{align:'center'}); y+=17;
    doc.setFontSize(9.5); doc.setFont('helvetica','normal'); doc.setTextColor(TXT);
    doc.text('Recepción de mercadería · Sunsu Spa · Quito',W/2,y,{align:'center'}); y+=26;
    doc.setFontSize(9);
    var fila=function(l,v,dest){
      if(!v) return;
      doc.setFont('helvetica','bold'); doc.setTextColor(NAVY); doc.text(l,xI,y);
      doc.setFont('helvetica',dest?'bold':'normal'); doc.setTextColor(dest?GOLD:TXT);
      doc.text(v.toString(),xI+118,y); y+=14;
    };
    fila('# ORDEN:',orden,true);
    fila('PROVEEDOR:',proveedorReal);
    fila('FECHA DEL ACTA:',fecha+' '+hora);
    fila('GENERADA POR:',CU?CU.name:'—');
    y+=8;
    // Columnas: SKU | Producto | Ped | Rec | Estado | Usuario | Registro (caben en 499pt)
    var cols=[
      {t:'SKU',x:5,w:48},{t:'PRODUCTO',x:56,w:158},{t:'PED.',x:218,w:26,al:'right'},
      {t:'REC.',x:250,w:26,al:'right'},{t:'ESTADO',x:284,w:52},{t:'USUARIO',x:340,w:62},{t:'REGISTRO',x:406,w:90}
    ];
    var salto=function(need){ if(y+need>H-70){doc.addPage();pintar();y=140;cab();} };
    var cab=function(){
      doc.setFillColor(61,90,122);
      doc.roundedRect(xI,y,ANCHO,18,4,4,'F');
      doc.setTextColor('#FFFFFF'); doc.setFont('helvetica','bold'); doc.setFontSize(7.2);
      cols.forEach(function(cc){doc.text(cc.t, xI+cc.x+(cc.al==='right'?cc.w:0), y+12.5, cc.al==='right'?{align:'right'}:undefined);});
      y+=18;
    };
    cab();
    var comp=0,parc=0,noLl=0,pend=0;
    items.forEach(function(it,i){
      salto(15);
      if(i%2===1){doc.setFillColor(246,243,234);}else{doc.setFillColor(255,255,255);}
      doc.rect(xI,y,ANCHO,13,'F');
      var v=(it.recibida!==''&&it.recibida!==null&&it.recibida!==undefined)?String(it.recibida):'—';
      var pv=parseFloat(v);
      var estado=v==='—'?'Pendiente':pv===0?'No llegó':pv>=it.pedida?'Completo':'Parcial';
      if(estado==='Completo')comp++;else if(estado==='Parcial')parc++;else if(estado==='No llegó')noLl++;else pend++;
      var colE=estado==='Pendiente'?'#888888':estado==='No llegó'?'#B84040':estado==='Completo'?'#2E7D52':'#C4943A';
      doc.setFontSize(7.2);
      doc.setFont('helvetica','normal'); doc.setTextColor(TXT);
      doc.text(it.sku.replace('SUNSU-',''),xI+cols[0].x,y+9.5);
      doc.text((it.nombre||'').slice(0,38),xI+cols[1].x,y+9.5);
      doc.text(String(it.pedida),xI+cols[2].x+cols[2].w,y+9.5,{align:'right'});
      doc.setFont('helvetica','bold'); doc.setTextColor(NAVY);
      doc.text(v,xI+cols[3].x+cols[3].w,y+9.5,{align:'right'});
      doc.setTextColor(colE);
      doc.text(estado,xI+cols[4].x,y+9.5);
      doc.setFont('helvetica','normal'); doc.setTextColor(TXT);
      doc.text((it.usuario||'—').split(' ')[0].slice(0,12),xI+cols[5].x,y+9.5);
      doc.text((it.timestamp||'—').toString().slice(0,16),xI+cols[6].x,y+9.5);
      y+=13;
    });
    y+=10;
    salto(30);
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(NAVY);
    doc.text('Resumen: '+comp+' completos · '+parc+' parciales · '+noLl+' no llegaron · '+pend+' pendientes',W/2,y,{align:'center'});
    // Firmas
    salto(70);
    var yF=Math.min(y+45,H-55);
    doc.setDrawColor(90,110,140); doc.setLineWidth(0.8);
    doc.line(xI+20,yF,xI+195,yF); doc.line(xD-195,yF,xD-20,yF);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(TXT);
    doc.text('Recibido por — Sunsu Spa',xI+107,yF+11,{align:'center'});
    doc.text('Entregado por — '+(proveedorReal||'').slice(0,26),xD-107,yF+11,{align:'center'});
    _entregarPDF(doc, 'ACTA '+orden+' '+proveedorReal.split(' ')[0]+'.pdf');
    toast('📄 Acta lista','var(--green)');
  });
}

// ══════ HISTORIAL DE ÓRDENES DE COMPRA (admin) ══════
function renderHistorialOC(){
  var c=document.getElementById('content');
  var isAdmin=CU&&(CU.role==='admin'||CU.role==='admin_master');
  if(!isAdmin){toast('Solo administradores','#B86B6B');return;}
  c.innerHTML='<div style="font-size:0.88rem;font-weight:800;color:var(--navy);margin-bottom:12px">📜 Historial de Órdenes de Compra</div>'
    +'<div class="loading"><div class="spinner"></div>Cargando historial...</div>';
  fetch(APPS_SCRIPT_URL+'?action=getEntradasHistorial')
    .then(function(r){return r.text();})
    .then(function(txt){
      var d; try{d=JSON.parse(txt);}catch(e){d={error:txt.slice(0,100)};}
      if(d.error){c.innerHTML='<div class="card" style="color:var(--red)">❌ '+d.error+'</div>';return;}
      var items=d.items||[];
      var prefixNames={'HT':'HT — ANUA','AS':'AS — Eyenlip','ML':'ML — Dr.esthe','PH':'PH — APHLORA','JN':'JN — Varios','BV':'BV — Bruno Vassari','SU':'SU — SUNSU'};
      var grupos={};
      var provFiltro=window._hocProv||'';
      var provsSet={};
      items.forEach(function(it){ if(it.proveedor) provsSet[it.proveedor]=1; });
      items.forEach(function(it){
        if(provFiltro&&it.proveedor!==provFiltro) return;
        var m=it.sku.match(/SUNSU-([A-Z]+)-/);
        var prefix=m?m[1]:'OTROS';
        var fam=prefixNames[prefix]||('CÓDIGOS '+prefix);
        var key=(it.orden||'SIN-OC')+'||'+fam;
        if(!grupos[key]) grupos[key]={orden:it.orden||'',fam:fam,prov:it.proveedor||fam,creada:it.creada||'',quincena:'',items:[]};
        if(!grupos[key].creada&&it.creada) grupos[key].creada=it.creada;
        if(!grupos[key].quincena&&it.notas){
          var mq=(it.notas||'').match(/Pedido (.+?)( \(app\))?$/);
          if(mq) grupos[key].quincena=mq[1];
        }
        grupos[key].items.push(it);
      });
      var keys=Object.keys(grupos);
      keys.sort(function(a,b){
        var oa=grupos[a].orden||'',ob=grupos[b].orden||'';
        if(!oa&&!ob) return 0; if(!oa) return 1; if(!ob) return -1;
        return ob.localeCompare(oa); // OC más reciente primero
      });
      var html='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'
        +'<div style="font-size:0.88rem;font-weight:800;color:var(--navy)">📜 Historial de Órdenes de Compra</div>'
        +'<button onclick="renderEntradas(document.getElementById(\'content\'))" style="padding:5px 11px;background:white;color:var(--navy);border:1.5px solid var(--navy);border-radius:9px;font-size:0.65rem;font-weight:700;cursor:pointer">← Pendientes</button>'
        +'</div>';
      // Filtro por proveedor
      var provsL=Object.keys(provsSet).sort();
      if(provsL.length>1){
        html+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">'
          +'<button onclick="window._hocProv=\'\';renderHistorialOC()" style="padding:6px 11px;border-radius:99px;font-size:0.64rem;font-weight:700;cursor:pointer;border:1.5px solid var(--navy);'+(!provFiltro?'background:var(--navy);color:white':'background:white;color:var(--navy)')+'">Todos</button>'
          +provsL.map(function(p){return '<button onclick="window._hocProv=\''+p.replace(/'/g,'')+'\';renderHistorialOC()" style="padding:6px 11px;border-radius:99px;font-size:0.64rem;font-weight:700;cursor:pointer;border:1.5px solid var(--navy);'+(provFiltro===p?'background:var(--navy);color:white':'background:white;color:var(--navy)')+'">'+p.split(' ')[0]+'</button>';}).join('')
          +'</div>';
      }
      if(!keys.length){

          +'</div>'
          +'<div style="display:flex;align-items:center;gap:8px">'
          +'<span style="font-size:0.62rem;font-weight:700;color:#FFD580">'+resumen.trim()+'</span>'
          +((CU&&(CU.role==='admin'||CU.role==='admin_master'))&&g.orden?'<button onclick="descargarPDFOrdenApp(\''+g.orden+'\')" title="PDF de la orden (solo admin)" style="padding:4px 9px;background:#C9A227;color:white;border:none;border-radius:8px;font-size:0.62rem;font-weight:700;cursor:pointer">📄 Orden</button>':'')

function editarEntregaHist(fila,pedida){

    +'<button onclick="cancelarEdicionEntrega('+fila+','+pedida+')" style="padding:6px 8px;background:var(--cream);color:var(--gray);border:none;border-radius:8px;font-size:0.68rem;cursor:pointer">✕</button>'

function cancelarEdicionEntrega(fila,pedida){
  var d=document.getElementById('hedit-'+fila); if(!d) return;
  d.innerHTML='<button onclick="editarEntregaHist('+fila+','+pedida+')" style="padding:6px 9px;background:var(--cream);border:none;border-radius:8px;font-size:0.75rem;cursor:pointer">✏️</button>';
}

function guardarEdicionEntrega(fila,pedida){
  var inp=document.getElementById('hi-'+fila);
  if(!inp||inp.value===''){toast('Escribe la cantidad','#B86B6B');return;}
  var cantidad=parseFloat(inp.value);
  if(isNaN(cantidad)||cantidad<0){toast('Cantidad inválida','#B86B6B');return;}
  var usuario=CU?CU.name:'—';
  var d=document.getElementById('hedit-'+fila);
  if(d) d.innerHTML='<div style="font-size:0.65rem;color:var(--gray)">⏳</div>';
  fetch(APPS_SCRIPT_URL+'?action=editarEntrada&fila='+encodeURIComponent(fila)+'&cantidad='+encodeURIComponent(cantidad)+'&usuario='+encodeURIComponent(usuario))
    .then(function(r){return r.text();})
    .then(function(t){
      var res; try{res=JSON.parse(t);}catch(e){res={error:t.slice(0,80)};}
      if(res.ok){
        var eLabel=cantidad===0?'❌ No llegó':cantidad>=pedida?'✅ Completo':'⚠️ Parcial '+cantidad+'/'+pedida;
        var eColor=cantidad===0?'var(--red)':cantidad>=pedida?'var(--green)':'var(--gold)';
        var st=document.getElementById('hst-'+fila);
        if(st) st.innerHTML='<span style="font-size:0.72rem;font-weight:700;color:'+eColor+'">'+eLabel+'</span>'
          +'<div style="font-size:0.55rem;color:var(--gray)">por '+usuario+' · '+(res.ts||'')+'</div>';
        cancelarEdicionEntrega(fila,pedida);
        // Actualizar memoria para regenerar actas sin recargar
        if(window._gruposHistOC){
          Object.keys(window._gruposHistOC).forEach(function(k){
            window._gruposHistOC[k].items.forEach(function(it){
              if(it.fila===fila){it.recibida=cantidad;it.usuario=usuario;it.timestamp=res.ts||'';it.estado=res.estado||'';}
            });
          });
        }
        toast('✏️ Entrega actualizada','var(--green)');
      } else {
        cancelarEdicionEntrega(fila,pedida);
        toast('❌ '+(res.error||'Error'),'#B86B6B');
      }
    })
    .catch(function(){cancelarEdicionEntrega(fila,pedida);toast('❌ Error de conexión','#B86B6B');});
}

    +'<button data-f="'+fila+'" data-p="'+pedida+'" data-t="parcial" onclick="mostrarParcialBtn(this)" style="flex:1;padding:8px 4px;background:var(--gold);color:white;border:none;border-radius:9px;font-size:0.68rem;font-weight:700;cursor:pointer">⚠️ Parcial</button>'
    +'<button data-f="'+fila+'" data-p="'+pedida+'" data-t="nollego" onclick="registrarEntradaBtn(this)" style="flex:1;padding:8px 4px;background:var(--red);color:white;border:none;border-radius:9px;font-size:0.68rem;font-weight:700;cursor:pointer">❌ No llegó</button>'
    +'</div>';

function registrarEntrada(fila,pedida,tipo){
  var cantidad=tipo==='completo'?pedida:tipo==='nollego'?0:(parseFloat((document.getElementById('pi-'+fila)||{}).value)||0);
  if(tipo==='parcial'&&!(document.getElementById('pi-'+fila)||{}).value){toast('Escribe la cantidad','#B86B6B');return;}
  var d=document.getElementById('ebtn-'+fila);
  if(d) d.innerHTML='<div style="font-size:0.7rem;color:var(--gray)">⏳ Guardando...</div>';
  var usuario=CU?CU.name:'—';
  var tsRecep=new Date().toLocaleString('es',{timeZone:'America/Guayaquil',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  fetch(APPS_SCRIPT_URL+'?action=registrarEntrada&fila='+encodeURIComponent(fila)+'&cantidad='+encodeURIComponent(cantidad)+'&usuario='+encodeURIComponent(usuario))
    .then(function(r){return r.text();})
    .then(function(t){
      var res; try{res=JSON.parse(t);}catch(e){res={error:t.slice(0,80)};}
      if(res.ok){
        var el=cantidad===0?'❌ No llegó':cantidad>=pedida?'✅ Completo':'⚠️ Parcial '+cantidad+'/'+pedida;
        var ec=cantidad===0?'var(--red)':cantidad>=pedida?'var(--green)':'var(--gold)';
        if(d) d.innerHTML='<span style="font-size:0.72rem;font-weight:700;color:'+ec+'">'+el+'</span>';
        toast('✅ Registrado','var(--green)');
        // Update in-memory data for PDF (no page reload)
        if(window._gruposEntrada){
          Object.keys(window._gruposEntrada).forEach(function(gname){
            window._gruposEntrada[gname].items.forEach(function(it){
              if(it.fila===fila){
                it.recibida=cantidad;
                it.usuario=usuario;
                it.timestamp=tsRecep;
              }
            });
          });
        }
        // Update pending counter in group header
        _actualizarContadorGrupo(fila);
        // NO automatic page reload — user closes with "Cerrar pedido"
      } else {
        cancelarParcial(fila,pedida);
        toast('❌ '+(res.error||'Error'),'#B86B6B');
      }
    })
    .catch(function(){cancelarParcial(fila,pedida);toast('❌ Error de conexión','#B86B6B');});
}

function _actualizarContadorGrupo(filaActualizada){
  if(!window._gruposEntrada) return;
  Object.keys(window._gruposEntrada).forEach(function(gname){
    var g=window._gruposEntrada[gname];
    var tieneEsta=g.items.some(function(it){return it.fila===filaActualizada;});
    if(!tieneEsta) return;
    var pendientes=g.items.filter(function(it){return it.recibida===''||it.recibida===null||it.recibida===undefined;}).length;
    // Find the header span for this group
    Object.keys(window._gruposEntrada).forEach(function(gn,gi){
      if(gn!==gname) return;
      var gid='grp-'+gi;
      var arrow=document.getElementById('arrow-'+gid);
      if(arrow){
        var span=arrow.parentElement?arrow.parentElement.querySelector('span:first-child'):null;
        if(span){
          span.textContent=pendientes===0?'✅ Listo':pendientes+' pendientes';
          span.style.color=pendientes===0?'#A8E6A3':'#FFD580';
        }
      }
    });
  });
}

function cargarTicketsDia(offset){
  _facDia=offset;

  if(hoyBtn) hoyBtn.style.background=offset===0?'var(--navy)':'var(--gray-l)';
  if(hoyBtn) hoyBtn.style.color=offset===0?'white':'var(--navy)';
  if(ayerBtn) ayerBtn.style.background=offset===1?'var(--navy)':'var(--gray-l)';
  if(ayerBtn) ayerBtn.style.color=offset===1?'white':'var(--navy)';
  var cont=document.getElementById('fac-tickets');
  if(!cont) return;
  cont.innerHTML='<div class="loading"><div class="spinner"></div>Cargando tickets...</div>';
  fetch(APPS_SCRIPT_URL+'?action=getTicketsDia&offset='+offset)
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.error){cont.innerHTML='<div class="card" style="color:var(--red)">❌ '+d.error+'</div>';return;}
      var tickets=d.tickets||[];
      var label=(offset===0?'Hoy':'Ayer')+' '+d.dia+'/'+d.mes+'/'+d.ano;
      if(!tickets.length){
        cont.innerHTML='<div class="card" style="text-align:center;padding:24px;color:var(--gray)">'
          +'<div style="font-size:1.5rem;margin-bottom:8px">✅</div>'
          +'<div style="font-weight:700">Todos los tickets de '+label+' están completos</div>'
          +'</div>';
        return;
      }
      cont.innerHTML='<div style="font-size:0.72rem;color:var(--gray);margin-bottom:10px">'+tickets.length+' ticket(s) pendientes — '+label+'</div>'
        +tickets.map(function(t){return _buildFacCard(t);}).join('');
    })
    .catch(function(){cont.innerHTML='<div class="card" style="color:var(--red)">❌ Error de conexión</div>';});
}

function _buildFacCard(t){
  var hora=t.timestamp?new Date(t.timestamp).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'America/Guayaquil'}):'';
  var facLabel=t.fac?(t.numFac?'✅ FAC '+t.numFac:'✅ Facturado'):'Sin factura';
  var cobLabel=t.cob?('✅ '+(t.comp||'Cobrado')):'Sin cobro';
  var facDone=t.fac&&t.numFac, cobDone=t.cob;
  return '<div id="fac-card-'+t.fila+'" style="background:white;border:1.5px solid var(--cream-d);border-radius:13px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow-sm)">'
    // Header
    +'<div style="background:var(--navy);padding:9px 13px;display:flex;justify-content:space-between;align-items:center">'
    +'<div><div style="font-size:0.78rem;font-weight:800;color:white">'+t.nombre+' '+t.apellido+'</div>'
    +'<div style="font-size:0.62rem;color:rgba(255,255,255,0.7)">'+t.cedula+' · '+hora+(t.facial?' · '+t.facial.replace(/SUNSU-\d+\s*/,''):'')+'</div></div>'
    +'<div style="font-size:0.72rem;font-weight:700;color:var(--gold)">'+(t.estimado>0?'$'+t.estimado.toFixed(2):'')+'</div></div>'
    // Body
    +'<div style="padding:10px 13px">'
    // Factura row
    +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'
    +'<div style="flex:1;font-size:0.75rem;color:'+(facDone?'var(--green)':'var(--gray)')+'">🧾 '+facLabel+'</div>'
    +(!facDone?'<button data-fila="'+t.fila+'" data-est="'+t.estimado+'" data-sinfac="false" onclick="abrirModalUnificadoBtn(this,false)" style="padding:5px 12px;background:var(--blue);color:white;border:none;border-radius:8px;font-size:0.72rem;font-weight:700;cursor:pointer">Facturar</button>':'')
    +(!facDone?'<button data-fila="'+t.fila+'" data-est="'+t.estimado+'" data-sinfac="true" onclick="abrirModalUnificadoBtn(this,false)" style="padding:5px 12px;background:var(--gray-l);color:var(--gray);border:none;border-radius:8px;font-size:0.72rem;font-weight:600;cursor:pointer">Sin factura</button>':'')
    +'</div>'
    // Cobro row
    +'<div style="display:flex;align-items:center;gap:8px">'
    +'<div style="flex:1;font-size:0.75rem;color:'+(cobDone?'var(--green)':'var(--gray)')+'">💳 '+cobLabel+'</div>'
    +(!cobDone&&facDone?'<button data-fila="'+t.fila+'" data-est="'+t.estimado+'" data-sinfac="'+String(t.numFac==='SIN FACTURA')+'" onclick="abrirModalUnificadoBtn(this,true)" style="padding:5px 12px;background:var(--green);color:white;border:none;border-radius:8px;font-size:0.72rem;font-weight:700;cursor:pointer">Cobro</button>':'')
    +'</div></div></div>';
}
