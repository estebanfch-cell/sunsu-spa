// Página 3 del PDF: el mensaje personalizado con botón de agendamiento clickeable
// Texto centrado MANUALMENTE: calcula el ancho y posiciona — inmune a estados del navegador
function _gcdTxtCentrado(x,txt,cy){
  var w=x.measureText(txt).width;
  var prev=x.textAlign; x.textAlign='left';
  x.fillText(txt,(1348-w)/2,cy);
  x.textAlign=prev;
}

function _gcdPaginaMensaje(){
  var W=1348,H=896;
  var cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  var x=cv.getContext('2d');
  var msj=_gcdMensaje();
  var mUrl=msj.match(/https?:\/\/[^\s]+/);
  var urlAg=mUrl?mUrl[0]:'https://app.acuityscheduling.com/schedule.php?owner=35065947';
  var cuerpo=msj.replace(/https?:\/\/[^\s]+/g,'').replace(/[ ]{2,}/g,' ').trim();

  var conFondo=_gcdPag3Img&&_gcdPag3Img.complete&&_gcdPag3Img.naturalWidth>0&&!_gcdPag3Img._fallo;
  var conBase=_gcdBaseImg&&_gcdBaseImg.complete&&_gcdBaseImg.naturalWidth>0&&!_gcdBaseImg._fallo;
  var colTxt;
  if(conFondo){
    x.drawImage(_gcdPag3Img,0,0,W,H);
    colTxt='#5C7494';
  } else {
    x.fillStyle='#90A7CA'; x.fillRect(0,0,W,H);
    if(conBase) x.drawImage(_gcdBaseImg, 0,0,1348,300, 0,0,1348,300);
    colTxt='#FFFFFF';
  }

  // Mensaje envuelto, centrado manualmente línea por línea
  x.fillStyle=colTxt;
  x.font='400 34px Arial';
  var maxW=870, palabras=cuerpo.split(' '), lineas=[], lin='';
  palabras.forEach(function(p){
    var prueba=lin?lin+' '+p:p;
    if(x.measureText(prueba).width>maxW&&lin){lineas.push(lin);lin=p;}
    else lin=prueba;
  });
  if(lin)lineas.push(lin);
  var lh=52, y0=Math.max(365, 455-(lineas.length*lh)/2);
  lineas.forEach(function(l,i){ _gcdTxtCentrado(x, l, y0+i*lh); });

  // Título de opciones
  var tY=y0+lineas.length*lh+52;
  x.fillStyle=colTxt;
  x.font='800 30px Trebuchet MS, Arial';
  _gcdTxtCentrado(x,'Para agendar: haz click en los ⚪️ con cada opción.', tY);

  // 5 iconos clickeables (Instagram y WhatsApp con sus logos reales)
  var igOK=_gcdIconoIG&&_gcdIconoIG.complete&&_gcdIconoIG.naturalWidth>0&&!_gcdIconoIG._fallo;
  var waOK=_gcdIconoWA&&_gcdIconoWA.complete&&_gcdIconoWA.naturalWidth>0&&!_gcdIconoWA._fallo;
  var iconos=[
    {emoji:'📅', img:null,                  label:'Agenda',    url:urlAg},
    {emoji:'💬', img:waOK?_gcdIconoWA:null, label:'WhatsApp',  url:'https://wa.me/593990665112'},
    {emoji:'🌐', img:null,                  label:'Web',       url:'https://www.sunsuspa.com'},
    {emoji:'📸', img:igOK?_gcdIconoIG:null, label:'Instagram', url:'https://www.instagram.com/sunsuspa?igsh=MWg2aHJ2ZDNoeTgzNg=='},
    {emoji:'📍', img:null,                  label:'Ubicación', url:'https://maps.app.goo.gl/ztHyuXZ1NyL3dFBB6'},
  ];
  var r=58, gap=44, total=iconos.length*2*r+(iconos.length-1)*gap;
  var cy=Math.min(tY+120, 700);
  var links=[];
  iconos.forEach(function(ic,i){
    var cx=(W-total)/2+r+i*(2*r+gap);
    x.beginPath(); x.arc(cx,cy,r,0,Math.PI*2); x.fillStyle='#90A7CA'; x.fill();
    x.beginPath(); x.arc(cx,cy,r-4,0,Math.PI*2); x.fillStyle='#FFFFFF'; x.fill();
    if(ic.img){
      var s=62; x.drawImage(ic.img, cx-s/2, cy-s/2, s, s);
    } else {
      x.font='52px Arial';
      var we=x.measureText(ic.emoji).width;
      x.textAlign='left'; x.fillText(ic.emoji, cx-we/2, cy+18);
    }
    x.fillStyle=colTxt; x.font='700 23px Arial';
    var wl=x.measureText(ic.label).width;
    x.textAlign='left'; x.fillText(ic.label, cx-wl/2, cy+r+34);
    links.push({x:cx-r-8, y:cy-r-8, w:2*r+16, h:2*r+56, url:ic.url});
  });

  // Indicación final
  x.fillStyle=colTxt; x.font='400 26px Arial';
  _gcdTxtCentrado(x,'¡¡ TOCA LOS ÍCONOS 👆🏼 !!', Math.min(cy+r+96, 866));

  return {data:cv.toDataURL('image/jpeg',0.92), links:links};
}

// Cargar jsPDF bajo demanda (para armar el PDF de 2 páginas como el original)
function _gcdCargarJsPDF(cb){
  if(window.jspdf&&window.jspdf.jsPDF){cb(true);return;}
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
  s.onload=function(){cb(!!(window.jspdf&&window.jspdf.jsPDF));};
  s.onerror=function(){cb(false);};
  document.head.appendChild(s);
}

// Construye el PDF de 2 páginas (portada + tarjeta personalizada)
function _gcdPDF(cb){
  var cv=document.getElementById('gcd-canvas'); if(!cv){toast('Genera la tarjeta primero','#B86B6B');cb(null);return;}
  var cod=(_gcdVal('gcd-cod')||'SUNSU').replace(/[^A-Za-z0-9-]/g,'');
  _gcdCargarJsPDF(function(ok){
    if(!ok){cb(null);return;}
    fetch(GCD_PORTADA_URL).then(function(r){return r.ok?r.blob():null;}).catch(function(){return null;})
    .then(function(pBlob){
      var tarjetaData=cv.toDataURL('image/jpeg',0.92);
      function armar(portadaData){
        try{
          var pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'px',format:[1348,896]});
          if(portadaData){ pdf.addImage(portadaData,'JPEG',0,0,1348,896); pdf.addPage([1348,896],'landscape'); }
          pdf.addImage(tarjetaData,'JPEG',0,0,1348,896);
          // Página 3: mensaje personalizado + iconos de contacto clickeables
          try{
            var pag3=_gcdPaginaMensaje();
            pdf.addPage([1348,896],'landscape');
            pdf.addImage(pag3.data,'JPEG',0,0,1348,896);
            pag3.links.forEach(function(lk){ pdf.link(lk.x,lk.y,lk.w,lk.h,{url:lk.url}); });
          }catch(eP3){}
          cb(pdf.output('blob'),'Certificado de regalo GIFT CARD SUNSU '+cod+'.pdf');
        }catch(e){cb(null);}
      }
      if(pBlob){
        var rd=new FileReader();
        rd.onload=function(){armar(rd.result);};
        rd.onerror=function(){armar(null);};
        rd.readAsDataURL(pBlob);
      } else armar(null);
    });
  });
}

function _copiarTexto_(txt){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt);return;}
  }catch(e){}
  try{
    var ta=document.createElement('textarea');
    ta.value=txt; ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }catch(e2){}
}

function _esMovil_(){
  // Celular o tablet (incluye iPad en modo escritorio, que se identifica como Mac pero tiene touch)
  return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
    || (navigator.maxTouchPoints>1 && /Mac/.test(navigator.userAgent));
}

// Entrega un PDF de jsPDF SIN link fantasma: en celular abre la hoja de compartir
// nativa con SOLO el archivo (igual que el gift card); en compu, descarga directa.
function _entregarPDF(doc, nombre){
  try{
    var blob=doc.output('blob');
    var file=new File([blob], nombre, {type:'application/pdf'});
    if(_esMovil_()&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file]}).catch(function(){ doc.save(nombre); });
      return;
    }
  }catch(ePd){}
  doc.save(nombre);
}

function compartirGiftCard(){
  _gcdGuardarRegistro();
  // El mensaje ya viaja DENTRO del PDF (página 3) — se envía solo el archivo, sin texto
  _gcdPDF(function(blob,nombre){
    if(blob){
      var file=new File([blob],nombre,{type:'application/pdf'});
      // Celular/tablet: menú de compartir nativo, solo el PDF
      if(_esMovil_()&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
        navigator.share({files:[file]})
          .then(function(){
            if(window._gcdCola&&window._gcdCola.length) toast('✅ Enviada — toca ➡️ Siguiente para la próxima GC','var(--green)');
            else toast('✅ Gift Card enviada — toca ✕ para salir','var(--green)');
          })
          .catch(function(){});
        return;
      }
      // Computadora: solo descargar el PDF (se arrastra a WhatsApp o donde se necesite)
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download=nombre; a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
      toast('📄 PDF descargado — arrástralo a WhatsApp','var(--green)');
    } else {
      _gcdArchivo(function(b,n){
        var f=new File([b],n,{type:'image/png'});
        if(_esMovil_()&&navigator.share&&navigator.canShare&&navigator.canShare({files:[f]})){
          navigator.share({files:[f]}).catch(function(){});
        } else {
          var a=document.createElement('a');
          a.href=URL.createObjectURL(b); a.download=n; a.click();
          toast('🖼️ Imagen descargada — arrástrala a WhatsApp','var(--green)');
        }
      });
    }
  });
}

        +'&notas='+encodeURIComponent(GC.nota||'')

// Fondo SUNSU en formato tarjeta apaisada (logo arriba, florales en las esquinas)
function _fondoCardSunsu(fondo){
  if(window._fondoCardCache) return window._fondoCardCache;
  var CW=1120, CH=660;
  var cv=document.createElement('canvas'); cv.width=CW; cv.height=CH;
  var ctx=cv.getContext('2d');
  ctx.fillStyle='rgb(253,250,241)'; ctx.fillRect(0,0,CW,CH);
  try{
    var lw=250, lh=lw*(145/390);
    ctx.drawImage(fondo, 480,50,390,145, (CW-lw)/2, 34, lw, lh);
    var fiW=185, fiH=fiW*(566/300);
    ctx.drawImage(fondo, 0,330,300,566, 0, CH-fiH, fiW, fiH);
    var fdW=140, fdH=fdW*(556/218);
    ctx.drawImage(fondo, 1130,340,218,556, CW-fdW, CH-fdH, fdW, fdH);
  }catch(eC){}
  window._fondoCardCache=cv.toDataURL('image/jpeg',0.85);
  return window._fondoCardCache;
}
// ── Tarjeta digital del paquete: PDF pequeño para enviar a la clienta ──
function tarjetaPaquete(i){
  var x=(window._segPaqItems||[])[i];

  toast('⏳ Generando tarjeta...','var(--blue)');
  var img=new Image();
  img.crossOrigin='anonymous';
  img.onload=function(){_pdfTarjetaPaquete(x, img);};
  img.onerror=function(){_pdfTarjetaPaquete(x, null);};
  img.src=GCD_PAG3_URL;
}
function _pdfTarjetaPaquete(x, fondo, cbTP){
  _gcdCargarJsPDF(function(ok){
    if(!ok){toast('❌ No se pudo cargar el generador de PDF','#B86B6B');return;}
    var W=560, H=330;
    var doc=new window.jspdf.jsPDF({unit:'pt',format:[W,H],orientation:'landscape'});
    var NAVY='#3D5A7A', TXT='#4A5568', GOLD='#8A6D1A', VERDE='#2E7D52';
    if(fondo) doc.addImage(_fondoCardSunsu(fondo),'JPEG',0,0,W,H);
    var p=x.p;
    var nomCli=((p.nombre||'')+' '+(p.apellido||'')).trim();
    var limpiaFac=function(s){return (s||'').toString().replace(/SUNSU-\d+\s*[-—:·]*\s*/gi,'').trim();};
    var y=96;
    doc.setTextColor(NAVY); doc.setFont('helvetica','bold'); doc.setFontSize(13);
    doc.text('CONTROL DE TU PAQUETE',W/2,y,{align:'center'}); y+=15;
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(TXT);
    doc.text(nomCli,W/2,y,{align:'center'}); y+=12;
    var nomPaqL=limpiaFac(p.nombrePaq||'');
    doc.setFontSize(8); doc.setTextColor(NAVY); doc.setFont('helvetica','bold');
    doc.text((p.sku+' - Paquete '+x.total+(nomPaqL?' - '+nomPaqL:'')),W/2,y,{align:'center'}); y+=11;
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(GOLD);
    doc.text('Gracias por confiar el cuidado de tu piel en Sunsu Spa',W/2,y,{align:'center'});
    // ── Rejilla de sesiones CENTRADA verticalmente ──
    var cols=3, filas=Math.ceil(x.total/cols);
    var gx=40, gw=W-80, cw=gw/cols;
    var ch=(filas===1?92:86);
    var topZona=y+8, botZona=H-52;               // espacio disponible entre encabezado y pie
    var gy=topZona+((botZona-topZona)-filas*ch)/2+6;
    for(var s=0;s<x.total;s++){
      var cx=gx+(s%cols)*cw+cw/2;
      var cy=gy+Math.floor(s/cols)*ch;
      var uso=(p.usos||[])[s]||{};
      var usada=s<x.usados;
      if(usada){ doc.setFillColor(61,90,122); doc.circle(cx,cy+12,11,'F'); doc.setTextColor('#FFFFFF'); }
      else { doc.setDrawColor(61,90,122); doc.setLineWidth(1.2); doc.circle(cx,cy+12,11,'D'); doc.setTextColor(NAVY); }
      doc.setFont('helvetica','bold'); doc.setFontSize(10);
      doc.text(String(s+1),cx,cy+15.5,{align:'center'});
      if(usada){
        // Fila 1: fecha · Fila 2: facial · Fila 3: cosmetóloga
        doc.setTextColor(NAVY); doc.setFont('helvetica','bold'); doc.setFontSize(7.2);
        // SOLO la fecha (la nota puede traer texto extra pegado)
        var mFec=(uso.f||'').toString().match(/\d{1,2}\/\d{1,2}\/\d{2,4}/);
        doc.text(mFec?mFec[0]:'',cx,cy+33,{align:'center'});
        var facTxt=limpiaFac(uso.fac||'');
        if(facTxt.length>28) facTxt=facTxt.slice(0,26)+'..';
        doc.setFont('helvetica','normal'); doc.setTextColor(TXT); doc.setFontSize(6.8);
        if(facTxt) doc.text(facTxt,cx,cy+43,{align:'center'});
        if(uso.por) doc.text(uso.por,cx,cy+52,{align:'center'});
      } else {
        doc.setTextColor('#9AA1B0'); doc.setFont('helvetica','normal'); doc.setFontSize(6.8);
        doc.text('Disponible',cx,cy+33,{align:'center'});
      }
    }
    doc.setFont('helvetica','bold'); doc.setFontSize(9);
    doc.setTextColor(x.pend>0?NAVY:VERDE);
    doc.text(x.pend>0?('Has disfrutado '+x.usados+' de '+x.total+' sesiones - te '+(x.pend===1?'espera 1 sesion':'esperan '+x.pend+' sesiones')+' mas!'):'Paquete completado - gracias por acompanarnos!',W/2,H-38,{align:'center'});
    doc.setFont('helvetica','normal'); doc.setFontSize(6.4); doc.setTextColor(TXT);
    doc.text('Sunsu Spa - Glass Skin - Quito',W/2,H-26,{align:'center'});
    var nomArchTP='Paquete '+(p.nombre||'').split(' ')[0]+' '+p.sku+'.pdf';
    if(cbTP){ cbTP(doc, nomArchTP); return; }
    _entregarPDF(doc, nomArchTP);
    toast('📄 Tarjeta lista — compártela por WhatsApp','var(--green)');
  });
}
function renderSegPaquetes(c){
  c.innerHTML='<div style="font-size:0.88rem;font-weight:800;color:var(--navy);margin-bottom:12px">📞 Seguimiento de Clientas</div>'
    +_segToggleHTML()
    +'<div class="loading"><div class="spinner"></div>Cargando paquetes...</div>';
  fetch(APPS_SCRIPT_URL+'?action=getSeguimientoPaquetes&_t='+Date.now())
  .then(function(r){return r.json();})
  .then(function(d){
    if(window._segSecc!=='paquetes') return; // el usuario ya cambió de sección
    if(d.error){c.innerHTML='<div class="card" style="color:#B86B6B">❌ '+d.error+'</div>';return;}
    var P3=window._P3S||[], P6=window._P6S||[];
    var hoy=new Date(); hoy.setHours(0,0,0,0);
    var parseF=function(s){ // 'dd/MM/yy'
      var m=(s||'').toString().match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
      if(!m) return null;
      var a=parseInt(m[3]); if(a<100)a+=2000;
      return new Date(a, parseInt(m[2])-1, parseInt(m[1]));
    };
    var items=(d.items||[]).map(function(p){
      // El total (3 o 6) lo determina el SERVIDOR por el código del paquete;
      // respaldo local por listas si viniera vacío
      var esP3=P3.some(function(s){return p.sku.indexOf(s)>=0;});
      var total=p.total||(esP3?3:6);
      var usados=0, ultima=null;
      p.usos.slice(0,total).forEach(function(u){
        if(u.u||u.f) usados++;
        var f=parseF(u.f);
        if(f&&(!ultima||f>ultima)) ultima=f;
      });
      if(!ultima){
        var aC=parseInt(p.ano)||0; if(aC>0&&aC<100)aC+=2000; // filas históricas con año de 2 dígitos
        ultima=new Date(aC,parseInt(p.mes)-1,parseInt(p.dia));
      }
      var diasSin=Math.floor((hoy-ultima)/86400000);
      if(isNaN(diasSin)||diasSin<0||diasSin>3700) diasSin=null; // fecha ilegible → no mostrar días
      return {p:p,total:total,usados:Math.min(usados,total),pend:Math.max(0,total-usados),ultima:ultima,diasSin:diasSin};
    });
    window._segPaqItems=items; // para los botones de tarjeta/WhatsApp
    var pendientes=items.filter(function(x){return x.pend>0;}).sort(function(a,b){return (b.diasSin===null?-1:b.diasSin)-(a.diasSin===null?-1:a.diasSin);});

      +'<button onclick="window._segPaqFiltro=\'pendientes\';renderSegPaquetes(document.getElementById(\'content\'))" style="padding:7px 12px;border-radius:9px;font-size:0.66rem;font-weight:700;cursor:pointer;border:1.5px solid '+(window._segPaqFiltro!=='completos'?'var(--navy);background:var(--navy);color:white':'var(--cream-d);background:white;color:var(--gray)')+'">⏳ Pendientes ('+pendientes.length+')</button>'
      +'<button onclick="window._segPaqFiltro=\'completos\';renderSegPaquetes(document.getElementById(\'content\'))" style="padding:7px 12px;border-radius:9px;font-size:0.66rem;font-weight:700;cursor:pointer;border:1.5px solid '+(window._segPaqFiltro==='completos'?'var(--navy);background:var(--navy);color:white':'var(--cream-d);background:white;color:var(--gray)')+'">✓ Completos ('+completos.length+')</button>'
      +'</div>';
    if(!mostrar.length) html+='<div class="card" style="text-align:center;color:var(--gray);padding:20px">Sin paquetes en esta lista</div>';
    mostrar.forEach(function(x){
      var p=x.p;
      var alerta=x.pend>0&&x.diasSin!==null&&x.diasSin>30;
      var puntos='';
      for(var i=0;i<x.total;i++){
        var usado=i<x.usados;
        puntos+='<span style="display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:4px;'+(usado?'background:var(--navy)':'background:white;border:1.5px solid var(--navy)')+'"></span>';
      }
      html+='<div class="card" style="padding:12px;margin-bottom:9px;'+(alerta?'border:1.5px solid #E8543F':'')+'">'
        +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">'
        +'<div style="flex:1;min-width:0">'
        +'<div style="font-size:0.76rem;font-weight:800;color:var(--navy)">'+(p.nombre+' '+p.apellido).trim()+'</div>'
        +'<div style="font-size:0.58rem;color:var(--gray)">'+p.cedula+' · 📦 '+p.sku+' ('+x.total+' sesiones) · comprado '+(p.dia+'/'+p.mes+'/'+p.ano)+'</div>'
        +'</div>'
        +(alerta?'<span style="background:#E8543F;color:white;padding:3px 8px;border-radius:7px;font-size:0.58rem;font-weight:800;white-space:nowrap">⏰ +'+x.diasSin+' días sin venir</span>':'')
        +'</div>'
        +'<div style="display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap">'
        +'<span>'+puntos+'</span>'
        +'<span style="font-size:0.68rem;font-weight:800;color:'+(x.pend>0?'var(--navy)':'#2E7D52')+'">'+(x.pend>0?('Consumido '+x.usados+' de '+x.total+' — queda'+(x.pend!==1?'n':'')+' '+x.pend):'✓ Paquete completo')+'</span>'
        +'<span style="font-size:0.62rem;color:var(--gray)">'+(x.diasSin!==null?('Última visita: '+fStr(x.ultima)+(x.pend>0?' ('+x.diasSin+' días)':'')):'Última visita: —')+'</span>'
        +'</div>'
        +(function(){
          var iGlobal=items.indexOf(x);
          var telP=(x.p.telefono||'').replace(/[^0-9]/g,'');
          if(telP&&telP.length===10&&telP.charAt(0)==='0') telP='593'+telP.slice(1);
          var msgP=encodeURIComponent('Hola '+(x.p.nombre||'').split(' ')[0]+'! Te compartimos la tarjeta digital de tu paquete en Sunsu Spa. '+(x.pend>0?('Ya disfrutaste '+x.usados+' de '+x.total+' sesiones — te esperamos para la siguiente. Escríbenos para agendar tu cita.'):'Completaste tus '+x.total+' sesiones — gracias por confiar en nosotras.'));
          return '<div style="display:flex;gap:6px;margin-top:9px">'

            +'</div>';
        })()

function pintarSeguimiento(){
  var cont=document.getElementById('seg-grupos'); if(!cont) return;
  var q=((document.getElementById('seg-q')||{}).value||'').trim().toLowerCase();
  var items=(window._segItems||[]).filter(function(it){
    if(!q) return true;
    return ((it.nombre||'')+' '+(it.apellido||'')).toLowerCase().indexOf(q)>=0||(it.cedula||'').indexOf(q)>=0;
  });
  var GRUPOS=[
    {est:'🔴 Atrasada',       titulo:'🔴 Atrasadas',                 color:'#B86B6B', hint:'ya pasó su fecha de retorno — escribirles YA'},
    {est:'🟡 Próxima',        titulo:'🟡 Próximas (7 días)',         color:'#C9A227', hint:'su retorno es esta semana — ideal para agendar'},
    {est:'🟢 A tiempo',       titulo:'🟢 A tiempo',                  color:'#6B9080', hint:'aún no toca contactarlas'},
    {est:'⛔ No ha regresado', titulo:'⛔ No han regresado (6+ meses)',color:'#8A8A8A', hint:'para campañas de recuperación'},
  ];
  function diasDesde(fecha){
    if(!fecha||!window._segHoy) return null;
    var a=fecha.split('-'), b=window._segHoy.split('-');
    if(a.length<3) return null;
    var d1=new Date(a[0],a[1]-1,a[2]), d2=new Date(b[0],b[1]-1,b[2]);
    return Math.round((d2-d1)/(1000*60*60*24));
  }
  var html='';
  GRUPOS.forEach(function(g,gi){
    var lista=items.filter(function(it){return it.estado===g.est;});
    lista.sort(function(a,b){return (a.retorno||'').localeCompare(b.retorno||'');});
    var gid='seg-g'+gi;

function marcarAgendada(tkRow, cedula, nombre, apellido){
  fetch(APPS_SCRIPT_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({accion:'marcarAgendada', tkRow:tkRow, cedula:cedula, usuario:CU?CU.name:'—'})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.ok){
      window._segItems=(window._segItems||[]).filter(function(x){return x.tkRow!==tkRow;});
      pintarSeguimiento(); // re-pinta con contadores actualizados, mantiene la búsqueda
      toast('✅ Clienta marcada como agendada','var(--green)');
    } else {
      toast('❌ '+(d.error||'Error'),'#B86B6B');
    }
  })
  .catch(function(){toast('❌ Error de conexión','#B86B6B');});
}

function resultadoSeguimiento(tkRow, cedula, nombre, apellido, tipo){
  if(tipo==='nd'){
    if(!confirm('🔕 ¿Marcar que '+(nombre||'la clienta')+' NO desea agendar?\n\nSaldrá de la lista definitivamente y no se le volverá a contactar en este ciclo.')) return;
  }
  fetch(APPS_SCRIPT_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({accion:'resultadoSeguimiento', tkRow:tkRow, cedula:cedula, nombre:nombre, apellido:apellido, tipo:tipo, usuario:CU?CU.name:'—'})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.ok){
      window._segItems=(window._segItems||[]).filter(function(x){return x.tkRow!==tkRow;});
      pintarSeguimiento();
      if(d.estado==='nd') toast('🔕 No se volverá a contactar','var(--gray)');
      else if(d.estado==='sr') toast('📵 3 intentos sin respuesta — archivada','#B86B6B');
      else toast('📵 Intento '+d.intentos+' de 3 — reaparecerá en 7 días','var(--gold)');
    } else {
      toast('❌ '+(d.error||'Error'),'#B86B6B');
    }
  })
  .catch(function(){toast('❌ Error de conexión','#B86B6B');});
}

// ══════ HISTORIAL ══════
var _histData=null;

function _histPrecioFacial(txt){
  if(!txt) return {n:'',p:0};
  var f=FACIALES.find(function(x){return txt.indexOf(x.sku)>=0;});
  return f?{n:f.n,p:f.p,sku:f.sku}:{n:txt,p:0,sku:''};
}
function _histPrecioPaq(txt){
  if(!txt) return null;
  var p=PAQ3.find(function(x){return txt.indexOf(x.sku)>=0;})||PAQ6.find(function(x){return txt.indexOf(x.sku)>=0;});
  return p?{n:p.n,p:p.p,sku:p.sku}:null;
}
function _histPrecioExtra(sku){
  var e=EXTRAS.find(function(x){return x.sku===sku;});
  return e?e.t:0;
}
function _histPrecioProducto(skuQty){
  var parts=skuQty.split(' ×');
  var sku=parts[0].trim(), qty=parseInt(parts[1])||1;
  var prod=null;
  PROVS.forEach(function(pv){pv.prods.forEach(function(p){if(p.sku===sku)prod=p;});});
  return prod?{sku:sku,n:prod.n,p:prod.p,qty:qty,total:prod.p*qty}:null;
}

// Build one ticket card — showPrices=false for staff
function _buildTicketCard(t, showPrices){
  if(t&&t.tkRow){(window._tkCards=window._tkCards||{})[t.tkRow]=t;}
  var cosCol=t.cosmetologa==='Andrea Robles'?'#7A8FAF':t.cosmetologa==='Daniela Mora'?'#9B8EC4':t.cosmetologa==='Dejaneira Espinoza'?'#6A9E7A':t.cosmetologa==='Alejandra Rodriguez'?'#C4956A':'#1A237E';
  var esCanjeP=t.colQ&&t.colQ.indexOf('SI')===0;
  var esCanjeGC=t.colR&&t.colR.indexOf('SI')===0;
  var esCanje=esCanjeP||esCanjeGC;
  var facialInfo=t.facial?_histPrecioFacial(t.facial):null;
  var facialP=facialInfo&&!esCanje?facialInfo.p:0;
  var packInfo=t.pack3?_histPrecioPaq(t.pack3):t.pack6?_histPrecioPaq(t.pack6):null;
  var prodsDetalle=[],prodTotal=0;
  if(t.productos&&t.productos.length){t.productos.forEach(function(pq){var pi=_histPrecioProducto(pq);if(pi){prodsDetalle.push(pi);prodTotal+=pi.total;}});}
  var gcVenta=null;
  if(t.colS&&t.colS.indexOf('SI')===0){var gp=t.colS.split(',');gcVenta={codigo:(gp[1]||'').trim(),nota:(gp[2]||'').trim(),valor:65};}
  var totalCliente=parseFloat(t.estimado)||0;

  var rs='display:flex;justify-content:space-between;font-size:0.74rem;padding:3px 0;';
  var rg='display:flex;justify-content:space-between;font-size:0.68rem;padding:1px 0 1px 10px;opacity:0.75;';
  // When no prices, use simpler row with no right column
  var rowItem=function(icon,label,priceStr){
    if(showPrices){
      return '<div style="'+rs+'"><span>'+icon+' '+label+'</span><span style="font-weight:700">'+priceStr+'</span></div>';
    } else {
      return '<div style="font-size:0.74rem;padding:3px 0"><span>'+icon+' '+label+'</span></div>';
    }
  };
  var rowSub=function(icon,label,priceStr){
    if(showPrices){
      return '<div style="'+rg+'"><span>'+icon+' '+label+'</span><span>'+priceStr+'</span></div>';
    } else {
      return '<div style="font-size:0.68rem;padding:1px 0 1px 10px;opacity:0.75"><span>'+icon+' '+label+'</span></div>';
    }
  };
  var skuBadge=function(sku,color){
    if(!sku) return '';
    return '<span style="font-size:0.58rem;font-family:monospace;background:'+(color||'var(--blue-l)')+';color:'+(color?'white':'var(--blue)')+';padding:1px 5px;border-radius:4px;margin-right:5px;flex-shrink:0">'+sku+'</span>';
  };
  var breakdown='';

  // 1. Facial + extras
  if(facialInfo){
    var facSku=t.facial?t.facial.match(/(SUNSU-\d+)/):null;
    var facSkuStr=facSku?skuBadge(facSku[1]):'';
    breakdown+=rowItem(facSkuStr+'💆',facialInfo.n+(esCanje?' <span style="font-size:0.62rem;color:#888">(canje)</span>':''),'$'+facialP.toFixed(2));
  }
  if(t.extras){
    t.extras.split('|').forEach(function(ex){
      ex=ex.trim(); if(!ex) return;
      var cortMatch=ex.match(/\[CORTESIA(?::\s*([^\]]+))?\]/);
      var cort=!!cortMatch;
      var cortReason=cortMatch&&cortMatch[1]?cortMatch[1]:'';
      var esku=ex.match(/(SUNSU-\d+)/);
      if(esku){
        var ep=_histPrecioExtra(esku[1]);
        var eo=EXTRAS.find(function(x){return x.sku===esku[1];});
        breakdown+=rowSub(skuBadge(esku[1])+'✨',(eo?eo.n:ex)+(cort?' 🎀'+(cortReason?' ('+cortReason+')':''):''),cort?'Cortesía':'$'+ep.toFixed(2));
      }
    });
  }

  // 2. Paquete
  if(packInfo){
    var pakSku=t.pack3?t.pack3.match(/(SUNSU-\d+)/):t.pack6?t.pack6.match(/(SUNSU-\d+)/):null;
    var pakSkuStr=pakSku?skuBadge(pakSku[1]):'';
    breakdown+=rowItem(pakSkuStr+'📋',packInfo.n,'$'+packInfo.p.toFixed(2));
  }

  // 3. Productos — total first, then individual
  if(prodsDetalle.length){
    breakdown+=rowItem('🧴','Total productos','$'+prodTotal.toFixed(2));
    prodsDetalle.forEach(function(pd){
      breakdown+=rowSub(skuBadge(pd.sku,'#8A90A0')+'',pd.n+(pd.qty>1?' ×'+pd.qty:''),'$'+pd.total.toFixed(2));
    });
  }

  // 4. Gift Card
  if(gcVenta){
    breakdown+=rowItem('🎁','Gift Card'+(gcVenta.codigo?' · '+gcVenta.codigo:''),'$'+gcVenta.valor.toFixed(2));
    if(gcVenta.nota) breakdown+=rowSub('📝',gcVenta.nota,'');
  }
  if(t.colQ&&t.colQ.indexOf('SI')===0){
    breakdown+='<div style="'+rg+';color:#7A5FA0"><span>📋 Canje paquete: '+t.colQ+'</span><span></span></div>';
  }
  if(t.colR){

    +'<div style="font-size:0.68rem;font-weight:700;color:'+cosCol+';text-transform:uppercase;margin-bottom:2px">'+t.cosmetologa+'</div>'

    +'<div style="font-size:0.65rem;color:var(--gray)">'+t.cedula+' · '+fechaFmt+' '+t.hora+(t.tkRow?' · <span style="font-family:monospace;font-weight:700;color:var(--navy)">#'+t.tkRow+'</span>':'')+'</div>'
    +(isAdminView&&t.tkRow
      ?'<div style="display:flex;gap:5px;margin-top:6px">'
        +'<button onclick="editarTicket('+t.tkRow+')" style="padding:4px 10px;background:var(--blue-l);color:var(--navy);border:1.5px solid var(--blue);border-radius:8px;font-size:0.65rem;font-weight:700;cursor:pointer">✏️ Editar</button>'
        +'<button onclick="abrirModalMulta('+t.tkRow+')" style="padding:4px 10px;background:var(--red-l);color:var(--red);border:1.5px solid var(--red);border-radius:8px;font-size:0.65rem;font-weight:700;cursor:pointer">⚠️ Multa</button>'
        +'<button onclick="eliminarTicket('+t.tkRow+')" style="padding:4px 10px;background:white;color:var(--red);border:1.5px solid var(--red);border-radius:8px;font-size:0.65rem;font-weight:700;cursor:pointer">🗑️ Eliminar</button>'
        +'</div>'
      :'')
    +'</div>'
    +'<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">'
    +(showPrices
      ?'<div style="text-align:right"><div style="font-size:1.1rem;font-weight:900;color:var(--green)">$'+totalCliente.toFixed(2)+'</div><div style="font-size:0.62rem;color:var(--gray)">Total cobrado</div></div>'
      :'')
    +(t.tkRow?'<button onclick="tarjetaTicket('+t.tkRow+')" style="padding:5px 11px;background:var(--navy);color:white;border:none;border-radius:8px;font-size:0.63rem;font-weight:800;cursor:pointer;white-space:nowrap">📄 Tarjeta</button>':'')
    +'</div>'
    +'</div>';
  if(breakdown) card+='<div style="border-top:1px solid #f0f0f4;padding-top:8px">'+breakdown+'</div>';
  // Recomendaciones y notas
  var notasBlock='';
  if(t.recomendaciones) notasBlock+='<div style="font-size:0.7rem;color:var(--gray);margin-top:6px;padding-top:6px;border-top:1px solid #f0f0f4"><span style="font-weight:700;color:var(--navy)">📝 Recom:</span> '+t.recomendaciones+'</div>';
  if(t.notas) notasBlock+='<div style="font-size:0.7rem;color:var(--gray);margin-top:3px"><span style="font-weight:700;color:var(--navy)">🗒 Notas:</span> '+t.notas+'</div>';
  if(t.comprobante) notasBlock+='<div style="font-size:0.7rem;margin-top:5px"><a href="'+t.comprobante+'" target="_blank" style="color:var(--blue);font-weight:700;text-decoration:none">📎 Ver comprobante de transferencia</a></div>';
  var _fotosFila=function(fotosStr, etiqueta){
    if(!fotosStr) return '';
    return '<div style="margin-top:6px">'
      +(etiqueta?'<div style="font-size:0.58rem;font-weight:800;color:var(--gray);margin-bottom:3px">'+etiqueta+'</div>':'')
      +'<div style="display:flex;gap:6px;flex-wrap:wrap">'+fotosStr.split(' | ').map(function(u,i){
        var m=u.match(/\/d\/([^\/]+)/);
        var th=m?('https://drive.google.com/thumbnail?id='+m[1]+'&sz=w400'):'';
        return '<a href="'+u.trim()+'" target="_blank" style="text-decoration:none">'

  if(t.fotosDespues) notasBlock+=_fotosFila(t.fotosDespues,'✨ DESPUÉS');
  if(t.fotos)        notasBlock+=_fotosFila(t.fotos,'');
  card+=notasBlock;
  // Dropdown exclusión comisión — solo admins
  if(isAdminView&&t.tkRow){
    var exclFac=t.exclFacial||false, exclPaq=t.exclPaquete||false, exclProd=t.exclProducto||false, exclExt=t.exclExtras||false;
    card+='<div style="margin-top:8px;border-top:1px solid var(--gray-ll);padding-top:8px">'
      +'<div style="font-size:0.62rem;font-weight:700;color:var(--gray);text-transform:uppercase;margin-bottom:5px">⚙️ Excluir de comisión</div>'
      +'<div style="display:flex;gap:6px;flex-wrap:wrap">'
      +'<button onclick="toggleExclusion('+t.tkRow+',\'facial\')" style="padding:4px 10px;border-radius:7px;border:1.5px solid '+(exclFac?'var(--red)':'var(--gray-l)')+';background:'+(exclFac?'var(--red-l)':'white')+';color:'+(exclFac?'var(--red)':'var(--gray)')+';font-size:0.65rem;font-weight:700;cursor:pointer" id="excl-fac-'+t.tkRow+'">'+(exclFac?'✓ ':'')+'💆 Facial</button>'
      +'<button onclick="toggleExclusion('+t.tkRow+',\'paquete\')" style="padding:4px 10px;border-radius:7px;border:1.5px solid '+(exclPaq?'var(--red)':'var(--gray-l)')+';background:'+(exclPaq?'var(--red-l)':'white')+';color:'+(exclPaq?'var(--red)':'var(--gray)')+';font-size:0.65rem;font-weight:700;cursor:pointer" id="excl-paq-'+t.tkRow+'">'+(exclPaq?'✓ ':'')+'📋 Paquete</button>'
      +'<button onclick="toggleExclusion('+t.tkRow+',\'producto\')" style="padding:4px 10px;border-radius:7px;border:1.5px solid '+(exclProd?'var(--red)':'var(--gray-l)')+';background:'+(exclProd?'var(--red-l)':'white')+';color:'+(exclProd?'var(--red)':'var(--gray)')+';font-size:0.65rem;font-weight:700;cursor:pointer" id="excl-prod-'+t.tkRow+'">'+(exclProd?'✓ ':'')+'🧴 Producto</button>'
      +'<button onclick="toggleExclusion('+t.tkRow+',\'extras\')" style="padding:4px 10px;border-radius:7px;border:1.5px solid '+(exclExt?'var(--red)':'var(--gray-l)')+';background:'+(exclExt?'var(--red-l)':'white')+';color:'+(exclExt?'var(--red)':'var(--gray)')+';font-size:0.65rem;font-weight:700;cursor:pointer" id="excl-ext-'+t.tkRow+'">'+(exclExt?'✓ ':'')+'✨ Extras</button>'
      +'</div></div>';
  }
  card+='</div>';
  return card;
}

// ══════ HISTORIAL ══════
function renderHistorial(c){
  var isAdmin=CU&&(CU.role==='admin'||CU.role==='admin_master');
  c.innerHTML='<div class="loading"><div class="spinner"></div>Cargando historial...</div>';
  var hoy=new Date();
  var pad=function(n){return String(n).padStart(2,'0');};
  var fechaHoy=hoy.getFullYear()+'-'+pad(hoy.getMonth()+1)+'-'+pad(hoy.getDate());
  fetch(APPS_SCRIPT_URL+'?action=getHistorial')
    .then(function(r){return r.json();})
    .then(function(data){
      if(data.error){c.innerHTML='<div class="card" style="color:var(--red)">Error: '+data.error+'</div>';return;}
      _histData=data;
      window._histCosmFiltro='';
      if(isAdmin) mostrarHistorialAdmin(c,fechaHoy,fechaHoy,'');
      else mostrarHistorialStaff(c,fechaHoy,fechaHoy);
    })
    .catch(function(err){
      c.innerHTML='<div class="card" style="text-align:center;color:var(--red)">⚠️ Error<br><small>'+err.message+'</small><br><br>'
        +'<button onclick="renderHistorial(document.getElementById(\'content\'))" style="padding:8px 18px;background:var(--navy);color:white;border:none;border-radius:9px;font-size:0.8rem;cursor:pointer">🔄 Reintentar</button></div>';
    });
}

function renderBuscar(c){
  if(!_histData){
    c.innerHTML='<div class="loading"><div class="spinner"></div>Cargando datos...</div>';
    fetch(APPS_SCRIPT_URL+'?action=getHistorial')
      .then(function(r){return r.json();})
      .then(function(data){
        if(data.error){c.innerHTML='<div class="card" style="color:var(--red)">Error: '+data.error+'</div>';return;}
        _histData=data;
        mostrarBuscarCliente(c);
      })
      .catch(function(err){
        c.innerHTML='<div class="card" style="text-align:center;color:var(--red)">⚠️ Error<br><small>'+err.message+'</small></div>';
      });
  } else {
    mostrarBuscarCliente(c);
  }
}

// ── STAFF: sus propios tickets, rango de fechas, SIN precios ──
// ── Búsqueda de clienta integrada en el Historial (reemplaza la pestaña Buscar) ──
function _histBuscarGo(esStaff){
  var el=document.getElementById('hist-buscar');
  var q=(el?el.value:'').trim();
  window._histBusqueda=q; // vacío = volver a la vista normal
  // Actualizar SOLO los resultados: el input no se recrea → el teclado del iPhone
  // mantiene su modo (números/letras) y el cursor no se pierde
  if(_histActualizarRes(esStaff)) return;
  // Respaldo (vista aún no montada): render completo
  var c=document.getElementById('content');
  var hoy=new Date(),pad=function(n){return String(n).padStart(2,'0');};
  var fh=hoy.getFullYear()+'-'+pad(hoy.getMonth()+1)+'-'+pad(hoy.getDate());
  if(esStaff) mostrarHistorialStaff(c,fh,fh); else mostrarHistorialAdmin(c,fh,fh,window._histCosmFiltro);
}
// Búsqueda EN VIVO: re-filtra sola 350ms después de dejar de teclear (mín. 2 caracteres)
function _histBuscarLive(esStaff){
  clearTimeout(window._histBuscarTimer);
  window._histBuscarTimer=setTimeout(function(){
    var el=document.getElementById('hist-buscar');
    var q=(el?el.value:'').trim();
    if(q.length===1) return; // 1 letra traería demasiado — espera la segunda
    if(q===(window._histBusqueda||'')) return; // sin cambios
    _histBuscarGo(esStaff);
  },350);
}
function _histBuscarClear(esStaff){
  window._histBusqueda='';
  var elC=document.getElementById('hist-buscar');
  if(elC) elC.value='';
  if(_histActualizarRes(esStaff)) return;
  var c=document.getElementById('content');
  var hoy=new Date(),pad=function(n){return String(n).padStart(2,'0');};
  var fh=hoy.getFullYear()+'-'+pad(hoy.getMonth()+1)+'-'+pad(hoy.getDate());
  if(esStaff) mostrarHistorialStaff(c,fh,fh); else mostrarHistorialAdmin(c,fh,fh,window._histCosmFiltro);
}
// Filtra tickets según búsqueda (todo el historial) o fecha/cosmetóloga
function _histFiltrarAdmin(busq, fechaDesde, fechaHasta, cosmFiltro){
  return _histData.filter(function(t){
    if(busq) return _histMatchBusq(t, busq);
    if(!t.fecha||t.fecha<fechaDesde||t.fecha>fechaHasta) return false;
    if(cosmFiltro && t.cosmetologa !== cosmFiltro) return false;
    return true;
  });
}
function _histFiltrarStaff(busq, fechaDesde, fechaHasta){
  return _histData.filter(function(t){
    if(busq) return _histMatchBusq(t, busq);
    if(!t.fecha||t.fecha<fechaDesde||t.fecha>fechaHasta) return false;
    return t.cosmetologa&&t.cosmetologa.toLowerCase().indexOf(CU.name.toLowerCase().split(' ')[0].toLowerCase())>=0;
  });
}
// HTML de SOLO los resultados (resumen + tarjetas) — se actualiza sin tocar el buscador,
// así el teclado del iPhone no se reinicia mientras escribes
function _histResAdminHTML(tickets, cosmFiltro, fechaDesde, fechaHasta, busq){
  var totalIngresos=tickets.reduce(function(s,t){return s+(parseFloat(t.estimado)||0);},0);
  var totFac=0, totPaq=0, totProd=0;
  tickets.forEach(function(t){
    if(t.facial) totFac++;
    if(t.pack3||t.pack6) totPaq++;
    if(t.productos&&t.productos.length) totProd+=t.productos.length;
  });
  var avgTicket=tickets.length?totalIngresos/tickets.length:0;
  var html=(busq?'<div style="font-size:0.62rem;color:#C9A227;font-weight:700;margin-bottom:10px">🔍 Mostrando TODO el historial de "'+busq+'" (las fechas y filtros no aplican)</div>':'');
  html+='<div style="background:white;border-radius:14px;box-shadow:var(--shadow-sm);padding:14px;margin-bottom:12px">'
    +'<div style="font-size:0.65rem;font-weight:700;color:var(--gray);text-transform:uppercase;margin-bottom:9px;letter-spacing:0.5px">'
    +'Resumen'+(busq?' · 🔍 "'+busq+'" (todo el historial)':((cosmFiltro?' · '+cosmFiltro:'')+' · '+fechaDesde+(fechaDesde!==fechaHasta?' → '+fechaHasta:'')))+(tickets.length?' · '+tickets.length+' ticket'+(tickets.length!==1?'s':''):'')
    +'</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:7px;margin-bottom:8px">'
    +'<div style="background:var(--blue-l);border-radius:9px;padding:9px;text-align:center"><div style="font-size:1.3rem;font-weight:800;color:var(--navy)">'+totFac+'</div><div style="font-size:0.6rem;color:var(--gray);text-transform:uppercase">Faciales</div></div>'
    +'<div style="background:var(--lavender-l,#F3F0FA);border-radius:9px;padding:9px;text-align:center"><div style="font-size:1.3rem;font-weight:800;color:var(--lavender,#9B8EC4)">'+totPaq+'</div><div style="font-size:0.6rem;color:var(--gray);text-transform:uppercase">Paquetes</div></div>'
    +'<div style="background:var(--peach-l);border-radius:9px;padding:9px;text-align:center"><div style="font-size:1.3rem;font-weight:800;color:var(--peach)">'+totProd+'</div><div style="font-size:0.6rem;color:var(--gray);text-transform:uppercase">Productos</div></div>'
    +'<div style="background:var(--gold-l);border-radius:9px;padding:9px;text-align:center"><div style="font-size:1.1rem;font-weight:800;color:var(--gold)">$'+totalIngresos.toFixed(2)+'</div><div style="font-size:0.6rem;color:var(--gray);text-transform:uppercase">Total</div></div>'
    +'</div>'
    +(tickets.length?'<div style="font-size:0.68rem;color:var(--gray);text-align:right">Promedio por ticket: <strong>$'+avgTicket.toFixed(2)+'</strong></div>':'')
    +'</div>';
  if(tickets.length===0){
    html+='<div class="card" style="text-align:center;color:var(--gray);font-size:0.82rem;padding:24px">Sin tickets'+(busq?' de "'+busq+'"':(cosmFiltro?' de '+cosmFiltro:''))+'</div>';
  } else {
    html+='<button onclick="descargarPDFHistorial()" style="width:100%;padding:10px;background:var(--pink);color:white;border:none;border-radius:11px;font-size:0.82rem;font-weight:700;cursor:pointer;margin-bottom:10px">⬇️ Descargar PDF</button>';
    tickets.forEach(function(t){ html+=_buildTicketCard(t, true); });
  }
  return html;
}
function _histResStaffHTML(tickets, busq){
  var html=(busq?'<div style="font-size:0.62rem;color:#C9A227;font-weight:700;margin-bottom:10px">🔍 Mostrando TODO el historial de "'+busq+'"</div>':'');
  html+='<div style="background:var(--blue-l);border-radius:12px;padding:12px;margin-bottom:12px;display:flex;gap:10px;align-items:center">'

    html+='<div class="card" style="text-align:center;color:var(--gray);font-size:0.82rem;padding:24px">Sin tickets'+(busq?' de "'+busq+'"':' en este rango')+'</div>';

// Actualiza SOLO el contenedor de resultados (el buscador y el teclado quedan intactos)
function _histActualizarRes(esStaff){
  var res=document.getElementById('hist-res'); if(!res) return false;
  var busq=(window._histBusqueda||'').trim().toLowerCase();
  var f=window._histFiltroActual||{};
  var hoy=new Date(),pad=function(n){return String(n).padStart(2,'0');};
  var fh=hoy.getFullYear()+'-'+pad(hoy.getMonth()+1)+'-'+pad(hoy.getDate());
  var fd=f.desde||fh, fha=f.hasta||fh;
  if(esStaff) res.innerHTML=_histResStaffHTML(_histFiltrarStaff(busq,fd,fha), busq);
  else res.innerHTML=_histResAdminHTML(_histFiltrarAdmin(busq,fd,fha,window._histCosmFiltro||''), window._histCosmFiltro||'', fd, fha, busq);
  return true;
}
function _histMatchBusq(t, busq){
  var full=((t.nombre||'')+' '+(t.apellido||'')).toLowerCase();
  var fullInv=((t.apellido||'')+' '+(t.nombre||'')).toLowerCase();
  return (t.cedula||'').indexOf(busq)>=0 || full.indexOf(busq)>=0 || fullInv.indexOf(busq)>=0;
}
function _histBuscarUI(esStaff, busq){
  return '<div style="font-size:0.7rem;font-weight:700;color:var(--gray);text-transform:uppercase;margin-bottom:6px">🔍 Buscar clienta</div>'
    +'<div style="display:flex;gap:6px;margin-bottom:12px">'
    +'<input type="text" id="hist-buscar" value="'+(window._histBusqueda||'').replace(/"/g,'&quot;')+'" placeholder="Cédula o nombre..." autocomplete="off" oninput="_histBuscarLive('+esStaff+')" onkeydown="if(event.key===\'Enter\')_histBuscarGo('+esStaff+')" style="flex:1;padding:8px 10px;border:1.5px solid #ECEEF4;border-radius:9px;font-size:0.78rem;outline:none;font-family:inherit">'
    +'<button onclick="_histBuscarGo('+esStaff+')" style="padding:8px 14px;background:var(--navy);color:white;border:none;border-radius:9px;font-size:0.78rem;font-weight:700;cursor:pointer">🔍</button>'
    +'<button onclick="_histBuscarClear('+esStaff+')" title="Limpiar búsqueda" style="padding:8px 11px;background:white;color:#B86B6B;border:1.5px solid #B86B6B;border-radius:9px;font-size:0.78rem;font-weight:700;cursor:pointer">✕</button>'

}

function mostrarHistorialStaff(c, fechaDesde, fechaHasta){

  var hoy=new Date();
  var pad=function(n){return String(n).padStart(2,'0');};

    +'<div style="display:flex;gap:6px;margin-bottom:8px">'

function _highlightFiltroBtn(prefix, tipo){
  ['hoy','ayer','semana','mes'].forEach(function(t){
    var btn=document.getElementById(prefix+t);
    if(!btn) return;
    if(t===tipo){btn.style.background='var(--navy)';btn.style.color='white';btn.style.borderColor='var(--navy)';}
    else{btn.style.background='white';btn.style.color='var(--navy)';btn.style.borderColor='#ECEEF4';}
  });

function aplicarFiltroStaff(tipo){
  var hoy=new Date();
  var pad=function(n){return String(n).padStart(2,'0');};
  var desde,hasta;
  hasta=hoy.getFullYear()+'-'+pad(hoy.getMonth()+1)+'-'+pad(hoy.getDate());
  if(tipo==='hoy'){desde=hasta;}
  else if(tipo==='ayer'){var ay=new Date(hoy);ay.setDate(ay.getDate()-1);desde=hasta=ay.getFullYear()+'-'+pad(ay.getMonth()+1)+'-'+pad(ay.getDate());}
  else if(tipo==='semana'){var s=new Date(hoy);s.setDate(s.getDate()-6);desde=s.getFullYear()+'-'+pad(s.getMonth()+1)+'-'+pad(s.getDate());}
  else if(tipo==='mes'){desde=hoy.getFullYear()+'-'+pad(hoy.getMonth()+1)+'-01';}
  mostrarHistorialStaff(document.getElementById('content'),desde,hasta);
  setTimeout(function(){ _highlightFiltroBtn('sf-',tipo); },50);
}

function aplicarFiltroFechaStaff(){

    if(packInfo) cardsHTML+='<div class="row"><span class="lbl">📋 '+packInfo.n+'</span><span>$'+packInfo.p.toFixed(2)+'</span></div>';
    if(prodsDetalle.length){cardsHTML+='<div class="row"><span class="lbl">🧴 Productos</span><span>$'+prodTotal.toFixed(2)+'</span></div>';prodsDetalle.forEach(function(pd){cardsHTML+='<div class="row sub"><span class="lbl">'+pd.n+(pd.qty>1?' ×'+pd.qty:'')+'</span><span>$'+pd.total.toFixed(2)+'</span></div>';});}
    if(gcVenta) cardsHTML+='<div class="row"><span class="lbl">🎁 GC '+gcVenta.codigo+'</span><span>$'+gcVenta.valor.toFixed(2)+'</span></div>';

    if(t.notas) cardsHTML+='<div class="nota"><b>🗒 Notas:</b> '+t.notas+'</div>';

    +'body{font-family:Arial,sans-serif;font-size:11px;color:#222;margin:20px;max-width:800px}'

    +'.th{display:flex;justify-content:space-between;margin-bottom:6px}'

    +'.cli{font-size:12px;font-weight:800;color:#1A237E}.sub{font-size:9px;color:#888}.tot{font-size:14px;font-weight:900;color:#2E7D32;text-align:right}'
    +'.row{display:flex;justify-content:space-between;padding:2px 0;border-top:1px solid #f5f5f5;font-size:10px}'

    +'@media print{.noprint{display:none}}'
    +'</style></head><body>'
    +'<h1>🌸 SUNSU SPA — Historial '+rangoLabel+'</h1>'
    +'<p style="color:#888;font-size:9px;margin:0 0 8px">Generado '+new Date().toLocaleString()+'</p>'
    +'<div class="summary">'
    +'<div class="sbox"><div class="snum" style="color:#1A237E">'+tickets.length+'</div><div class="slbl">Tickets</div></div>'
    +'<div class="sbox"><div class="snum" style="color:#2E7D32">$'+total.toFixed(2)+'</div><div class="slbl">Total cobrado</div></div>'
    +'<div class="sbox"><div class="snum" style="color:#C2185B">$'+(tickets.length?total/tickets.length:0).toFixed(2)+'</div><div class="slbl">Promedio</div></div>'
    +'</div>'
    +cardsHTML
    +'<br><button class="noprint" onclick="window.print()" style="padding:9px 22px;background:#C2185B;color:white;border:none;border-radius:7px;cursor:pointer;font-size:12px;font-weight:700">🖨️ Imprimir / Guardar PDF</button>'
    +'</body></html>');
  win.document.close();
}

function _histPrecioFacial(txt){
  if(!txt) return {n:'',p:0};
  var canje=false;
  // Check colQ — if there's a colQ it means it was paid with paquete
  var f=FACIALES.find(function(x){return txt.indexOf(x.sku)>=0;});
  return f?{n:f.n,p:f.p,sku:f.sku}:{n:txt,p:0,sku:''};
}
function _histPrecioPaq(txt){
  if(!txt) return null;
  var p=PAQ3.find(function(x){return txt.indexOf(x.sku)>=0;})||PAQ6.find(function(x){return txt.indexOf(x.sku)>=0;});
  return p?{n:p.n,p:p.p,sku:p.sku}:null;
}
function _histPrecioExtra(sku){
  var e=EXTRAS.find(function(x){return x.sku===sku;});
  return e?e.t:0;
}

    .then(function(r){return r.text();})

function _kpiBarras(canvasId, labels, values, color, fmt){
  var cv=document.getElementById(canvasId); if(!cv) return;
  var W=cv.width=cv.offsetWidth*2, H=cv.height=340;
  var x=cv.getContext('2d');
  x.clearRect(0,0,W,H);
  var max=Math.max.apply(null,values.concat([1]));
  var n=values.length, gap=Math.max(6,W*0.02), bw=(W-gap*(n+1))/n;
  var top=44, bot=42;
  values.forEach(function(v,i){
    var h=(H-top-bot)*(v/max);
    var bx=gap+i*(bw+gap), by=H-bot-h;
    x.fillStyle=color; 
    x.beginPath();
    var r=Math.min(8,bw/2);
    x.moveTo(bx,by+r); x.arcTo(bx,by,bx+r,by,r); x.arcTo(bx+bw,by,bx+bw,by+r,r);
    x.lineTo(bx+bw,H-bot); x.lineTo(bx,H-bot); x.closePath(); x.fill();
    x.fillStyle='#1A2744'; x.textAlign='center'; x.font='700 '+(n>8?17:20)+'px Arial';
    x.fillText(fmt?fmt(v):v, bx+bw/2, by-10);
    x.fillStyle='#8A93A6'; x.font='600 '+(n>8?15:18)+'px Arial';
    x.fillText(labels[i], bx+bw/2, H-14);
  });
}

  var pad=function(n){return String(n).padStart(2,'0');};
  var a,b;
  if(idx===0){a=new Date(hoy.getFullYear(),hoy.getMonth(),1);b=hoy;}
  else {a=new Date(hoy.getFullYear(),hoy.getMonth()-1,1);b=new Date(hoy.getFullYear(),hoy.getMonth(),0);}
  document.getElementById('kpi-desde').value=a.getFullYear()+'-'+pad(a.getMonth()+1)+'-'+pad(a.getDate());
  document.getElementById('kpi-hasta').value=b.getFullYear()+'-'+pad(b.getMonth()+1)+'-'+pad(b.getDate());
  cargarKpis();
}
function cargarKpis(){
  var out=document.getElementById('kpi-out'); if(!out) return;
  out.innerHTML='<div class="loading"><div class="spinner"></div>Calculando...</div>';
  var desde=(document.getElementById('kpi-desde')||{}).value||'';
  var hasta=(document.getElementById('kpi-hasta')||{}).value||'';
  fetch(APPS_SCRIPT_URL+'?action=getKPIsMes&desde='+desde+'&hasta='+hasta+'&_t='+Date.now())
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.error){out.innerHTML='<div class="card" style="color:var(--red)">❌ '+d.error+'</div>';return;}

function _cliMsgTicket(texto, tipo){ // tipo: 'ok' | 'nueva'

// Lookup unificado nombre+apellido del formulario del ticket (debounce 250ms)
function _lookupNombreTicket(){
  clearTimeout(window._regTimerN);
  window._regTimerN=setTimeout(function(){
    var nomEl=document.getElementById('inp-nom'), apeEl=document.getElementById('inp-ape');
    var nom=(nomEl?nomEl.value:'').trim(), ape=(apeEl?apeEl.value:'').trim();
    if(nom.length>=2&&ape.length>=2) buscarEnRegistroSheet('q', nom+' '+ape);
  },250);
}
async function buscarEnRegistroSheet(tipo, valor, avisarNueva) {
  if (!valor || valor.length < 3) return;
  try {
    var url = APPS_SCRIPT_URL + '?action=getRegistro&' + tipo + '=' + encodeURIComponent(valor) + '&_t=' + Date.now();
    var r = await fetch(url);
    var text = await r.text();
    var res;
    try { res = JSON.parse(text); } catch(pe) { console.error('Parse error:', text.slice(0,200)); return; }
    if (!res.ok || !res.data || !res.data.length) {
      if (avisarNueva) { T._clienteNuevo=true; _cliMsgTicket('Cliente nueva — ingresa la cédula','nueva'); }
      return;
    }
    if (tipo === 'ced') {
      var cliente = res.data[0];
      // Cédula completa → llenar nombre/apellido si están vacíos
      var nom = document.getElementById('inp-nom');
      var ape = document.getElementById('inp-ape');
      if (nom && !nom.value.trim()) { nom.value = cliente.nombre; T.nombre = cliente.nombre; }
      if (ape && !ape.value.trim()) { ape.value = cliente.apellido; T.apellido = cliente.apellido; }
      T._clienteNuevo=false;
      _cliMsgTicket('Cliente: '+cliente.nombre+' '+cliente.apellido,'ok');
    } else {
      // Búsqueda por nombre → elegir el MEJOR match:
      // 1º coincidencia exacta nombre+apellido (o invertido), 2º único resultado
      var q = valor.toLowerCase().trim();
      var exacto = res.data.find(function(d){
        var f=((d.nombre||'')+' '+(d.apellido||'')).toLowerCase().trim();
        var fi=((d.apellido||'')+' '+(d.nombre||'')).toLowerCase().trim();
        return f===q||fi===q;
      });
      var cliente = exacto || (res.data.length===1 ? res.data[0] : null);
      if (cliente && cliente.cedula) {
        var ced = document.getElementById('inp-ced');
        var cedActual = ced ? ced.value.trim() : '';
        // Solo escribir si el campo está vacío o si el valor actual lo puso el autofill
        if (!cedActual || window._cedAutofill) {
          T.cedula = cliente.cedula;
          window._cedAutofill = true;
          _setCampoTicket('inp-ced', cliente.cedula);
        }
        T._clienteNuevo=false;
        _cliMsgTicket('Cliente: '+cliente.nombre+' '+cliente.apellido+' · '+cliente.cedula,'ok');
      } else if (avisarNueva) {
        T._clienteNuevo=true;
        _cliMsgTicket('Cliente nueva — ingresa la cédula','nueva');
      }
    }
  } catch(e) { /* silencioso */ }
}

function mostrarCitas(c, rawData, isAdmin, fecha, hasAcuity, hasError) {
  let citas = [];
  try {
    citas = rawData
      .filter(function(apt){ return !apt.canceled; })
      .sort(function(a,b){ return new Date(a.datetime) - new Date(b.datetime); })
      .map(function(apt) {
        const dt = new Date(apt.datetime);
        const hora = dt.toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit',hour12:true});
        const esPrimera = (apt.type||'').includes('PRIMERA');
        let tipoPiel = '', tratamientos = '';
        if(apt.forms && apt.forms[0] && apt.forms[0].values) {
          apt.forms[0].values.forEach(function(v) {
            if(v.name && v.name.includes('Piel')) tipoPiel = v.value||'';
            if(v.name && v.name.includes('Reciente')) tratamientos = v.value||'';

        return {
          id: String(apt.id),

            '</div>' +
          '</div>'

          '<div style="background:var(--gold-l);border-radius:9px;padding:9px 11px;margin-bottom:10px;font-size:0.74rem;color:var(--gold);font-weight:600">' +
            '🆕 ' + (ci.esPrimera ? 'Primera vez — incluye Skin Analysis' : 'Clienta nueva') +
          '</div>'
        ) +
        (ci.notas ? '<div style="font-size:0.72rem;color:var(--navy);background:var(--lavender-l);border:1px solid #C8C0E0;border-radius:8px;padding:7px 10px;margin-bottom:10px">📌 ' + ci.notas + '</div>' : '') +
        (ci.tipoPiel ? '<div style="font-size:0.7rem;color:var(--gray);margin-bottom:8px">🧴 Tipo piel: <strong>' + ci.tipoPiel + '</strong></div>' : '') +
        (!ci.completada ?
          '<button onclick="generarTicketDesdeCita(this)" data-cita-id="' + ci.id + '" style="width:100%;padding:10px;background:var(--navy);color:white;border:none;border-radius:10px;font-size:0.82rem;font-weight:700;cursor:pointer">🎫 Generar Ticket para ' + ci.clienteNombre.split(' ')[0] + '</button>'
        :
          '<div style="text-align:center;font-size:0.76rem;color:var(--gray);padding:4px">✓ Ticket ya generado</div>'
        ) +
      '</div>';
    });
  }

  // Append to existing content or replace
  const existing = c.querySelector('[style*="display:flex"]');
  if(existing && hasError) {
    c.innerHTML += html;
  } else {
    c.innerHTML = html;
  }
}


function generarTicketDesdeCita(btn){
  const id = btn.getAttribute('data-cita-id');
  const ci = (window._citasHoy||[]).find(function(c){return c.id===id;}) || DEMO_CITAS[0];

  // Extraer nombre y apellido desde ci.clienteNombre (ignorar cedula de Acuity)
  const parts = ci.clienteNombre.trim().split(' ');
  const _nom = parts[0] || '';
  const _ape = parts.slice(1).join(' ') || '';
  const _nombreCompleto = (_nom + ' ' + _ape).trim();

  // Pre-fill ticket state (sin cedula - la busca el REGISTRO)
  T = newT();
  T.nombre   = _nom;
  T.apellido = _ape;

  // Switch to ticket tab
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  const ticketTab = document.querySelector('.tab');
  if(ticketTab) ticketTab.classList.add('active');
  const _cont = document.getElementById('content');
  renderTicket(_cont);

  // Llenar campos y buscar cédula
  setTimeout(function(){
    var nomEl = document.getElementById('inp-nom');
    var apeEl = document.getElementById('inp-ape');
    if(nomEl) nomEl.value = _nom;
    if(apeEl) apeEl.value = _ape;
    toast('Ticket para ' + ci.clienteNombre, '#6A9E7A');

    // Buscar cédula - y cuando retorne, mantener un watcher que llene el campo
    if(_nom && _ape) {
      var _buscarNomCompleto = _nom + ' ' + _ape;
      fetch(APPS_SCRIPT_URL + '?action=getRegistro&q=' + encodeURIComponent(_buscarNomCompleto) + '&_t=' + Date.now())
        .then(function(r){ return r.text(); })
        .then(function(txt){
          var res;
          try { res = JSON.parse(txt); } catch(e){ return; }
          if(!res.ok || !res.data || !res.data.length) return;
          if(res.data.length !== 1) return;
          var cedula = res.data[0].cedula;
          if(!cedula) return;
          T.cedula = cedula;
          // Intentar llenar el campo cada 100ms hasta lograrlo
          var _tries = 0;
          var _watch = setInterval(function(){
            _tries++;
            var cedEl = document.getElementById('inp-ced');
            if(cedEl) { cedEl.value = cedula; clearInterval(_watch); }
            else if(_tries > 30) { clearInterval(_watch); }
          }, 100);
        })
        .catch(function(){});
    }
  }, 100);
}

      var headerLine=lines.length>1?parseCsvLine(lines[1]):[];
      var iSku=-1,iNom=-1,iTot=-1,iSub=-1,iCom=-1;

          var mFam=sku.toUpperCase().match(/(?:^|-)([A-Z]{2,3})-(\d{3})$/);

      if(nP6.length){PAQ6.length=0;nP6.forEach(function(x){PAQ6.push(x);});}
      // Refrescar TODOS los grupos de proveedor desde el CSV (HT, AS, ML, PH, JN, BV, SU, ...)
      PROVS.forEach(function(pv){
        var arr=nFams[pv.id.toUpperCase()]||[];
        if(arr.length){pv.prods.length=0;arr.forEach(function(x){pv.prods.push(x);});}
      });
      // Familias del catálogo que aún no tienen grupo en el ticket → crearlo al vuelo
      Object.keys(nFams).forEach(function(fam){
        var existe=PROVS.some(function(pv){return pv.id.toUpperCase()===fam;});

      if(activeTab&&activeTab.textContent.indexOf('Ticket')>=0){
        var c=document.getElementById('content');
        if(c) renderTicket(c);
      }
    })
    .catch(function(e){toast('Catálogo error: '+e.message,'#B86B6B');});
}

function verCitas(c,o,forzar){
  var dias=[['Ayer',-1],['Hoy',0],['Mañana',1]];
  var hoy=new Date();
  var dia=new Date(hoy.getFullYear(),hoy.getMonth(),hoy.getDate()+o);

  });

    +'<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 14px 10px">'
    +'<div style="font-size:0.7rem;color:var(--gray);text-transform:capitalize">'+dl+'</div>'
    +'<button onclick="verCitas(document.getElementById(\'content\'),'+o+',true)" style="background:var(--blue-l);color:var(--blue);border:1.5px solid var(--blue);padding:4px 10px;border-radius:8px;font-size:0.68rem;font-weight:700;cursor:pointer">🔄 Actualizar</button>'
    +'</div>';
  c.innerHTML=nav+'<div id="cb" style="padding:0 14px 14px"><div style="text-align:center;padding:30px;color:var(--gray)"><div style="font-size:1.5rem;margin-bottom:8px">⏳</div>Cargando citas...</div></div>';

  var body=function(){return document.getElementById('cb');};

  if(forzar) _histData=null; // refrescar también los tickets al actualizar (para el cruce cita↔ticket)
  // Usar cache si existe y no expiró y no es forzado
  var cached=window._citasCache[diaNom];
  if(!forzar && cached && (Date.now()-cached.ts) < CITAS_TTL){
    var bd=body(); if(bd) _renderCitasList(bd, cached.data, diaNom);
    return;
  }

  fetch(APPS_SCRIPT_URL+'?action=getCitas&dia='+diaNom)
    .then(function(r){return r.json();})
    .then(function(data){
      if(!body()) return;
      if(data.error){
        body().innerHTML='<div style="background:var(--gold-l);border-radius:12px;padding:20px;text-align:center">'
          +'<div style="font-size:1.5rem;margin-bottom:8px">📅</div>'

          +'<div style="font-size:0.72rem;color:var(--gray)">'+data.error+'</div></div>';
        return;
      }
      // Guardar en cache
      window._citasCache[diaNom]={data:data, ts:Date.now()};
      _renderCitasList(body(), data, diaNom);
    })
    .catch(function(err){
      if(body()) body().innerHTML=
        '<div style="background:var(--red-l);border-radius:12px;padding:20px;text-align:center">'
        +'<div style="font-size:0.84rem;font-weight:700;color:var(--red);margin-bottom:6px">Error cargando citas</div>'

// ── Cruce cita ↔ tickets: una cita cuenta como completada si ese día existe un
//    ticket de la misma clienta (haya salido del botón 🎫 o creado a mano) ──
function _normNomCita(s){
  return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zñ\s]/g,' ').replace(/\s+/g,' ').trim();
}
function _citaTieneTicket(apt, fechaStr){
  if(!window._histData) return false;
  var pn=_normNomCita(apt.firstName).split(' ')[0]; // primer nombre
  var pa=_normNomCita(apt.lastName).split(' ')[0];  // primer apellido
  if(pn.length<2) return false;
  for(var i=0;i<_histData.length;i++){
    var t=_histData[i];
    if(t.fecha!==fechaStr) continue;
    var full=_normNomCita((t.nombre||'')+' '+(t.apellido||''));
    if(full.indexOf(pn)>=0 && (!pa || pa.length<2 || full.indexOf(pa)>=0)) return true;
  }
  return false;
}
function _renderCitasList(bd, data, diaNom){
  var o=diaNom==='ayer'?-1:diaNom==='manana'?1:0;
  // Si el historial de tickets aún no está cargado, traerlo y re-pintar (una sola vez)
  if(!window._histData && !window._histFetchCitas){
    window._histFetchCitas=true;
    fetch(APPS_SCRIPT_URL+'?action=getHistorial')
      .then(function(r){return r.json();})
      .then(function(d){
        window._histFetchCitas=false;
        if(Array.isArray(d)){
          _histData=d;
          var bd2=document.getElementById('cb');
          if(bd2) _renderCitasList(bd2, data, diaNom);
        }
      })
      .catch(function(){window._histFetchCitas=false;});
  }
  var hoyC=new Date();
  var diaC=new Date(hoyC.getFullYear(),hoyC.getMonth(),hoyC.getDate()+o);
  var padC=function(n){return String(n).padStart(2,'0');};
  var fechaStrC=diaC.getFullYear()+'-'+padC(diaC.getMonth()+1)+'-'+padC(diaC.getDate());
      if(!Array.isArray(data)){
        bd.innerHTML='<div style="padding:20px;color:var(--gray);text-align:center">Sin citas disponibles</div>';
        return;
      }
      var isAdmin=CU.role==='admin'||CU.role==='admin_master'||CU.role==='reception';
      var citas=data
        .filter(function(a){return !a.canceled;})
        .sort(function(a,b){return new Date(a.datetime)-new Date(b.datetime);});
      if(!isAdmin) citas=citas.filter(function(ci){
        return (ci.calendar||'').toLowerCase().indexOf(CU.short.toLowerCase().split(' ')[0])>=0;
      });
      if(!citas.length){
        bd.innerHTML='<div style="padding:32px;text-align:center;color:var(--gray)"><div style="font-size:2rem;margin-bottom:8px">🗓</div>No hay citas</div>';
        return;
      }
      var h='<div style="font-size:0.72rem;color:var(--gray);margin-bottom:10px;font-weight:600">'+citas.length+' cita'+(citas.length!==1?'s':'')+(isAdmin?'':' para ti')+'</div>';
      citas.forEach(function(apt){
        var dt=new Date(apt.datetime);
        var hora=dt.toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit',hour12:true});
        var nombre=((apt.firstName||'')+' '+(apt.lastName||'')).trim();
        var nueva=(apt.type||'').toUpperCase().indexOf('PRIMERA')>=0;
        var okLabel=apt.labels&&apt.labels.some(function(l){return l.name==='COMPLETADO';});

// ══════ ELIMINAR TICKET (admin) — borra la fila completa en TICKET_FICHA ══════
function eliminarTicket(tkRow){
  if(!(CU&&(CU.role==='admin'||CU.role==='admin_master'))){toast('Solo administradores','#B86B6B');return;}
  var t=_histData?_histData.find(function(x){return x.tkRow===tkRow;}):null;
  var nombreT=t?((t.nombre||'')+' '+(t.apellido||'')).trim():'';
  if(!confirm('🗑️ ¿Eliminar el ticket #'+tkRow+(nombreT?' de '+nombreT:'')+'?\n\nSe borra TODA la fila en el sheet: facial, productos, extras y comisiones de ese ticket.\nEsta acción no se puede deshacer desde el app.')) return;
  toast('⏳ Eliminando...','var(--navy)');
  fetch(APPS_SCRIPT_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({accion:'eliminarTicket', tkRow:tkRow, nombre:t?(t.nombre||''):'', apellido:t?(t.apellido||''):'', usuario:CU?CU.name:'—'})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.ok){
      toast('🗑️ Ticket eliminado','var(--green)');
      // Las filas de abajo se corren una posición: recargar datos y refrescar la vista
      _histData=null;
      var c=document.getElementById('content');
      if(document.getElementById('buscar-res')){
        window._buscarPrefill=((document.getElementById('buscar-q')||{}).value||'');
        renderBuscar(c);
      } else {
        renderHistorial(c);
      }
    } else {
      toast('❌ '+(d.error||'Error'),'#B86B6B');
    }
  })
  .catch(function(){toast('❌ Error de conexión','#B86B6B');});
}

function guardarEdicionTicket(tkRow){
  var btn=document.getElementById('et-btn');
  var msg=document.getElementById('et-msg');
  var get=function(id){var el=document.getElementById(id);return el?el.value:'';};

  // Build extras string (col W) same format as enviarTicket
  var extrasArr=[];
  EXTRAS.forEach(function(ex){
    var ck=document.getElementById('ex-'+ex.sku);
    if(ck&&ck.checked){
      var cort=document.getElementById('ec-'+ex.sku);
      var str=ex.sku+' '+ex.n;
      if(cort&&cort.checked) str+=' [CORTESIA]';
      extrasArr.push(str);
    }
  });
  var extrasStr=extrasArr.join(' | ');

  // Build productos object same as enviarTicket
  var PROD_COL_MAP=window._prodColMap||{
    'SUNSU-HT-002':25,'SUNSU-HT-003':26,'SUNSU-HT-004':27,'SUNSU-HT-006':28,'SUNSU-HT-007':29,
    'SUNSU-HT-011':30,'SUNSU-HT-012':31,'SUNSU-HT-013':32,'SUNSU-HT-014':33,
    'SUNSU-AS-001':34,'SUNSU-AS-002':35,'SUNSU-AS-003':36,'SUNSU-AS-004':37,
    'SUNSU-AS-005':38,'SUNSU-AS-006':39,'SUNSU-AS-007':40,
    'SUNSU-ML-001':41,'SUNSU-ML-002':42,'SUNSU-ML-003':43,'SUNSU-ML-004':44,
    'SUNSU-ML-005':45,'SUNSU-ML-007':46,'SUNSU-ML-008':47,'SUNSU-ML-009':48,
    'SUNSU-ML-010':49,'SUNSU-ML-011':50,
    'SUNSU-PH-001':51,'SUNSU-PH-002':52,'SUNSU-PH-003':53,'SUNSU-PH-004':54,
    'SUNSU-PH-007':55,'SUNSU-PH-008':56,
    'SUNSU-JN-001':57,'SUNSU-JN-002':58,'SUNSU-JN-003':59,'SUNSU-JN-004':60,
    'SUNSU-BV-001':61,
    'SUNSU-SU-001':62,'SUNSU-SU-002':63,'SUNSU-SU-003':64,'SUNSU-SU-004':65,
    'SUNSU-SU-005':66,'SUNSU-SU-006':67,'SUNSU-SU-007':68,
    'SUNSU-SU-008':69,'SUNSU-SU-009':70,
  };
  var productosPayload={};
  PROVS.forEach(function(pv){pv.prods.forEach(function(p){
    var qEl=document.getElementById('pq-'+p.sku);
    var q=qEl?parseInt(qEl.value)||0:0;
    if(q>0) productosPayload[p.sku]=q;
  });});

  // Facial text
  var facSku=get('et-facial');
  var facObj=facSku?FACIALES.find(function(f){return f.sku===facSku;}):null;
  var facTxt=facObj?(facSku+' '+facObj.n):'';

  // Pack3 text
  var p3Sku=get('et-pack3');
  var p3Obj=p3Sku?PAQ3.find(function(p){return p.sku===p3Sku;}):null;
  var p3Txt=p3Obj?(p3Sku+' '+p3Obj.n):'';

  // Pack6 text
  var p6Sku=get('et-pack6');
  var p6Obj=p6Sku?PAQ6.find(function(p){return p.sku===p6Sku;}):null;
  var p6Txt=p6Obj?(p6Sku+' '+p6Obj.n):'';

  // GC colS
  var gcTipo=get('et-gc-tipo').trim();
  var gcCod=get('et-gc-cod').trim();
  var gcNota=get('et-gc-nota').trim();
  var colS=gcTipo?(gcTipo+(gcCod?', '+gcCod:'')+(gcNota?', '+gcNota:'')):'';

  var payload={
    accion:'editarTicket',
    tkRow: tkRow,
    cedula:   get('et-ced'),
    nombre:   get('et-nom'),
    apellido: get('et-ape'),
    facial:   facTxt,
    pack3:    p3Txt,
    pack6:    p6Txt,
    extras:   extrasStr,
    cobro:    get('et-cobro'),
    estimado: parseFloat(get('et-total'))||0,
    fechaRetorno: get('et-fret'),
    colR:     get('et-colR'),
    colS:     colS,
    recomendaciones: get('et-recom'),
    notas:    get('et-notas'),
    productos: productosPayload,
    prodColMap: PROD_COL_MAP,
  };

  btn.disabled=true; btn.textContent='⏳ Guardando...';
  fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)})
  .then(function(r){return r.json();})
  .then(function(d){
    btn.disabled=false; btn.textContent='💾 Guardar cambios';
    if(d.ok){
      msg.style.display='block'; msg.style.background='var(--green-l)'; msg.style.color='var(--green)';
      msg.textContent='✅ Guardado correctamente';
      if(_histData){
        var t=_histData.find(function(x){return x.tkRow===tkRow;});
        if(t){t.cedula=payload.cedula;t.nombre=payload.nombre;t.apellido=payload.apellido;
          t.recomendaciones=payload.recomendaciones;t.notas=payload.notas;
          t.facial=payload.facial;t.pack3=payload.pack3;t.pack6=payload.pack6;
          t.estimado=String(payload.estimado);t.extras=payload.extras;t.colS=payload.colS;t.colR=payload.colR;}
      }
      setTimeout(function(){var ov=document.getElementById('edit-overlay');if(ov)ov.remove();},1200);
    } else {
      msg.style.display='block'; msg.style.background='var(--red-l)'; msg.style.color='var(--red)';
      msg.textContent='❌ '+(d.error||'Error al guardar');
    }
  })
  .catch(function(){
    btn.disabled=false; btn.textContent='💾 Guardar cambios';
    msg.style.display='block'; msg.style.background='var(--red-l)'; msg.style.color='var(--red)';
    msg.textContent='❌ Error de conexión';
  });
}

function toggleExclusion(tkRow, tipo){
  var colMap={facial:71, paquete:72, producto:73, extras:74}; // BS/BT/BU/BV — solo fallback; el backend resuelve por 'tipo' leyendo encabezados
  var idMap={facial:'excl-fac-', paquete:'excl-paq-', producto:'excl-prod-', extras:'excl-ext-'};
  var labelMap={facial:'💆 Facial', paquete:'📋 Paquete', producto:'🧴 Producto', extras:'✨ Extras'};
  var col=colMap[tipo];
  var btn=document.getElementById(idMap[tipo]+tkRow);
  if(!btn) return;

  // Toggle current state
  var isActive=btn.style.borderColor.indexOf('red')>=0||btn.dataset.active==='1';
  var newVal=!isActive;
  btn.dataset.active=newVal?'1':'0';

  // Update button style
  if(newVal){
    btn.style.borderColor='var(--red)'; btn.style.background='var(--red-l)'; btn.style.color='var(--red)';
    btn.textContent='✓ '+labelMap[tipo];
  } else {
    btn.style.borderColor='var(--gray-l)'; btn.style.background='white'; btn.style.color='var(--gray)';
    btn.textContent=labelMap[tipo];
  }

  // Save to sheet
  toast('Guardando...','var(--navy)');
  fetch(APPS_SCRIPT_URL,{
    method:'POST',
    headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({accion:'excluirComision', tkRow:tkRow, tipo:tipo, col:col, valor:newVal})
  })
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.ok){
      toast(newVal?'❌ Excluido de comisión':'✅ Incluido en comisión', newVal?'#B86B6B':'var(--green)');
      // Update local cache
      if(_histData){
        var t=_histData.find(function(x){return x.tkRow===tkRow;});
        if(t){
          if(tipo==='facial') t.exclFacial=newVal;
          else if(tipo==='paquete') t.exclPaquete=newVal;
          else if(tipo==='producto') t.exclProducto=newVal;
          else if(tipo==='extras') t.exclExtras=newVal;
        }
      }
    } else { toast('Error: '+(d.error||''),'#B86B6B'); }
  })
  .catch(function(){ toast('Error de conexión','#B86B6B'); });
}

// Conteo A CIEGAS: no se muestra el stock del sistema para que el conteo sea honesto.
function renderInvFisico(c){
  var items=window._invItems||[];
  if(!items.length){toast('Abre primero el Inventario','#C9A227');renderInventario(c);return;}
  var prefixNames={'HT':'HT — ANUA','AS':'AS — Eyenlip','ML':'ML — Dr.esthe','PH':'PH — APHLORA','JN':'JN — Varios','BV':'BV — Bruno Vassari','SU':'SU — SUNSU'};
  var grupos={};
  items.forEach(function(it,idx){
    var m=it.sku.match(/SUNSU-([A-Z]+)-/);
    var gn=prefixNames[m?m[1]:'OTROS']||('CÓDIGOS '+(m?m[1]:'OTROS'));
    (grupos[gn]=grupos[gn]||[]).push({it:it,idx:idx});
  });

function _ifProgreso(){
  var items=window._invItems||[], n=0;
  for(var i=0;i<items.length;i++){
    var el=document.getElementById('if-'+i);
    if(el&&el.value!=='') n++;
  }
  var p=document.getElementById('if-progreso');
  if(p){p.textContent=n+' / '+items.length+' contados';p.style.background=n===items.length?'#6A9E7A':'var(--navy)';}
}
function guardarInvFisico(){
  var items=window._invItems||[];
  var conteos=[], sinContar=0;
  items.forEach(function(it,i){
    var el=document.getElementById('if-'+i);
    if(el&&el.value!==''){conteos.push({sku:it.sku,nombre:it.nombre,sistema:it.stock,fisico:parseFloat(el.value)||0});}
    else sinContar++;
  });
  if(!conteos.length){toast('No has contado ningún producto','#C9A227');return;}
  if(sinContar>0&&!confirm('Hay '+sinContar+' producto(s) sin contar (quedaron vacíos).\n\n¿Guardar solo los '+conteos.length+' contados?')) return;
  toast('⏳ Guardando y cruzando...','var(--blue)');
  fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({accion:'guardarInvFisico',usuario:CU?CU.name:'—',conteos:conteos})})
  .then(function(r){return r.json();})
  .then(function(d){
    if(!d.ok){toast('❌ '+(d.error||'Error al guardar'),'#B86B6B');return;}
    _invFisicoResultados(d);
  })
  .catch(function(e){toast('❌ '+e.message,'#B86B6B');});
}

// ── Corregir un conteo mal tipeado (solo admin, con justificación obligatoria) ──
function corregirConteoIF(id, sku, actual){
  var nuevo=prompt('✏️ CORREGIR CONTEO\n\nCantidad registrada: '+actual+'\n¿Cuál es la cantidad REAL contada en percha?');
  if(nuevo===null) return;
  nuevo=parseFloat(nuevo);
  if(isNaN(nuevo)||nuevo<0){toast('Cantidad inválida','#C9A227');return;}
  var nota=prompt('Justificación (obligatoria):\nEj. "error de tipeo, se recontó en percha y son '+nuevo+'"');
  if(!nota||!nota.trim()){toast('La justificación es obligatoria','#C9A227');return;}
  toast('⏳ Corrigiendo...','var(--blue)');
  fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({accion:'resolverInvFisico',modo:'corregir',id:id,sku:sku,nuevoFisico:nuevo,nota:nota.trim(),usuario:CU?CU.name:'—'})})
  .then(function(r){return r.json();})
  .then(function(d){
    if(!d.ok){toast('❌ '+(d.error||'Error'),'#B86B6B');return;}
    toast(d.nuevaDif===0?'✅ Corregido — ahora cuadra':'✏️ Corregido — dif ahora: '+(d.nuevaDif>0?'+':'')+d.nuevaDif,'var(--green)');
    renderInvFisicoDetalle(id);
  })
  .catch(function(e){toast('❌ '+e.message,'#B86B6B');});
}
// ── Resolver una diferencia con explicación (ticket tardío, consumo interno, etc.) ──
function resolverIF(id, sku, nombre){
  var nota=prompt('✔️ RESOLVER DIFERENCIA — '+nombre+'\n\nExplica la corrección (obligatorio):\nEj. "faltó ticket de venta del 08/07, ingresado hoy por Daniela" o "consumo interno SUNSU no registrado"');
  if(!nota||!nota.trim()){if(nota!==null)toast('La justificación es obligatoria','#C9A227');return;}
  toast('⏳ Resolviendo...','var(--blue)');
  fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({accion:'resolverInvFisico',modo:'resolver',id:id,sku:sku,nota:nota.trim(),usuario:CU?CU.name:'—'})})
  .then(function(r){return r.json();})
  .then(function(d){
    if(!d.ok){toast('❌ '+(d.error||'Error'),'#B86B6B');return;}
    toast('✅ Diferencia resuelta y documentada','var(--green)');
    // Política: producto no registrado a tiempo → multa $10 a la responsable
    if(confirm('📋 Política de inventario:\n¿Registrar MULTA de $10 a la responsable por no registrar a tiempo?')){
      var quien=prompt('Nombre de la responsable (como aparece en Multas):');
      if(quien&&quien.trim()){
        fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
          body:JSON.stringify({accion:'registrarMulta',cosmetologa:quien.trim(),tipo:'MULTA',monto:10,
            motivo:'Inventario físico — '+nombre+' ('+sku+'): '+nota.trim()})})
        .then(function(r){return r.json();})
        .then(function(m){toast(m.ok?'⚠️ Multa de $10 registrada a '+quien.trim():'❌ No se pudo registrar la multa','#C4943A');})
        .catch(function(){toast('❌ Error registrando la multa','#B86B6B');});
      }
    }
    setTimeout(function(){renderInvFisicoDetalle(id);},400);
  })
  .catch(function(e){toast('❌ '+e.message,'#B86B6B');});
}
